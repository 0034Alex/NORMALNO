<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8E00FF">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NORMALNO">

<title>NORMALNO — Мої ставки</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; padding-bottom: 40px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .logo { font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 20px; }
  .tabs { display: flex; gap: 20px; border-bottom: 2px solid #eee; margin-bottom: 16px; }
  .tab { padding: 10px 0; cursor: pointer; color: #999; font-weight: bold; font-size: 14px; }
  .tab.active { color: #8E00FF; border-bottom: 3px solid #FF7A00; }
  .empty { text-align: center; color: #999; margin-top: 40px; }
  .hidden { display: none; }

  .bid-card { border: 1px solid #eee; border-radius: 14px; padding: 12px; margin-bottom: 14px; display: flex; gap: 12px; cursor: pointer; }
  .bid-photo { width: 72px; height: 72px; border-radius: 10px; overflow: hidden; background: #f2f2f2; flex-shrink: 0; }
  .bid-photo img { width: 100%; height: 100%; object-fit: cover; }
  .bid-noimg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #ccc; }
  .bid-info { flex: 1; min-width: 0; }
  .bid-title { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  .bid-row { font-size: 12px; color: #666; margin-bottom: 3px; }
  .bid-price { color: #8E00FF; font-weight: bold; font-size: 15px; }
  .bid-outcome { font-size: 12px; font-weight: bold; padding: 3px 10px; border-radius: 10px; display: inline-block; margin-top: 4px; }
  .outcome-won { background: #eafbe9; color: #1a8f2a; }
  .outcome-lost { background: #fff0f0; color: #cc0000; }
  .outcome-active { background: #fff4e0; color: #cc7a00; }
</style>
</head>
<body>

<a href="profile.html" class="back">&larr; Назад до профілю</a>
<div class="logo">Мої ставки</div>

<div class="tabs">
  <div class="tab active" id="tabActive" onclick="showTab('active')">Активні</div>
  <div class="tab" id="tabEnded" onclick="showTab('ended')">Завершені</div>
</div>

<div id="activeList">Завантаження...</div>
<div id="endedList" class="hidden"></div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);
  let sessionUserId = null;

  function lotStatus(car) {
    const now = new Date();
    const starts = new Date(car.auction_starts_at);
    const ends = new Date(car.auction_ends_at);
    if (now < starts) return 'awaiting';
    if (now < ends) return 'active';
    if (car.reserve_price && (car.current_bid || 0) < car.reserve_price) return 'reserve_not_met';
    return 'sold';
  }

  function showTab(tab) {
    document.getElementById('tabActive').classList.toggle('active', tab === 'active');
    document.getElementById('tabEnded').classList.toggle('active', tab === 'ended');
    document.getElementById('activeList').classList.toggle('hidden', tab !== 'active');
    document.getElementById('endedList').classList.toggle('hidden', tab !== 'ended');
  }

  function renderBidCard(car, mode) {
    const photos = carPhotos(car, 1);
    const price = car.current_bid || car.start_price || 0;
    const uah = convertToUAH(price, car.currency);
    const priceHtml = `${Number(price).toLocaleString('uk-UA')} ${car.currency}${uah ? ` <span style="color:#999;font-weight:normal;font-size:11px;">(≈${uah.toLocaleString('uk-UA')} грн)</span>` : ''}`;

    let outcomeHtml = '';
    if (mode === 'active') {
      const isLeading = car.current_bid_user_id === sessionUserId;
      outcomeHtml = `<span class="bid-outcome outcome-active">${isLeading ? 'Ви лідируєте' : 'Вас перебили'}</span>`;
    } else {
      const status = lotStatus(car);
      const won = status === 'sold' && car.current_bid_user_id === sessionUserId;
      if (status === 'sold' && won) outcomeHtml = `<span class="bid-outcome outcome-won">Ви виграли!</span>`;
      else if (status === 'sold') outcomeHtml = `<span class="bid-outcome outcome-lost">Виграв інший учасник</span>`;
      else outcomeHtml = `<span class="bid-outcome outcome-lost">Резерв не пройдено</span>`;
    }

    return `
      <div class="bid-card" onclick="window.location.href='lot.html?id=${car.id}'">
        <div class="bid-photo">${photos[0] ? `<img src="${photos[0]}" onerror="this.style.display='none'">` : `<div class="bid-noimg">🚗</div>`}</div>
        <div class="bid-info">
          <div class="bid-title">${car.brand} ${car.model}, ${car.year}</div>
          <div class="bid-row">Фінальна ставка</div>
          <div class="bid-price">${priceHtml}</div>
          <div class="bid-row">Ставок зроблено: ${car.bid_count || 0}</div>
          ${outcomeHtml}
        </div>
      </div>
    `;
  }

  async function load() {
    await ensureRatesLoaded();
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'register2.html'; return; }
    sessionUserId = session.user.id;

    const { data: bids } = await sb.from('bids').select('car_id').eq('user_id', sessionUserId);
    const carIds = [...new Set((bids || []).map(b => b.car_id))];

    if (carIds.length === 0) {
      document.getElementById('activeList').innerHTML = '<div class="empty">Ви ще не робили ставок на аукціонах</div>';
      document.getElementById('endedList').innerHTML = '<div class="empty">Немає завершених лотів</div>';
      return;
    }

    const { data: cars } = await sb.from('cars').select('*').in('id', carIds);
    const active = (cars || []).filter(c => lotStatus(c) === 'active' || lotStatus(c) === 'awaiting');
    const ended = (cars || []).filter(c => lotStatus(c) === 'sold' || lotStatus(c) === 'reserve_not_met');

    document.getElementById('activeList').innerHTML = active.length
      ? active.map(c => renderBidCard(c, 'active')).join('')
      : '<div class="empty">Немає активних ставок</div>';

    document.getElementById('endedList').innerHTML = ended.length
      ? ended.map(c => renderBidCard(c, 'ended')).join('')
      : '<div class="empty">Немає завершених лотів</div>';
  }

  load();
</script>

</body>
</html>
