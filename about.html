<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMALNO — Про додаток</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .logo { font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 20px; }
  .placeholder { text-align: center; color: #999; margin-top: 60px; font-size: 14px; line-height: 1.6; }
  .placeholder-icon { font-size: 40px; margin-bottom: 16px; }
</style>
</head>
<body>

<a href="profile.html" class="back">&larr; Назад до профілю</a>
<div class="logo">Про додаток</div>

<div class="placeholder">
  <div class="placeholder-icon">🚧</div>
  NORMALNO — маркетплейс авто в лізинг.<br>Версія 1.0.0
</div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch (e) {}

    if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) {
      try { tg.disableVerticalSwipes(); } catch (e) {}
    }

    function applyTgSafeArea() {
      const inset = tg.contentSafeAreaInset || tg.safeAreaInset || {};
      document.body.style.paddingTop = (inset.top || 0) + 'px';
    }
    if (tg.onEvent) {
      try {
        tg.onEvent('contentSafeAreaChanged', applyTgSafeArea);
        tg.onEvent('safeAreaChanged', applyTgSafeArea);
        tg.onEvent('fullscreenChanged', applyTgSafeArea);
      } catch (e) {}
    }

    if (tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen) {
      try { tg.requestFullscreen(); } catch (e) {}
    }
    applyTgSafeArea();
    setTimeout(applyTgSafeArea, 300);
  }
</script>
</body>
</html>
