<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8E00FF">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>NORMALNO — Редагувати оголошення</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js?v=1786440586"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #ffffff; margin: 0; padding: 20px; padding-bottom: 60px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .logo { text-align: center; font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 16px; }
  h2 { font-size: 15px; color: #666; margin: 20px 0 8px; }
  input, select, textarea {
    width: 100%; padding: 14px; margin-bottom: 10px; border: 1px solid #ddd;
    border-radius: 10px; font-size: 15px; font-family: Arial, sans-serif;
  }
  textarea { min-height: 90px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .check-row { display: flex; align-items: center; gap: 8px; padding: 10px 2px; font-size: 14px; }
  .check-row input { width: auto; margin: 0; }
  button.main {
    width: 100%; padding: 15px; background: #8E00FF; color: white; border: none;
    border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 14px;
  }
  .msg { text-align: center; margin-top: 12px; font-size: 14px; }
  #photoPreview { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  #photoPreview img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
  .hint { font-size: 11px; color: #999; margin: -6px 0 12px; }
</style>
</head>
<body>

<a href="my-listings.html" class="back" id="backLink">&larr; Назад</a>
<div class="logo" id="pageTitle">Редагувати оголошення</div>
<div class="subtitle" id="pageSubtitle"></div>

<h2>Тип</h2>
<select id="condition">
  <option value="">Стан — оберіть</option>
  <option value="new">Нове</option>
  <option value="used">Б/у</option>
  <option value="imported">Пригон</option>
</select>
<div class="picker-field ph" id="transportTypeField" onclick="openTransportTypePicker()">
  <span class="picker-value" id="transportTypeField_value">Тип транспорту — оберіть</span>
  <span class="picker-arrow">▾</span>
</div>
<div class="picker-field ph disabled" id="bodyTypeField" onclick="openBodyTypePicker()">
  <span class="picker-value" id="bodyTypeField_value">Спочатку оберіть тип транспорту</span>
  <span class="picker-arrow">▾</span>
</div>

<h2>Основне</h2>
<div class="picker-field ph" id="brandField" onclick="openBrandPicker()">
  <span class="picker-value" id="brandField_value">Марка — оберіть</span>
  <span class="picker-arrow">▾</span>
</div>
<div class="picker-field ph disabled" id="modelField" onclick="openModelPicker()">
  <span class="picker-value" id="modelField_value">Спочатку оберіть марку</span>
  <span class="picker-arrow">▾</span>
</div>
<div class="row">
  <input type="number" id="year" placeholder="Рік випуску">
  <input type="number" id="mileage" placeholder="Пробіг, км">
</div>
<div class="picker-field ph" id="regionField" onclick="openRegionPicker()">
  <span class="picker-value" id="regionField_value">Регіон — оберіть</span>
  <span class="picker-arrow">▾</span>
</div>
<div class="picker-field ph" id="colorField" onclick="openColorPicker()">
  <span class="picker-value" id="colorField_value">Колір — оберіть</span>
  <span class="picker-arrow">▾</span>
</div>

<h2>Ціна</h2>
<div class="row">
  <input type="number" id="price" placeholder="Ціна" autocomplete="off">
  <select id="currency">
    <option value="USD">$</option>
    <option value="EUR">€</option>
    <option value="UAH">грн</option>
  </select>
</div>

<h2>Характеристики</h2>
<select id="fuelType">
  <option value="">Тип палива — оберіть</option>
  <option value="petrol">Бензин</option>
  <option value="diesel">Дизель</option>
  <option value="hybrid">Гібрид</option>
  <option value="gas">Газ</option>
  <option value="electric">Електро</option>
</select>
<select id="transmission">
  <option value="">Коробка передач — оберіть</option>
  <option value="manual">Механіка</option>
  <option value="automatic">Автомат</option>
  <option value="variator">Варіатор</option>
</select>
<select id="driveType">
  <option value="">Тип приводу — оберіть</option>
  <option value="front">Передній</option>
  <option value="rear">Задній</option>
  <option value="all">Повний</option>
</select>
<div class="row">
  <input type="number" step="0.1" id="engineVolume" placeholder="Об'єм двигуна, л">
  <input type="number" id="powerHp" placeholder="Потужність, к.с.">
</div>
<select id="doors">
  <option value="">Кількість дверей</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
  <option value="5">5</option>
</select>
<input type="text" id="vinCode" placeholder="VIN-код (необов'язково)" maxlength="17" autocomplete="off">

<div class="check-row">
  <input type="checkbox" id="exchangePossible">
  <label for="exchangePossible">Можливий обмін</label>
</div>
<div class="check-row">
  <input type="checkbox" id="customsCleared">
  <label for="customsCleared">Розмитнене</label>
</div>
<div class="check-row">
  <input type="checkbox" id="isUrgent">
  <label for="isUrgent">Терміновий продаж</label>
</div>
<div class="check-row">
  <input type="checkbox" id="isHot">
  <label for="isHot">Гаряча пропозиція</label>
</div>

<h2>Фото та опис</h2>
<input type="file" id="photoFiles" accept="image/*" multiple>
<div class="hint">Додайте нові фото, щоб замінити поточні — до 10 шт.</div>
<div id="photoPreview"></div>
<textarea id="description" placeholder="Опис авто"></textarea>

<button class="main" id="saveBtn" onclick="saveListing()">Зберегти</button>
<div class="msg" id="msg"></div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  const params = new URLSearchParams(window.location.search);
  const carId = params.get('id');
  let currentCar = null;
  let sessionUserId = null;
  let existingPhotos = [];

  const TRANSPORT_TYPE_LABELS = {
    car: '🚗 Легкові', moto: '🏍️ Мото', truck: '🚛 Вантажівки', trailer: '🚚 Причепи',
    special: '🏗️ Спецтехніка', agro: '🚜 Сільгосптехніка', bus: '🚌 Автобуси',
    water: '🚤 Водний транспорт', air: '🚁 Повітряний транспорт', motorhome: '🚐 Автобудинки'
  };
  const CAR_COLORS = [
    'Білий', 'Чорний', 'Сірий', 'Сріблястий', 'Червоний', 'Синій', 'Блакитний',
    'Зелений', 'Жовтий', 'Помаранчевий', 'Коричневий', 'Бежевий', 'Бордовий',
    'Фіолетовий', 'Золотистий', 'Хамелеон', 'Інший'
  ];

  let selectedTransportType = '';
  let selectedBodyType = '';
  let selectedBrand = '';
  let selectedModel = '';
  let selectedRegion = '';
  let selectedColor = '';
  let currentModelsList = [];

  function setField(fieldId, value) {
    document.getElementById(fieldId + '_value').textContent = value;
    document.getElementById(fieldId).classList.remove('ph');
  }

  function openTransportTypePicker() {
    const labels = Object.values(TRANSPORT_TYPE_LABELS);
    openSearchPicker('Тип транспорту', labels, TRANSPORT_TYPE_LABELS[selectedTransportType] || '', (label) => {
      selectedTransportType = Object.keys(TRANSPORT_TYPE_LABELS).find(k => TRANSPORT_TYPE_LABELS[k] === label);
      setField('transportTypeField', label);
      onTransportTypeChange();
    });
  }

  function onTransportTypeChange() {
    selectedBodyType = '';
    const bodyField = document.getElementById('bodyTypeField');
    const options = BODY_TYPES_BY_TRANSPORT[selectedTransportType] || [];
    document.getElementById('bodyTypeField_value').textContent = options.length ? 'Тип кузова — оберіть' : 'Спочатку оберіть тип транспорту';
    bodyField.classList.toggle('disabled', options.length === 0);
    bodyField.classList.add('ph');
  }

  function openBodyTypePicker() {
    if (!selectedTransportType) return;
    const options = BODY_TYPES_BY_TRANSPORT[selectedTransportType] || [];
    openSearchPicker('Тип кузова', options, selectedBodyType, (val) => {
      selectedBodyType = val;
      setField('bodyTypeField', val);
    });
  }

  async function openBrandPicker() {
    const brands = await fetchAllBrands();
    openSearchPicker('Марка авто', brands, selectedBrand, (val) => {
      selectedBrand = val;
      setField('brandField', val);
      onBrandChange();
    });
  }

  async function onBrandChange() {
    selectedModel = '';
    const modelField = document.getElementById('modelField');
    modelField.classList.add('disabled');
    document.getElementById('modelField_value').textContent = 'Завантаження моделей...';
    currentModelsList = await fetchModelsForBrand(selectedBrand);
    modelField.classList.remove('disabled');
    modelField.classList.add('ph');
    document.getElementById('modelField_value').textContent = 'Модель — оберіть';
  }

  function openModelPicker() {
    if (!selectedBrand) return;
    openSearchPicker('Модель', currentModelsList, selectedModel, (val) => {
      selectedModel = val;
      setField('modelField', val);
    });
  }

  function openRegionPicker() {
    openSearchPicker('Регіон', UA_REGIONS, selectedRegion, (val) => {
      selectedRegion = val;
      setField('regionField', val);
    });
  }

  function openColorPicker() {
    openSearchPicker('Колір', CAR_COLORS, selectedColor, (val) => {
      selectedColor = val;
      setField('colorField', val);
    });
  }

  async function load() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'register2.html'; return; }
    sessionUserId = session.user.id;

    const { data: car, error } = await sb.from('cars').select('*').eq('id', carId).single();
    if (error || !car || car.user_id !== sessionUserId) {
      document.body.innerHTML = '<div style="text-align:center; margin-top:60px; color:#999;">Оголошення не знайдено або немає доступу</div>';
      return;
    }
    currentCar = car;

    if (car.archived) {
      document.getElementById('pageTitle').textContent = 'Виставити авто знову';
      document.getElementById('pageSubtitle').textContent = 'Перевірте дані та натисніть "Виставити"';
      document.getElementById('saveBtn').textContent = 'Виставити оголошення';
      document.getElementById('backLink').href = 'my-archive.html';
    }

    document.getElementById('condition').value = car.condition || '';
    document.getElementById('year').value = car.year || '';
    document.getElementById('mileage').value = car.mileage || '';
    document.getElementById('price').value = car.price || '';
    document.getElementById('currency').value = car.currency || 'USD';
    document.getElementById('fuelType').value = car.fuel_type || '';
    document.getElementById('transmission').value = car.transmission || '';
    document.getElementById('driveType').value = car.drive_type || '';
    document.getElementById('engineVolume').value = car.engine_volume || '';
    document.getElementById('powerHp').value = car.power_hp || '';
    document.getElementById('doors').value = car.doors || '';
    document.getElementById('vinCode').value = car.vin_code || '';
    document.getElementById('description').value = car.description || '';
    document.getElementById('exchangePossible').checked = !!car.exchange_possible;
    document.getElementById('customsCleared').checked = !!car.customs_cleared;
    document.getElementById('isUrgent').checked = !!car.is_urgent;
    document.getElementById('isHot').checked = !!car.is_hot;

    if (car.transport_type) {
      selectedTransportType = car.transport_type;
      setField('transportTypeField', TRANSPORT_TYPE_LABELS[car.transport_type] || car.transport_type);
      const options = BODY_TYPES_BY_TRANSPORT[car.transport_type] || [];
      document.getElementById('bodyTypeField').classList.remove('disabled');
    }
    if (car.body_type) { selectedBodyType = car.body_type; setField('bodyTypeField', car.body_type); }
    if (car.brand) { selectedBrand = car.brand; setField('brandField', car.brand); currentModelsList = await fetchModelsForBrand(car.brand); document.getElementById('modelField').classList.remove('disabled'); }
    if (car.model) { selectedModel = car.model; setField('modelField', car.model); }
    if (car.region) { selectedRegion = car.region; setField('regionField', car.region); }
    if (car.color) { selectedColor = car.color; setField('colorField', car.color); }

    existingPhotos = carPhotos(car);
    renderExistingPhotos();
  }

  function renderExistingPhotos() {
    document.getElementById('photoPreview').innerHTML = existingPhotos.map(p => `<img src="${p}">`).join('');
  }

  document.getElementById('photoFiles').addEventListener('change', function() {
    const preview = document.getElementById('photoPreview');
    preview.innerHTML = '';
    const files = Array.from(this.files).slice(0, 10);
    if (this.files.length > 10) alert('Можна завантажити максимум 10 фото.');
    files.forEach(file => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      preview.appendChild(img);
    });
  });

  async function uploadNewPhotos() {
    const files = Array.from(document.getElementById('photoFiles').files).slice(0, 10);
    if (files.length === 0) return null;
    const urls = [];
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const ext = file.name.split('.').pop();
      const path = `${sessionUserId}/${Date.now()}-${i}.${ext}`;
      const { error } = await sb.storage.from('car-photos').upload(path, file);
      if (error) continue;
      const { data } = sb.storage.from('car-photos').getPublicUrl(path);
      urls.push(data.publicUrl);
    }
    return urls;
  }

  async function saveListing() {
    const msg = document.getElementById('msg');
    const newPrice = parseFloat(document.getElementById('price').value);
    const year = document.getElementById('year').value;

    if (!selectedBrand || !selectedModel || !year || !newPrice) {
      msg.textContent = 'Заповніть хоча б марку, модель, рік і ціну';
      msg.style.color = 'red';
      return;
    }

    msg.textContent = 'Зберігаємо...';
    msg.style.color = '#8E00FF';

    const updateData = {
      condition: document.getElementById('condition').value,
      transport_type: selectedTransportType,
      body_type: selectedBodyType,
      brand: selectedBrand,
      model: selectedModel,
      year: parseInt(year),
      mileage: parseInt(document.getElementById('mileage').value) || null,
      region: selectedRegion,
      color: selectedColor,
      currency: document.getElementById('currency').value,
      fuel_type: document.getElementById('fuelType').value,
      transmission: document.getElementById('transmission').value,
      drive_type: document.getElementById('driveType').value,
      engine_volume: parseFloat(document.getElementById('engineVolume').value) || null,
      power_hp: parseInt(document.getElementById('powerHp').value) || null,
      doors: parseInt(document.getElementById('doors').value) || null,
      vin_code: document.getElementById('vinCode').value.trim().toUpperCase(),
      description: document.getElementById('description').value,
      exchange_possible: document.getElementById('exchangePossible').checked,
      customs_cleared: document.getElementById('customsCleared').checked,
      is_urgent: document.getElementById('isUrgent').checked,
      is_hot: document.getElementById('isHot').checked
    };

    const priceDropped = newPrice < currentCar.price;
    if (newPrice !== currentCar.price) {
      updateData.previous_price = currentCar.price;
      updateData.price = newPrice;
    }

    const newPhotos = await uploadNewPhotos();
    if (newPhotos && newPhotos.length > 0) {
      updateData.photos = newPhotos;
      updateData.photo_url = newPhotos[0];
    }

    if (currentCar.archived) {
      updateData.archived = false;
      updateData.sold = false;
      updateData.sold_via = null;
      updateData.created_at = new Date().toISOString();
    }

    const { error } = await sb.from('cars').update(updateData).eq('id', carId);

    if (error) {
      msg.textContent = error.message;
      msg.style.color = 'red';
      return;
    }

    if (priceDropped) {
      fetch('/api/notify-price-drop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          carId: carId,
          carLabel: `${currentCar.brand} ${currentCar.model}, ${currentCar.year}`,
          oldPrice: currentCar.price,
          newPrice: newPrice,
          currency: currentCar.currency
        })
      }).catch(() => {});
    }

    msg.textContent = currentCar.archived ? 'Оголошення знову активне!' : 'Збережено!';
    msg.style.color = 'green';
    setTimeout(() => { window.location.href = currentCar.archived ? 'index.html' : 'my-listings.html'; }, 1000);
  }

  load();
</script>

</body>
</html>
