<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMALNO — Пошук за параметрами</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .logo { text-align: center; font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 20px; }
  h3 { font-size: 14px; color: #666; margin: 18px 0 8px; }
  input, select {
    width: 100%; padding: 13px; margin-bottom: 10px; border: 1px solid #ddd;
    border-radius: 10px; font-size: 14px; font-family: Arial, sans-serif;
  }
  select:disabled { color: #bbb; background: #fafafa; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .check-row { display: flex; align-items: center; gap: 8px; padding: 8px 2px; font-size: 14px; }
  .check-row input { width: auto; margin: 0; }
  button.main {
    width: 100%; padding: 15px; background: #FF7A00; color: white; border: none;
    border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
  }
  .count { text-align: center; color: #999; font-size: 13px; margin-top: 8px; }

  .results { margin-top: 20px; }
  .empty { text-align: center; color: #999; margin-top: 30px; }

  .ncard { border-radius: 14px; overflow: hidden; border: 1px solid #eee; margin-bottom: 16px; background: #fff; }
  .ncard-photo { position: relative; width: 100%; aspect-ratio: 16/10; background: #f2f2f2; overflow: hidden; }
  .ncard-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ncard-noimg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #ccc; }
  .ncard-watermark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-25deg);
    font-size: 20px; font-weight: bold; color: rgba(255,255,255,0.55);
    text-shadow: 0 0 6px rgba(0,0,0,0.35); letter-spacing: 2px; pointer-events: none;
  }
  .ncard-heart {
    position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #8E00FF;
  }
  .ncard-body { padding: 12px 14px 14px; }
  .ncard-title { font-weight: bold; font-size: 16px; margin-bottom: 2px; }
  .ncard-subtitle { color: #999; font-size: 12px; margin-bottom: 6px; }
  .ncard-price { color: #8E00FF; font-weight: bold; font-size: 18px; margin-bottom: 8px; }
  .ncard-specs { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: #555; margin-bottom: 8px; }
  .ncard-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .ncard-badge { background: #f5e6ff; color: #8E00FF; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
  .ncard-time { color: #bbb; font-size: 11px; }

</style>
</head>
<body>

<a href="index.html" class="back">&larr; Назад на головну</a>
<div class="logo">Пошук за параметрами</div>

<h3>Ключове слово</h3>
<input type="text" id="fKeyword" placeholder="Пошук у описі оголошень">

<h3>Тип</h3>
<select id="fCondition">
  <option value="">Стан — всі</option>
  <option value="new">Нове</option>
  <option value="used">Б/у</option>
  <option value="imported">Пригон</option>
</select>
<select id="fTransportType" onchange="onFilterTransportTypeChange()">
  <option value="">Тип транспорту — всі</option>
  <option value="car">🚗 Легкові</option>
  <option value="moto">🏍️ Мото</option>
  <option value="truck">🚛 Вантажівки</option>
  <option value="trailer">🚚 Причепи</option>
  <option value="special">🏗️ Спецтехніка</option>
  <option value="agro">🚜 Сільгосптехніка</option>
  <option value="bus">🚌 Автобуси</option>
  <option value="water">🚤 Водний транспорт</option>
  <option value="air">🚁 Повітряний транспорт</option>
  <option value="motorhome">🚐 Автобудинки</option>
</select>
<select id="fBodyType" disabled>
  <option value="">Спочатку оберіть тип транспорту</option>
</select>

<h3>Марка і модель</h3>
<select id="fBrand" onchange="onFilterBrandChange()"></select>
<select id="fModel" disabled></select>
<input type="text" id="fColor" placeholder="Колір">

<h3>Рік випуску</h3>
<div class="row">
  <input type="number" id="fYearFrom" placeholder="Від">
  <input type="number" id="fYearTo" placeholder="До">
</div>

<h3>Регіон</h3>
<select id="fRegion"></select>

<h3>Ціна</h3>
<div class="row">
  <input type="number" id="fPriceFrom" placeholder="Від">
  <input type="number" id="fPriceTo" placeholder="До">
  <select id="fCurrency">
    <option value="">Валюта</option>
    <option value="USD">$</option>
    <option value="EUR">€</option>
    <option value="UAH">грн</option>
  </select>
</div>
<select id="fPaymentType">
  <option value="">Тип оплати — всі</option>
  <option value="cash">Готівка</option>
  <option value="credit">Кредит</option>
  <option value="leasing">Лізинг</option>
  <option value="installment">Розстрочка</option>
  <option value="transfer">Переказ на рахунок</option>
  <option value="tradein">Трейд-ін</option>
</select>

<h3>Характеристики</h3>
<select id="fFuel">
  <option value="">Тип палива — всі</option>
  <option value="petrol">Бензин</option>
  <option value="diesel">Дизель</option>
  <option value="hybrid">Гібрид</option>
  <option value="gas">Газ</option>
  <option value="electric">Електро</option>
</select>
<select id="fTransmission">
  <option value="">Коробка передач — всі</option>
  <option value="manual">Механіка</option>
  <option value="automatic">Автомат</option>
  <option value="variator">Варіатор</option>
</select>
<select id="fDriveType">
  <option value="">Тип приводу — всі</option>
  <option value="front">Передній</option>
  <option value="rear">Задній</option>
  <option value="all">Повний</option>
</select>
<div class="row">
  <input type="number" id="fMileageFrom" placeholder="Пробіг від, км">
  <input type="number" id="fMileageTo" placeholder="Пробіг до, км">
</div>
<div class="row">
  <input type="number" step="0.1" id="fEngineFrom" placeholder="Об'єм двиг. від">
  <input type="number" step="0.1" id="fEngineTo" placeholder="Об'єм двиг. до">
</div>
<div class="row">
  <input type="number" id="fPowerFrom" placeholder="Потужність від, к.с.">
  <input type="number" id="fPowerTo" placeholder="Потужність до, к.с.">
</div>
<select id="fDoors">
  <option value="">Кількість дверей — всі</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
  <option value="5">5</option>
</select>
<select id="fOwnersCount">
  <option value="">Кількість власників — всі</option>
  <option value="1">1</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4+</option>
</select>

<div class="check-row">
  <input type="checkbox" id="fExchangePossible">
  <label for="fExchangePossible">Тільки з можливістю обміну</label>
</div>
<div class="check-row">
  <input type="checkbox" id="fCustomsCleared">
  <label for="fCustomsCleared">Тільки розмитнені</label>
</div>

<h3>Сортування</h3>
<select id="fSort">
  <option value="date_desc">Спочатку нові оголошення</option>
  <option value="price_asc">Ціна: спочатку дешевші</option>
  <option value="price_desc">Ціна: спочатку дорожчі</option>
  <option value="year_desc">Рік: спочатку новіші авто</option>
  <option value="mileage_asc">Пробіг: спочатку менший</option>
</select>

<button class="main" onclick="search()">ПОКАЗАТИ</button>
<div class="count" id="count"></div>

<div class="results" id="results"></div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  function onFilterTransportTypeChange() {
    const transportType = document.getElementById('fTransportType').value;
    populateBodyTypeSelect(document.getElementById('fBodyType'), transportType, 'Тип кузова — всі');
  }

  populateBrandSelect(document.getElementById('fBrand'));
  populateRegionSelect(document.getElementById('fRegion'), 'Регіон — всі');

  async function onFilterBrandChange() {
    const brand = document.getElementById('fBrand').value;
    await populateModelSelect(document.getElementById('fModel'), brand, 'Модель — всі');
  }

  async function search() {
    const countEl = document.getElementById('count');
    const resultsEl = document.getElementById('results');
    countEl.textContent = 'Шукаємо...';
    resultsEl.innerHTML = '';

    let query = sb.from('cars').select('*');

    const keyword = document.getElementById('fKeyword').value.trim();
    const brand = document.getElementById('fBrand').value;
    const model = document.getElementById('fModel').value;
    const color = document.getElementById('fColor').value.trim();
    const yearFrom = document.getElementById('fYearFrom').value;
    const yearTo = document.getElementById('fYearTo').value;
    const priceFrom = document.getElementById('fPriceFrom').value;
    const priceTo = document.getElementById('fPriceTo').value;
    const currency = document.getElementById('fCurrency').value;
    const mileageFrom = document.getElementById('fMileageFrom').value;
    const mileageTo = document.getElementById('fMileageTo').value;
    const fuel = document.getElementById('fFuel').value;
    const transmission = document.getElementById('fTransmission').value;
    const region = document.getElementById('fRegion').value;
    const condition = document.getElementById('fCondition').value;
    const transportType = document.getElementById('fTransportType').value;
    const bodyType = document.getElementById('fBodyType').value;
    const driveType = document.getElementById('fDriveType').value;
    const paymentType = document.getElementById('fPaymentType').value;
    const engineFrom = document.getElementById('fEngineFrom').value;
    const engineTo = document.getElementById('fEngineTo').value;
    const powerFrom = document.getElementById('fPowerFrom').value;
    const powerTo = document.getElementById('fPowerTo').value;
    const doors = document.getElementById('fDoors').value;
    const ownersCount = document.getElementById('fOwnersCount').value;
    const exchangePossible = document.getElementById('fExchangePossible').checked;
    const customsCleared = document.getElementById('fCustomsCleared').checked;
    const sort = document.getElementById('fSort').value;

    if (keyword) query = query.ilike('description', `%${keyword}%`);
    if (brand) query = query.eq('brand', brand);
    if (model) query = query.eq('model', model);
    if (color) query = query.ilike('color', `%${color}%`);
    if (yearFrom) query = query.gte('year', parseInt(yearFrom));
    if (yearTo) query = query.lte('year', parseInt(yearTo));
    if (priceFrom) query = query.gte('price', parseFloat(priceFrom));
    if (priceTo) query = query.lte('price', parseFloat(priceTo));
    if (currency) query = query.eq('currency', currency);
    if (mileageFrom) query = query.gte('mileage', parseInt(mileageFrom));
    if (mileageTo) query = query.lte('mileage', parseInt(mileageTo));
    if (fuel) query = query.eq('fuel_type', fuel);
    if (transmission) query = query.eq('transmission', transmission);
    if (region) query = query.eq('region', region);
    if (condition) query = query.eq('condition', condition);
    if (transportType) query = query.eq('transport_type', transportType);
    if (bodyType) query = query.eq('body_type', bodyType);
    if (driveType) query = query.eq('drive_type', driveType);
    if (paymentType) query = query.eq('payment_type', paymentType);
    if (engineFrom) query = query.gte('engine_volume', parseFloat(engineFrom));
    if (engineTo) query = query.lte('engine_volume', parseFloat(engineTo));
    if (powerFrom) query = query.gte('power_hp', parseInt(powerFrom));
    if (powerTo) query = query.lte('power_hp', parseInt(powerTo));
    if (doors) query = query.eq('doors', parseInt(doors));
    if (ownersCount) query = query.eq('owners_count', parseInt(ownersCount));
    if (exchangePossible) query = query.eq('exchange_possible', true);
    if (customsCleared) query = query.eq('customs_cleared', true);

    if (sort === 'price_asc') query = query.order('price', { ascending: true });
    else if (sort === 'price_desc') query = query.order('price', { ascending: false });
    else if (sort === 'year_desc') query = query.order('year', { ascending: false });
    else if (sort === 'mileage_asc') query = query.order('mileage', { ascending: true });
    else query = query.order('created_at', { ascending: false });

    const { data: cars, error } = await query;

    if (error) {
      countEl.textContent = 'Помилка: ' + error.message;
      return;
    }

    if (!cars || cars.length === 0) {
      countEl.textContent = 'Знайдено: 0';
      resultsEl.innerHTML = '<div class="empty">Нічого не знайдено за цими параметрами</div>';
      return;
    }

    countEl.textContent = 'Знайдено: ' + cars.length;
    resultsEl.innerHTML = cars.map(car => renderCarCard(car)).join('');
  }
</script>

</body>
</html>
