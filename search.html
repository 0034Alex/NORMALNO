<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMALNO — Пошук за параметрами</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .logo { text-align: center; font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 20px; }
  h3 { font-size: 14px; color: #666; margin: 18px 0 8px; }
  input, select {
    width: 100%; padding: 13px; margin-bottom: 10px; border: 1px solid #ddd;
    border-radius: 10px; font-size: 14px; font-family: Arial, sans-serif;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  button.main {
    width: 100%; padding: 15px; background: #FF7A00; color: white; border: none;
    border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
  }
  .count { text-align: center; color: #999; font-size: 13px; margin-top: 8px; }

  .results { margin-top: 20px; }
  .car-card {
    border: 1px solid #eee; border-radius: 12px; padding: 12px;
    margin-bottom: 12px; display: flex; gap: 12px;
  }
  .car-card img { width: 90px; height: 70px; object-fit: cover; border-radius: 8px; background: #f5f5f5; }
  .car-card .info { flex: 1; }
  .car-card .title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
  .car-card .price { color: #8E00FF; font-weight: bold; font-size: 16px; margin-bottom: 4px; }
  .car-card .details { color: #999; font-size: 12px; }
  .empty { text-align: center; color: #999; margin-top: 30px; }
</style>
</head>
<body>

<a href="index.html" class="back">&larr; Назад на головну</a>
<div class="logo">Пошук за параметрами</div>

<h3>Тип</h3>
<select id="fCondition">
  <option value="">Стан — всі</option>
  <option value="new">Нове</option>
  <option value="used">Б/у</option>
  <option value="imported">Пригон</option>
</select>
<select id="fTransportType">
  <option value="">Тип транспорту — всі</option>
  <option value="car">Легкове</option>
  <option value="moto">Мото</option>
  <option value="truck">Вантажне</option>
  <option value="water">Водне</option>
</select>
<select id="fBodyType">
  <option value="">Тип кузова — всі</option>
  <option value="sedan">Седан</option>
  <option value="hatchback">Хетчбек</option>
  <option value="coupe">Купе</option>
  <option value="suv">Позашляховик / SUV</option>
  <option value="wagon">Універсал</option>
  <option value="minivan">Мінівен</option>
  <option value="pickup">Пікап</option>
</select>

<h3>Марка і модель</h3>
<input type="text" id="fBrand" placeholder="Марка (напр. Toyota)">
<input type="text" id="fModel" placeholder="Модель (напр. Camry)">

<h3>Рік випуску</h3>
<div class="row">
  <input type="number" id="fYearFrom" placeholder="Від">
  <input type="number" id="fYearTo" placeholder="До">
</div>

<h3>Регіон</h3>
<input type="text" id="fRegion" placeholder="Регіон">

<h3>Ціна</h3>
<div class="row">
  <input type="number" id="fPriceFrom" placeholder="Від">
  <input type="number" id="fPriceTo" placeholder="До">
  <select id="fCurrency">
    <option value="">Валюта</option>
    <option value="USD">$</option>
    <option value="EUR">€</option>
    <option value="UAH">грн</option>
  </select>
</div>
<select id="fPaymentType">
  <option value="">Тип оплати — всі</option>
  <option value="cash">Готівка</option>
  <option value="credit">Кредит</option>
  <option value="leasing">Лізинг</option>
  <option value="installment">Розстрочка</option>
  <option value="transfer">Переказ на рахунок</option>
  <option value="tradein">Трейд-ін</option>
</select>

<h3>Характеристики</h3>
<select id="fFuel">
  <option value="">Тип палива — всі</option>
  <option value="petrol">Бензин</option>
  <option value="diesel">Дизель</option>
  <option value="hybrid">Гібрид</option>
  <option value="gas">Газ</option>
  <option value="electric">Електро</option>
</select>
<select id="fTransmission">
  <option value="">Коробка передач — всі</option>
  <option value="manual">Механіка</option>
  <option value="automatic">Автомат</option>
  <option value="variator">Варіатор</option>
</select>
<select id="fDriveType">
  <option value="">Тип приводу — всі</option>
  <option value="front">Передній</option>
  <option value="rear">Задній</option>
  <option value="all">Повний</option>
</select>
<div class="row">
  <input type="number" id="fMileageFrom" placeholder="Пробіг від, км">
  <input type="number" id="fMileageTo" placeholder="Пробіг до, км">
</div>
<div class="row">
  <input type="number" step="0.1" id="fEngineFrom" placeholder="Об'єм двиг. від">
  <input type="number" step="0.1" id="fEngineTo" placeholder="Об'єм двиг. до">
</div>

<button class="main" onclick="search()">ПОКАЗАТИ</button>
<div class="count" id="count"></div>

<div class="results" id="results"></div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function search() {
    const countEl = document.getElementById('count');
    const resultsEl = document.getElementById('results');
    countEl.textContent = 'Шукаємо...';
    resultsEl.innerHTML = '';

    let query = sb.from('cars').select('*');

    const brand = document.getElementById('fBrand').value.trim();
    const model = document.getElementById('fModel').value.trim();
    const yearFrom = document.getElementById('fYearFrom').value;
    const yearTo = document.getElementById('fYearTo').value;
    const priceFrom = document.getElementById('fPriceFrom').value;
    const priceTo = document.getElementById('fPriceTo').value;
    const currency = document.getElementById('fCurrency').value;
    const mileageFrom = document.getElementById('fMileageFrom').value;
    const mileageTo = document.getElementById('fMileageTo').value;
    const fuel = document.getElementById('fFuel').value;
    const transmission = document.getElementById('fTransmission').value;
    const region = document.getElementById('fRegion').value.trim();
    const condition = document.getElementById('fCondition').value;
    const transportType = document.getElementById('fTransportType').value;
    const bodyType = document.getElementById('fBodyType').value;
    const driveType = document.getElementById('fDriveType').value;
    const paymentType = document.getElementById('fPaymentType').value;
    const engineFrom = document.getElementById('fEngineFrom').value;
    const engineTo = document.getElementById('fEngineTo').value;

    if (brand) query = query.ilike('brand', `%${brand}%`);
    if (model) query = query.ilike('model', `%${model}%`);
    if (yearFrom) query = query.gte('year', parseInt(yearFrom));
    if (yearTo) query = query.lte('year', parseInt(yearTo));
    if (priceFrom) query = query.gte('price', parseFloat(priceFrom));
    if (priceTo) query = query.lte('price', parseFloat(priceTo));
    if (currency) query = query.eq('currency', currency);
    if (mileageFrom) query = query.gte('mileage', parseInt(mileageFrom));
    if (mileageTo) query = query.lte('mileage', parseInt(mileageTo));
    if (fuel) query = query.eq('fuel_type', fuel);
    if (transmission) query = query.eq('transmission', transmission);
    if (region) query = query.ilike('region', `%${region}%`);
    if (condition) query = query.eq('condition', condition);
    if (transportType) query = query.eq('transport_type', transportType);
    if (bodyType) query = query.eq('body_type', bodyType);
    if (driveType) query = query.eq('drive_type', driveType);
    if (paymentType) query = query.eq('payment_type', paymentType);
    if (engineFrom) query = query.gte('engine_volume', parseFloat(engineFrom));
    if (engineTo) query = query.lte('engine_volume', parseFloat(engineTo));

    query = query.order('created_at', { ascending: false });

    const { data: cars, error } = await query;

    if (error) {
      countEl.textContent = 'Помилка: ' + error.message;
      return;
    }

    if (!cars || cars.length === 0) {
      countEl.textContent = 'Знайдено: 0';
      resultsEl.innerHTML = '<div class="empty">Нічого не знайдено за цими параметрами</div>';
      return;
    }

    countEl.textContent = 'Знайдено: ' + cars.length;
    resultsEl.innerHTML = cars.map(car => `
      <div class="car-card">
        <img src="${car.photo_url || ''}" onerror="this.style.display='none'">
        <div class="info">
          <div class="title">${car.brand} ${car.model}, ${car.year}</div>
          <div class="price">${car.price} ${car.currency}</div>
          <div class="details">${car.mileage ? car.mileage + ' км' : ''} ${car.region ? '· ' + car.region : ''}</div>
        </div>
      </div>
    `).join('');
  }
</script>

</body>
</html>
