<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8E00FF">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NORMALNO">

<title>NORMALNO — Пошук за параметрами</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; padding-bottom: 90px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .logo { text-align: center; font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 20px; }
  h3 { font-size: 14px; color: #666; margin: 18px 0 8px; }
  input, select {
    width: 100%; padding: 13px; margin-bottom: 10px; border: 1px solid #ddd;
    border-radius: 10px; font-size: 14px; font-family: Arial, sans-serif;
  }
  select:disabled { color: #bbb; background: #fafafa; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .check-row { display: flex; align-items: center; gap: 8px; padding: 8px 2px; font-size: 14px; }
  .check-row input { width: auto; margin: 0; }
  .currency-row { display: flex; gap: 16px; padding: 4px 2px 12px; }
  .currency-row label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .currency-row input { width: auto; margin: 0; }

  .autosuggest { position: relative; }
  .suggest-list {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
    background: #fff; border: 1px solid #ddd; border-radius: 10px; max-height: 200px;
    overflow-y: auto; margin-top: -6px; display: none;
  }
  .suggest-list.open { display: block; }
  .suggest-item { padding: 10px 14px; font-size: 14px; cursor: pointer; }
  .suggest-item:hover { background: #f5e6ff; }

  .sticky-btn-wrap {
    position: fixed; bottom: 12px; left: 16px; right: 16px; z-index: 30;
  }
  button.main {
    width: 100%; padding: 15px; background: #FF7A00; color: white; border: none;
    border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }

  .results { margin-top: 20px; }
  .empty { text-align: center; color: #999; margin-top: 30px; }

  .ncard { border-radius: 14px; overflow: hidden; border: 1px solid #eee; margin-bottom: 16px; background: #fff; }
  .ncard-sold { opacity: 0.6; }
  .ncard-photo { position: relative; width: 100%; aspect-ratio: 16/10; background: #f2f2f2; overflow: hidden; }
  .ncard-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ncard-photo-scroll { display: flex; overflow-x: auto; width: 100%; height: 100%; scroll-snap-type: x mandatory; }
  .ncard-photo-scroll img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; }
  .ncard-dots { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; pointer-events: none; }
  .ncard-dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.6); box-shadow: 0 0 2px rgba(0,0,0,0.4); }
  .ncard-noimg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #ccc; }
  .ncard-watermark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-25deg);
    font-size: 20px; font-weight: bold; color: rgba(255,255,255,0.55);
    text-shadow: 0 0 6px rgba(0,0,0,0.35); letter-spacing: 2px; pointer-events: none;
  }
  .ncard-heart {
    position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #8E00FF;
  }
  .ncard-body { padding: 12px 14px 14px; }
  .ncard-title { font-weight: bold; font-size: 16px; margin-bottom: 2px; }
  .ncard-subtitle { color: #999; font-size: 12px; margin-bottom: 6px; }
  .ncard-price { color: #8E00FF; font-weight: bold; font-size: 18px; margin-bottom: 8px; }
  .ncard-price-uah { color: #999; font-weight: normal; font-size: 12px; }
  .ncard-price-old { color: #999; font-weight: normal; font-size: 13px; text-decoration: line-through; }
  .ncard-leasing { font-size: 11px; color: #FF7A00; background: #fff0e0; padding: 4px 8px; border-radius: 6px; margin-bottom: 8px; display: inline-block; }
  .ncard-specs { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: #555; margin-bottom: 8px; }
  .ncard-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .ncard-badge { background: #f5e6ff; color: #8E00FF; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
  .ncard-time { color: #bbb; font-size: 11px; }
  .ncard-sold-btn { margin-top: 8px; width: 100%; padding: 8px; background: #fff; border: 1px solid #8E00FF; color: #8E00FF; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }

  @media (min-width: 700px) {
    .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
    .ncard { margin-bottom: 0; }
    .ncard-photo { aspect-ratio: 4/3; }
  }
</style>
</head>
<body>

<a href="index.html" class="back">&larr; Назад на головну</a>
<div class="logo">Пошук за параметрами</div>

<h3>Тип</h3>
<select id="fCondition">
  <option value="">Стан — всі</option>
  <option value="new">Нове</option>
  <option value="used">Б/у</option>
  <option value="imported">Пригон</option>
</select>
<div class="picker-field ph" id="fTransportTypeField" onclick="openFTransportTypePicker()">
  <span class="picker-value" id="fTransportTypeField_value">Тип транспорту — всі</span>
  <span class="picker-arrow">▾</span>
</div>
<div class="picker-field ph disabled" id="fBodyTypeField" onclick="openFBodyTypePicker()">
  <span class="picker-value" id="fBodyTypeField_value">Спочатку оберіть тип транспорту</span>
  <span class="picker-arrow">▾</span>
</div>

<h3>Марка і модель</h3>
<div class="autosuggest">
  <input type="text" id="fBrand" placeholder="Марка (напр. Toyota, тойота)" autocomplete="off">
  <div class="suggest-list" id="brandSuggest"></div>
</div>
<div class="autosuggest">
  <input type="text" id="fModel" placeholder="Модель" autocomplete="off">
  <div class="suggest-list" id="modelSuggest"></div>
</div>
<input type="text" id="fColor" placeholder="Колір">

<h3>Рік випуску</h3>
<div class="row">
  <input type="number" id="fYearFrom" placeholder="Від">
  <input type="number" id="fYearTo" placeholder="До">
</div>

<h3>Регіон</h3>
<div class="picker-field ph" id="fRegionField" onclick="openFRegionPicker()">
  <span class="picker-value" id="fRegionField_value">Регіон — всі</span>
  <span class="picker-arrow">▾</span>
</div>

<h3>Ціна</h3>
<div class="row">
  <input type="number" id="fPriceFrom" placeholder="Від">
  <input type="number" id="fPriceTo" placeholder="До">
</div>
<div class="currency-row">
  <label><input type="checkbox" class="fCurrencyCb" value="USD"> $ USD</label>
  <label><input type="checkbox" class="fCurrencyCb" value="EUR"> € EUR</label>
  <label><input type="checkbox" class="fCurrencyCb" value="UAH"> грн UAH</label>
</div>
<h3>Характеристики</h3>
<select id="fFuel">
  <option value="">Тип палива — всі</option>
  <option value="petrol">Бензин</option>
  <option value="diesel">Дизель</option>
  <option value="hybrid">Гібрид</option>
  <option value="gas">Газ</option>
  <option value="electric">Електро</option>
</select>
<select id="fTransmission">
  <option value="">Коробка передач — всі</option>
  <option value="manual">Механіка</option>
  <option value="automatic">Автомат</option>
  <option value="variator">Варіатор</option>
</select>
<select id="fDriveType">
  <option value="">Тип приводу — всі</option>
  <option value="front">Передній</option>
  <option value="rear">Задній</option>
  <option value="all">Повний</option>
</select>
<div class="row">
  <input type="number" id="fMileageFrom" placeholder="Пробіг від, км">
  <input type="number" id="fMileageTo" placeholder="Пробіг до, км">
</div>
<div class="row">
  <input type="number" step="0.1" id="fEngineFrom" placeholder="Об'єм двиг. від">
  <input type="number" step="0.1" id="fEngineTo" placeholder="Об'єм двиг. до">
</div>
<div class="row">
  <input type="number" id="fPowerFrom" placeholder="Потужність від, к.с.">
  <input type="number" id="fPowerTo" placeholder="Потужність до, к.с.">
</div>
<select id="fDoors">
  <option value="">Кількість дверей — всі</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
  <option value="5">5</option>
</select>
<div class="check-row">
  <input type="checkbox" id="fExchangePossible">
  <label for="fExchangePossible">Тільки з можливістю обміну</label>
</div>
<div class="check-row">
  <input type="checkbox" id="fCustomsCleared">
  <label for="fCustomsCleared">Тільки розмитнені</label>
</div>

<h3>Сортування</h3>
<select id="fSort">
  <option value="date_desc">Спочатку нові оголошення</option>
  <option value="price_asc">Ціна: спочатку дешевші</option>
  <option value="price_desc">Ціна: спочатку дорожчі</option>
  <option value="year_desc">Рік: спочатку новіші авто</option>
  <option value="mileage_asc">Пробіг: спочатку менший</option>
</select>

<div class="results" id="results"></div>

<div class="sticky-btn-wrap">
  <button class="main" id="showBtn" onclick="showResults()">ПОКАЗАТИ</button>
</div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  let allCars = [];
  let currentUserId = null;
  let selectedBrand = '';
  let favoritedIds = new Set();

  const F_TRANSPORT_TYPE_LABELS = {
    car: '🚗 Легкові', moto: '🏍️ Мото', truck: '🚛 Вантажівки', trailer: '🚚 Причепи',
    special: '🏗️ Спецтехніка', agro: '🚜 Сільгосптехніка', bus: '🚌 Автобуси',
    water: '🚤 Водний транспорт', air: '🚁 Повітряний транспорт', motorhome: '🚐 Автобудинки'
  };
  let fSelectedTransportType = '';
  let fSelectedBodyType = '';
  let fSelectedRegion = '';

  function openFTransportTypePicker() {
    const labels = Object.values(F_TRANSPORT_TYPE_LABELS);
    openSearchPicker('Тип транспорту', labels, F_TRANSPORT_TYPE_LABELS[fSelectedTransportType] || '', (label) => {
      fSelectedTransportType = label ? Object.keys(F_TRANSPORT_TYPE_LABELS).find(k => F_TRANSPORT_TYPE_LABELS[k] === label) : '';
      document.getElementById('fTransportTypeField_value').textContent = label || 'Тип транспорту — всі';
      document.getElementById('fTransportTypeField').classList.toggle('ph', !label);
      onFilterTransportTypeChange();
    });
  }

  function openFBodyTypePicker() {
    if (!fSelectedTransportType) return;
    const options = BODY_TYPES_BY_TRANSPORT[fSelectedTransportType] || [];
    openSearchPicker('Тип кузова', options, fSelectedBodyType, (val) => {
      fSelectedBodyType = val;
      document.getElementById('fBodyTypeField_value').textContent = val;
      document.getElementById('fBodyTypeField').classList.remove('ph');
      updateCount();
    });
  }

  function openFRegionPicker() {
    openSearchPicker('Регіон', UA_REGIONS, fSelectedRegion, (val) => {
      fSelectedRegion = val;
      document.getElementById('fRegionField_value').textContent = val;
      document.getElementById('fRegionField').classList.remove('ph');
      updateCount();
    });
  }

  function onFilterTransportTypeChange() {
    fSelectedBodyType = '';
    const bodyField = document.getElementById('fBodyTypeField');
    const options = BODY_TYPES_BY_TRANSPORT[fSelectedTransportType] || [];
    document.getElementById('fBodyTypeField_value').textContent = options.length ? 'Тип кузова — всі' : 'Спочатку оберіть тип транспорту';
    bodyField.classList.toggle('disabled', options.length === 0);
    bodyField.classList.add('ph');
    updateCount();
  }

  async function init() {
    await ensureRatesLoaded();
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      currentUserId = session.user.id;
      const { data: favs } = await sb.from('favorites').select('car_id').eq('user_id', currentUserId);
      favoritedIds = new Set((favs || []).map(f => f.car_id));
    }

    const { data: cars } = await sb.from('cars').select('*').neq('listing_type', 'auction').eq('archived', false).order('created_at', { ascending: false });
    allCars = cars || [];
    updateCount();
  }

  window.toggleFavorite = async function(carId) {
    if (!currentUserId) return;
    if (favoritedIds.has(carId)) {
      await sb.from('favorites').delete().eq('user_id', currentUserId).eq('car_id', carId);
      favoritedIds.delete(carId);
    } else {
      await sb.from('favorites').insert({ user_id: currentUserId, car_id: carId });
      favoritedIds.add(carId);
    }
    showResults();
  };

  /* ---- автопідказка марки ---- */
  const brandInput = document.getElementById('fBrand');
  const brandSuggest = document.getElementById('brandSuggest');

  brandInput.addEventListener('input', async () => {
    const q = brandInput.value.trim();
    selectedBrand = '';
    if (!q) { brandSuggest.classList.remove('open'); updateCount(); return; }
    const matches = await suggestBrands(q, 12);
    if (matches.length === 0) { brandSuggest.classList.remove('open'); updateCount(); return; }
    brandSuggest.innerHTML = matches.map(b => `<div class="suggest-item" onclick="pickBrand('${b.replace(/'/g,"\\'")}')">${b}</div>`).join('');
    brandSuggest.classList.add('open');
    updateCount();
  });

  function pickBrand(b) {
    brandInput.value = b;
    selectedBrand = b;
    brandSuggest.classList.remove('open');
    updateCount();
  }

  /* ---- автопідказка моделі ---- */
  const modelInput = document.getElementById('fModel');
  const modelSuggest = document.getElementById('modelSuggest');

  modelInput.addEventListener('input', async () => {
    const q = modelInput.value.trim();
    if (!q) { modelSuggest.classList.remove('open'); updateCount(); return; }
    let candidates = [];
    if (selectedBrand) {
      candidates = await fetchModelsForBrand(selectedBrand);
    } else {
      candidates = Array.from(new Set(allCars.map(c => c.model).filter(Boolean)));
    }
    const matches = candidates.filter(m => matchesQuery(m, q)).slice(0, 12);
    if (matches.length === 0) { modelSuggest.classList.remove('open'); updateCount(); return; }
    modelSuggest.innerHTML = matches.map(m => `<div class="suggest-item" onclick="pickModel('${m.replace(/'/g,"\\'")}')">${m}</div>`).join('');
    modelSuggest.classList.add('open');
    updateCount();
  });

  function pickModel(m) {
    modelInput.value = m;
    modelSuggest.classList.remove('open');
    updateCount();
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.autosuggest')) {
      brandSuggest.classList.remove('open');
      modelSuggest.classList.remove('open');
    }
  });

  /* ---- фільтрація ---- */
  function getFilters() {
    return {
      brand: document.getElementById('fBrand').value.trim(),
      model: document.getElementById('fModel').value.trim(),
      color: document.getElementById('fColor').value.trim(),
      yearFrom: document.getElementById('fYearFrom').value,
      yearTo: document.getElementById('fYearTo').value,
      priceFrom: document.getElementById('fPriceFrom').value,
      priceTo: document.getElementById('fPriceTo').value,
      currencies: Array.from(document.querySelectorAll('.fCurrencyCb:checked')).map(c => c.value),
      mileageFrom: document.getElementById('fMileageFrom').value,
      mileageTo: document.getElementById('fMileageTo').value,
      fuel: document.getElementById('fFuel').value,
      transmission: document.getElementById('fTransmission').value,
      region: fSelectedRegion,
      condition: document.getElementById('fCondition').value,
      transportType: fSelectedTransportType,
      bodyType: fSelectedBodyType,
      driveType: document.getElementById('fDriveType').value,
      engineFrom: document.getElementById('fEngineFrom').value,
      engineTo: document.getElementById('fEngineTo').value,
      powerFrom: document.getElementById('fPowerFrom').value,
      powerTo: document.getElementById('fPowerTo').value,
      doors: document.getElementById('fDoors').value,
      exchangePossible: document.getElementById('fExchangePossible').checked,
      customsCleared: document.getElementById('fCustomsCleared').checked,
      sort: document.getElementById('fSort').value
    };
  }

  function applyFilters(cars, f) {
    return cars.filter(car => {
      if (f.brand && !matchesQuery(car.brand, f.brand)) return false;
      if (f.model && !matchesQuery(car.model, f.model)) return false;
      if (f.color && !matchesQuery(car.color, f.color)) return false;
      if (f.yearFrom && car.year < parseInt(f.yearFrom)) return false;
      if (f.yearTo && car.year > parseInt(f.yearTo)) return false;
      if (f.priceFrom && car.price < parseFloat(f.priceFrom)) return false;
      if (f.priceTo && car.price > parseFloat(f.priceTo)) return false;
      if (f.currencies.length && !f.currencies.includes(car.currency)) return false;
      if (f.mileageFrom && (car.mileage || 0) < parseInt(f.mileageFrom)) return false;
      if (f.mileageTo && (car.mileage || 0) > parseInt(f.mileageTo)) return false;
      if (f.fuel && car.fuel_type !== f.fuel) return false;
      if (f.transmission && car.transmission !== f.transmission) return false;
      if (f.region && car.region !== f.region) return false;
      if (f.condition && car.condition !== f.condition) return false;
      if (f.transportType && car.transport_type !== f.transportType) return false;
      if (f.bodyType && car.body_type !== f.bodyType) return false;
      if (f.driveType && car.drive_type !== f.driveType) return false;
      if (f.engineFrom && (car.engine_volume || 0) < parseFloat(f.engineFrom)) return false;
      if (f.engineTo && (car.engine_volume || 0) > parseFloat(f.engineTo)) return false;
      if (f.powerFrom && (car.power_hp || 0) < parseInt(f.powerFrom)) return false;
      if (f.powerTo && (car.power_hp || 0) > parseInt(f.powerTo)) return false;
      if (f.doors && car.doors !== parseInt(f.doors)) return false;
      if (f.exchangePossible && !car.exchange_possible) return false;
      if (f.customsCleared && !car.customs_cleared) return false;
      return true;
    });
  }

  function sortCars(cars, sort) {
    const arr = [...cars];
    if (sort === 'price_asc') arr.sort((a, b) => a.price - b.price);
    else if (sort === 'price_desc') arr.sort((a, b) => b.price - a.price);
    else if (sort === 'year_desc') arr.sort((a, b) => b.year - a.year);
    else if (sort === 'mileage_asc') arr.sort((a, b) => (a.mileage || 0) - (b.mileage || 0));
    else arr.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    return arr;
  }

  function updateCount() {
    const f = getFilters();
    const filtered = applyFilters(allCars, f);
    document.getElementById('showBtn').textContent = `ПОКАЗАТИ (${filtered.length})`;
  }

  function showResults() {
    const f = getFilters();
    const filtered = sortCars(applyFilters(allCars, f), f.sort);
    const resultsEl = document.getElementById('results');

    if (filtered.length === 0) {
      resultsEl.innerHTML = '<div class="empty">Нічого не знайдено за цими параметрами</div>';
      return;
    }
    resultsEl.innerHTML = filtered.map(car => renderCarCard(car, currentUserId, favoritedIds)).join('');
    resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.querySelectorAll('#fCondition, #fFuel, #fTransmission, #fDriveType, #fDoors, #fSort, #fColor, #fYearFrom, #fYearTo, #fPriceFrom, #fPriceTo, #fMileageFrom, #fMileageTo, #fEngineFrom, #fEngineTo, #fPowerFrom, #fPowerTo, #fExchangePossible, #fCustomsCleared')
    .forEach(el => el.addEventListener('input', updateCount));
  document.querySelectorAll('.fCurrencyCb').forEach(el => el.addEventListener('change', updateCount));

  init();
</script>

</body>
</html>
