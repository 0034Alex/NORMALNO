<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/admin-manifest.json">
<meta name="theme-color" content="#8E00FF">
<link rel="apple-touch-icon" href="/icons-admin/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM">
<title>CRM NORMALNO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js?v=1786440586"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; color: #222; margin: 0; padding: 16px; padding-bottom: 90px; }
  .logo { font-size: 20px; font-weight: bold; color: #222; }
  .logo span { color: #8E00FF; }
  .role-badge { display: inline-block; background: #f5e6ff; border: 1px solid #8E00FF; color: #8E00FF; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 20px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 16px; }
  .tab { flex-shrink: 0; padding: 9px 14px; border-radius: 20px; border: 1px solid #ddd; cursor: pointer; font-size: 13px; color: #666; white-space: nowrap; }
  .tab.active { background: #8E00FF; color: #fff; border-color: #8E00FF; }
  .card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card-type { font-size: 11px; font-weight: bold; color: #FF7A00; text-transform: uppercase; margin-bottom: 6px; }
  .card-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; color: #222; }
  .card-sub { color: #8E00FF; font-weight: bold; margin-bottom: 6px; }
  .card-details { font-size: 13px; color: #666; margin-bottom: 10px; white-space: pre-wrap; line-height: 1.5; }
  .card-time { font-size: 11px; color: #999; margin-bottom: 10px; }
  .status-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .status-btn { flex: 1; min-width: 80px; padding: 8px; border-radius: 8px; border: 1px solid #ddd; background: #f7f7f7; color: #666; font-size: 12px; cursor: pointer; }
  .status-btn.active-new { background: #fff4e0; border-color: #cc7a00; color: #cc7a00; }
  .status-btn.active-progress { background: #e0f0ff; border-color: #0066cc; color: #0066cc; }
  .status-btn.active-closed { background: #eafbe9; border-color: #1a8f2a; color: #1a8f2a; }
  .empty { text-align: center; color: #999; padding: 30px; }
  .denied { text-align: center; margin-top: 60px; color: #999; padding: 0 20px; }

  input, select, textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; background: #fff; color: #222; font-family: Arial, sans-serif; }
  textarea { min-height: 90px; resize: vertical; }
  button.action-btn { padding: 12px 18px; background: #8E00FF; color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-box { background: #f9f2ff; border: 1px solid #eee; border-radius: 12px; padding: 16px; text-align: center; }
  .stat-num { font-size: 26px; font-weight: bold; color: #8E00FF; }
  .stat-label { font-size: 11px; color: #666; margin-top: 4px; }

  .staff-card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .staff-name { font-weight: bold; color: #222; margin-bottom: 2px; }
  .staff-phone { color: #666; font-size: 12px; margin-bottom: 10px; }
  .perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 10px 0; }
  .perm-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #444; }
  .perm-item input { width: auto; margin: 0; }

  .hidden { display: none; }
  .toggle-switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; border-radius: 26px; transition: 0.2s; }
  .toggle-slider::before { content: ""; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
  .toggle-switch input:checked + .toggle-slider { background: #8E00FF; }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }

  /* Бокове меню */
  .topbar-admin { display: flex; align-items: center; justify-content: space-between; padding: 0 0 16px; }
  .hamburger-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #8E00FF; padding: 4px 8px; }
  .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 90; display: none; }
  .sidebar-overlay.open { display: block; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 260px; background: #fff;
    border-right: 1px solid #eee; z-index: 100; transform: translateX(-100%); transition: transform 0.2s;
    display: flex; flex-direction: column; padding: 20px 0;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-header { padding: 0 20px 16px; border-bottom: 1px solid #f5f5f5; margin-bottom: 10px; }
  .sidebar-logo { font-size: 18px; font-weight: bold; color: #222; }
  .sidebar-logo span { color: #8E00FF; }
  .sidebar-role { display: inline-block; background: #f5e6ff; color: #8E00FF; font-size: 11px; font-weight: bold; padding: 3px 10px; border-radius: 20px; margin-top: 8px; }
  .sidebar-nav { flex: 1; overflow-y: auto; }
  .sidebar-item {
    display: flex; align-items: center; gap: 12px; padding: 13px 20px; cursor: pointer;
    color: #555; font-size: 14px; font-weight: 600; border-left: 3px solid transparent;
  }
  .sidebar-item .icon { font-size: 18px; width: 22px; text-align: center; }
  .sidebar-item.active { background: #f9f2ff; color: #8E00FF; border-left-color: #FF7A00; }
  .sidebar-footer { padding: 12px 20px 0; border-top: 1px solid #f5f5f5; }
  .sidebar-logout { width: 100%; padding: 11px; background: #fff0f0; border: none; color: #cc0000; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; }

  .main-content { padding-top: 4px; }

  @media (min-width: 900px) {
    .hamburger-btn { display: none; }
    .sidebar { transform: translateX(0); box-shadow: none; }
    .sidebar-overlay { display: none !important; }
    body { padding-left: 276px; }
  }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: white; border-top: 1px solid #eee; padding: 8px 0; }
  .nav-item { flex: 1; text-align: center; padding: 8px 0; cursor: pointer; color: #999; font-size: 10px; }
  .nav-item.active { color: #8E00FF; font-weight: bold; }
  .nav-item .icon { font-size: 18px; display: block; margin-bottom: 2px; }
</style>
</head>
<body>

<div id="content">Завантаження...</div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  const ALL_PERMS = [
    { key: 'leads_tradein', label: 'Заявки: Обмін' },
    { key: 'leads_carselection', label: 'Заявки: Підбір' },
    { key: 'leads_leasing', label: 'Заявки: Лізинг' },
    { key: 'partners', label: 'Партнери' },
    { key: 'listings', label: 'Оголошення' },
    { key: 'auction', label: 'Аукціон' },
    { key: 'users', label: 'Користувачі' },
    { key: 'investors', label: 'Інвестори' },
    { key: 'support', label: 'Підтримка' },
    { key: 'broadcast', label: 'Розсилка' },
    { key: 'stats', label: 'Статистика' },
    { key: 'finance', label: 'Фінанси' },
    { key: 'content', label: 'Контент' }
  ];
  const ROLE_LABELS = { owner: 'Власник', administrator: 'Адміністратор', manager: 'Менеджер', accountant: 'Бухгалтер', pending: 'Очікує призначення' };

  let myRole = null;
  let myPerms = [];
  let currentUserId = null;

  function hasPerm(key) {
    if (myRole === 'owner' || myRole === 'administrator') return true;
    return myPerms.includes(key);
  }

  function timeAgo(dateStr) {
    const diffMs = Date.now() - new Date(dateStr).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 60) return mins + ' хв тому';
    const hours = Math.floor(mins / 60);
    if (hours < 24) return hours + ' год тому';
    return Math.floor(hours / 24) + ' дн тому';
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    const content = document.getElementById('content');

    if (!session) { window.location.href = 'admin-register.html'; return; }
    currentUserId = session.user.id;

    const { data: adminRow } = await sb.from('admin_users').select('role, permissions').eq('user_id', currentUserId).maybeSingle();

    if (!adminRow) {
      content.innerHTML = '<div class="denied">У вас немає доступу до цього розділу.<br><br><a href="admin-register.html" style="color:#8E00FF;">Зареєструватися як співробітник</a></div>';
      return;
    }
    myRole = adminRow.role;
    myPerms = adminRow.permissions || [];

    if (myRole === 'pending') {
      content.innerHTML = '<div class="denied">🕓 Заявку подано.<br>Очікуйте, поки власник призначить вам роль і права доступу.</div>';
      return;
    }

    buildLayout();
  }

  const SECTION_ICONS = {
    dashboard: '📊', leads: '📋', partners: '🤝', listings: '🚗', auction: '🔨',
    users: '👥', investors: '💼', support: '🎫', broadcast: '📢', stats: '📈', finance: '💰', content: '📝', staff: '👤'
  };
  const SECTION_LABELS = {
    dashboard: 'Dashboard', leads: 'Заявки', partners: 'Партнери', listings: 'Оголошення',
    auction: 'Аукціон', users: 'Користувачі', investors: 'Інвестори', support: 'Підтримка',
    broadcast: 'Розсилка', stats: 'Статистика', finance: 'Фінанси', content: 'Контент', staff: 'Персонал'
  };

  function buildLayout() {
    const content = document.getElementById('content');
    const tabs = ['dashboard'];
    if (hasPerm('leads_tradein') || hasPerm('leads_carselection') || hasPerm('leads_leasing')) tabs.push('leads');
    if (hasPerm('partners')) tabs.push('partners');
    if (hasPerm('listings')) tabs.push('listings');
    if (hasPerm('auction')) tabs.push('auction');
    if (hasPerm('users')) tabs.push('users');
    if (hasPerm('investors')) tabs.push('investors');
    if (hasPerm('support')) tabs.push('support');
    if (hasPerm('broadcast')) tabs.push('broadcast');
    if (hasPerm('finance')) tabs.push('finance');
    if (hasPerm('content')) tabs.push('content');
    if (myRole === 'owner') tabs.push('staff');

    const requestedSection = new URLSearchParams(window.location.search).get('section');
    const initialSection = (requestedSection && tabs.includes(requestedSection)) ? requestedSection : tabs[0];

    content.innerHTML = `
      <div class="topbar-admin">
        <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
        <div style="font-weight:bold; color:#222;">${SECTION_LABELS['dashboard']}</div>
        <button onclick="forceRefreshApp()" style="background:none; border:none; font-size:18px; cursor:pointer; color:#8E00FF;">🔄</button>
      </div>

      <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">CRM <span>NORMALNO</span></div>
          <div class="sidebar-role">${ROLE_LABELS[myRole] || myRole}</div>
        </div>
        <div class="sidebar-nav">
          ${tabs.map((t) => `
            <div class="sidebar-item ${t === initialSection ? 'active' : ''}" id="tab_${t}" onclick="setSection('${t}')">
              <span class="icon">${SECTION_ICONS[t]}</span> ${SECTION_LABELS[t]}
            </div>
          `).join('')}
        </div>
        <div class="sidebar-footer">
          <button class="sidebar-logout" onclick="logoutAdmin()">⏻ Вийти</button>
        </div>
      </div>

      <div class="main-content" id="sectionBody">Завантаження...</div>
    `;

    setSection(initialSection);
  }

  window.forceRefreshApp = async function() {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const reg of regs) await reg.update();
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    window.location.reload();
  };

  window.toggleSidebar = function() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarOverlay').classList.toggle('open');
  };

  window.logoutAdmin = async function() {
    await sb.auth.signOut();
    window.location.href = 'admin-register.html';
  };

  window.setSection = function(section) {
    document.querySelectorAll('.sidebar-item').forEach(t => t.classList.remove('active'));
    const tabEl = document.getElementById('tab_' + section);
    if (tabEl) tabEl.classList.add('active');

    const titleEl = document.querySelector('.topbar-admin div');
    if (titleEl) titleEl.textContent = SECTION_LABELS[section] || '';

    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');

    const loaders = {
      dashboard: loadDashboardSection, leads: loadLeadsSection, partners: loadPartnersSection, listings: loadListingsSection,
      auction: loadAuctionSection, users: loadUsersSection, investors: loadInvestorsSection, support: loadSupportSection,
      broadcast: loadBroadcastSection, finance: loadFinanceSection, content: loadContentSection, staff: loadStaffSection
    };
    if (loaders[section]) loaders[section]();
  };

  /* ---------- DASHBOARD ---------- */
  async function loadDashboardSection() {
    const body = document.getElementById('sectionBody');
    body.innerHTML = '<div class="empty">Рахуємо...</div>';

    const startOfToday = new Date();
    startOfToday.setHours(0, 0, 0, 0);
    const todayISO = startOfToday.toISOString();

    const queries = [];
    if (hasPerm('users')) queries.push(['newUsers', sb.from('profiles').select('*', { count: 'exact', head: true }).gte('created_at', todayISO)]);
    if (hasPerm('listings')) queries.push(['newListings', sb.from('cars').select('*', { count: 'exact', head: true }).neq('listing_type', 'auction').gte('created_at', todayISO)]);
    queries.push(['soldToday', sb.from('cars').select('*', { count: 'exact', head: true }).eq('sold', true).gte('archived_at', todayISO)]);
    if (hasPerm('leads_leasing') || hasPerm('leads_tradein') || hasPerm('leads_carselection')) {
      queries.push(['newLeads', sb.from('leads').select('*', { count: 'exact', head: true }).gte('created_at', todayISO)]);
    }
    if (hasPerm('auction')) queries.push(['activeAuctions', sb.from('cars').select('*', { count: 'exact', head: true }).eq('listing_type', 'auction').eq('archived', false)]);
    if (hasPerm('partners')) queries.push(['newPartners', sb.from('partners').select('*', { count: 'exact', head: true }).gte('created_at', todayISO)]);

    const results = await Promise.all(queries.map(q => q[1]));
    const data = {};
    queries.forEach((q, i) => { data[q[0]] = results[i].count || 0; });

    const todayCards = [
      hasPerm('users') ? ['👥', data.newUsers, 'Нових користувачів сьогодні'] : null,
      hasPerm('listings') ? ['🚗', data.newListings, 'Нових оголошень сьогодні'] : null,
      ['✅', data.soldToday, 'Продано сьогодні'],
      (hasPerm('leads_leasing') || hasPerm('leads_tradein') || hasPerm('leads_carselection')) ? ['📋', data.newLeads, 'Нових заявок сьогодні'] : null,
      hasPerm('auction') ? ['🔨', data.activeAuctions, 'Активних лотів'] : null,
      hasPerm('partners') ? ['🤝', data.newPartners, 'Нових партнерів сьогодні'] : null,
    ].filter(Boolean);

    body.innerHTML = `
      <div style="font-size:15px; font-weight:bold; margin-bottom:14px;">Сьогодні, ${new Date().toLocaleDateString('uk-UA')}</div>
      <div class="stats-grid">
        ${todayCards.map(c => `
          <div class="stat-box">
            <div style="font-size:22px; margin-bottom:4px;">${c[0]}</div>
            <div class="stat-num">${c[1]}</div>
            <div class="stat-label">${c[2]}</div>
          </div>
        `).join('')}
      </div>
      ${hasPerm('stats') ? '<div id="generalStatsWrap" style="margin-top:24px;"><div class="empty">Рахуємо загальну статистику...</div></div>' : ''}
    `;

    if (hasPerm('stats')) loadGeneralStats();
  }

  async function loadGeneralStats() {
    const [{ count: totalActive }, { count: soldPlatform }, { count: soldOther }, { count: activeAuctions }, { count: totalUsers }, { count: totalPartners }, { count: pwaInstalls }] = await Promise.all([
      sb.from('cars').select('*', { count: 'exact', head: true }).eq('archived', false),
      sb.from('cars').select('*', { count: 'exact', head: true }).eq('sold', true).eq('sold_via', 'platform'),
      sb.from('cars').select('*', { count: 'exact', head: true }).eq('sold', true).neq('sold_via', 'platform'),
      sb.from('cars').select('*', { count: 'exact', head: true }).eq('listing_type', 'auction').eq('archived', false),
      sb.from('profiles').select('*', { count: 'exact', head: true }),
      sb.from('partners').select('*', { count: 'exact', head: true }).eq('status', 'approved'),
      sb.from('pwa_installs').select('*', { count: 'exact', head: true })
    ]);

    const wrap = document.getElementById('generalStatsWrap');
    if (!wrap) return;

    wrap.innerHTML = `
      <div style="font-size:15px; font-weight:bold; margin-bottom:14px;">Загальна статистика</div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-num">${totalActive || 0}</div><div class="stat-label">Активних оголошень</div></div>
        <div class="stat-box"><div class="stat-num">${activeAuctions || 0}</div><div class="stat-label">Активних лотів</div></div>
        <div class="stat-box"><div class="stat-num">${soldPlatform || 0}</div><div class="stat-label">Продано через NORMALNO</div></div>
        <div class="stat-box"><div class="stat-num">${soldOther || 0}</div><div class="stat-label">Продано самостійно</div></div>
        <div class="stat-box"><div class="stat-num">${totalUsers || 0}</div><div class="stat-label">Користувачів</div></div>
        <div class="stat-box"><div class="stat-num">${totalPartners || 0}</div><div class="stat-label">Партнерів</div></div>
        <div class="stat-box"><div class="stat-num">${pwaInstalls || 0}</div><div class="stat-label">Встановлень застосунку (PWA)</div></div>
      </div>
      <p style="font-size:12px; color:#666; margin-top:16px; text-align:center;">Фінансова статистика зʼявиться після підключення платежів.</p>
    `;
  }

  /* ---------- ЗАЯВКИ ---------- */
  const TYPE_LABELS = { trade_in: 'Trade-in', car_selection: 'Підбір авто', leasing: 'Розрахунок лізингу', partner: 'Заявка партнера', urgent_buyout: '⚡ Терміновий викуп' };
  const LEAD_TYPE_PERM = { trade_in: 'leads_tradein', car_selection: 'leads_carselection', leasing: 'leads_leasing', urgent_buyout: 'leads_tradein' };
  let allLeads = [];
  let leadFilter = 'all';

  async function loadLeadsSection() {
    const body = document.getElementById('sectionBody');
    body.innerHTML = `
      <div class="tabs">
        <div class="tab active" id="lf_all" onclick="setLeadFilter('all')">Всі</div>
        <div class="tab" id="lf_new" onclick="setLeadFilter('new')">Нові</div>
        <div class="tab" id="lf_in_progress" onclick="setLeadFilter('in_progress')">В роботі</div>
        <div class="tab" id="lf_closed" onclick="setLeadFilter('closed')">Закриті</div>
      </div>
      <div id="leadsList">Завантаження...</div>
    `;
    const { data } = await sb.from('leads').select('*').order('created_at', { ascending: false });
    allLeads = (data || []).filter(l => (l.type === 'partner' || l.type === 'investor' || l.type === 'support') ? false : (LEAD_TYPE_PERM[l.type] ? hasPerm(LEAD_TYPE_PERM[l.type]) : true));
    renderLeads();
  }

  window.setLeadFilter = function(f) {
    leadFilter = f;
    ['all', 'new', 'in_progress', 'closed'].forEach(k => document.getElementById('lf_' + k).classList.toggle('active', k === f));
    renderLeads();
  };

  function linkify(text) {
    if (!text) return '';
    return text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:#8E00FF;">переглянути фото →</a>');
  }

  function renderLeads() {
    const list = document.getElementById('leadsList');
    const filtered = leadFilter === 'all' ? allLeads : allLeads.filter(l => l.status === leadFilter);
    if (filtered.length === 0) { list.innerHTML = '<div class="empty">Заявок немає</div>'; return; }

    list.innerHTML = filtered.map(l => `
      <div class="card">
        <div class="card-type">${TYPE_LABELS[l.type] || l.type}</div>
        <div class="card-title">${l.name || '—'}</div>
        <div class="card-sub">${l.phone || '—'}</div>
        <div class="card-details">${linkify(l.details)}</div>
        <div class="card-time">${timeAgo(l.created_at)}</div>
        <div class="status-row">
          <button class="status-btn ${l.status === 'new' ? 'active-new' : ''}" onclick="updateLeadStatus(${l.id}, 'new')">Нова</button>
          <button class="status-btn ${l.status === 'in_progress' ? 'active-progress' : ''}" onclick="updateLeadStatus(${l.id}, 'in_progress')">В роботі</button>
          <button class="status-btn ${l.status === 'closed' ? 'active-closed' : ''}" onclick="updateLeadStatus(${l.id}, 'closed')">Закрита</button>
        </div>
        ${l.type === 'leasing' && l.user_id ? (
          l.referral_bonus_given

  window.openListingStats = async function(carId) {
    const body = document.getElementById('sectionBody');
    body.innerHTML = '<div class="empty">Завантаження статистики...</div>';

    const [
      { data: car }, { count: favCount }, { count: contactViews },
      { count: leasingLeadsCount }, { count: chatsCount }
    ] = await Promise.all([
      sb.from('cars').select('*').eq('id', carId).maybeSingle(),
      sb.from('favorites').select('*', { count: 'exact', head: true }).eq('car_id', carId),
      sb.from('contact_views_log').select('*', { count: 'exact', head: true }).eq('car_id', carId),
      sb.from('leads').select('*', { count: 'exact', head: true }).eq('car_id', carId).eq('type', 'leasing'),
      sb.from('chats').select('*', { count: 'exact', head: true }).eq('car_id', carId)
    ]);

    if (!car) { body.innerHTML = '<div class="empty">Оголошення не знайдено</div>'; return; }

    const views = car.views || 0;
    const conversionThisCar = views > 0 ? (((car.sold ? 1 : 0) / views) * 100).toFixed(1) : '0';

    // Конверсія по всіх оголошеннях за поточний місяць
    const startOfMonth = new Date(); startOfMonth.setDate(1); startOfMonth.setHours(0,0,0,0);
    const { data: monthCars } = await sb.from('cars').select('views, sold').gte('created_at', startOfMonth.toISOString());
    const totalViewsMonth = (monthCars || []).reduce((s, c) => s + (c.views || 0), 0);
    const totalSoldMonth = (monthCars || []).filter(c => c.sold).length;
    const conversionMonth = totalViewsMonth > 0 ? ((totalSoldMonth / totalViewsMonth) * 100).toFixed(1) : '0';

    let statusLabel = 'Активне';
    if (car.sold && car.sold_via === 'platform') statusLabel = '✅ Продано через NORMALNO';
    else if (car.sold) statusLabel = '✅ Продано самостійно';
    else if (car.archived) statusLabel = '📦 В архіві (не продано)';

    body.innerHTML = `
      <button class="status-btn" style="margin-bottom:14px;" onclick="loadListingsSection()">← Назад до списку</button>

      <div class="card">
        <div class="card-title" style="font-size:17px;">${car.brand} ${car.model}, ${car.year}</div>
        <div class="card-sub">${Number(car.price || car.start_price || 0).toLocaleString('uk-UA')} ${car.currency || ''}</div>
        <div class="card-details">Статус: ${statusLabel}</div>
      </div>

      <div class="stats-grid" style="margin-top:14px;">
        <div class="stat-box"><div class="stat-num">${views}</div><div class="stat-label">Переглядів</div></div>
        <div class="stat-box"><div class="stat-num">${favCount || 0}</div><div class="stat-label">В обраному</div></div>
        <div class="stat-box"><div class="stat-num">${contactViews || 0}</div><div class="stat-label">Переглядів контактів</div></div>
        <div class="stat-box"><div class="stat-num">${chatsCount || 0}</div><div class="stat-label">Чатів</div></div>
        <div class="stat-box"><div class="stat-num">${leasingLeadsCount || 0}</div><div class="stat-label">Заявок на лізинг</div></div>
        ${car.listing_type === 'auction' ? `<div class="stat-box"><div class="stat-num">${car.bid_count || 0}</div><div class="stat-label">Ставок</div></div>` : ''}
      </div>

      <div class="section-title" style="margin-top:20px;">Конверсія</div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-num">${conversionThisCar}%</div><div class="stat-label">Це авто (перегляд→продаж)</div></div>
        <div class="stat-box"><div class="stat-num">${conversionMonth}%</div><div class="stat-label">Загальна за місяць</div></div>
      </div>
    `;
  };

      ${viewedCarsHtml}

      <div class="section-title" style="margin-top:20px;">📋 Заявки клієнта (${(leads || []).length})</div>
      ${(leads || []).length === 0 ? '<div class="empty">Заявок немає</div>' : (leads || []).map(l => `
        <div class="card">
          <div class="card-type">${TYPE_LABELS[l.type] || l.type}</div>
          <div class="card-details">${linkify(l.details)}</div>
          <div class="card-time">${timeAgo(l.created_at)} · статус: ${l.status}</div>
        </div>
      `).join('')}

      <div class="section-title">🚗 Оголошення (${(listings || []).length + (auctionLots || []).length})</div>
      ${[...(listings || []), ...(auctionLots || [])].length === 0 ? '<div class="empty">Оголошень немає</div>' : [...(listings || []), ...(auctionLots || [])].map(c => `
        <div class="card">
          <div class="card-type">${c.listing_type === 'auction' ? 'Аукціон' : 'Продаж'}${c.sold ? ' · продано' : ''}${c.archived ? ' · архів' : ''}</div>
          <div class="card-title">${c.brand} ${c.model}, ${c.year}</div>
          <div class="card-sub">${Number(c.price || c.start_price || 0).toLocaleString('uk-UA')} ${c.currency || ''}</div>
          <div class="card-time">${timeAgo(c.created_at)}</div>
        </div>
      `).join('')}
    `;
  };

  window.makeStaff = async function(userId) {
    if (!confirm('Призначити цього користувача співробітником? Далі перейдіть у розділ "Персонал", щоб дати конкретну роль і права.')) return;

    const { error } = await sb.from('admin_users').insert({ user_id: userId, role: 'pending', permissions: [] });
    if (error) {
      alert('Помилка: ' + error.message);
      return;
    }
    alert('Готово! Тепер зайдіть у розділ "Персонал", щоб призначити роль.');
    loadUsersSection();
  };

  window.toggleBlockUser = async function(userId, block) {
    await sb.from('profiles').update({ blocked: block }).eq('user_id', userId);
    loadUsersSection();
  };

  window.deleteUserAccount = async function(userId) {
    if (!confirm('Повністю видалити цей акаунт користувача? Це незворотньо.')) return;

    const { data: { session } } = await sb.auth.getSession();

    const resp = await fetch('/api/delete-staff-account', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminRowId: 0, staffUserId: userId, callerAccessToken: session.access_token })
    });
    const data = await resp.json();

    if (data.error) {
      alert('Помилка видалення: ' + data.error);
      return;
    }
    loadUsersSection();
  };

  /* ---------- РОЗСИЛКА ---------- */
  function loadBroadcastSection() {
    const body = document.getElementById('sectionBody');
    body.innerHTML = `
      <p style="font-size:13px; color:#999; margin-bottom:12px;">Push-сповіщення надійде всім користувачам, які увімкнули сповіщення — навіть якщо застосунок закритий.</p>
      <input type="text" id="broadcastTitle" placeholder="Заголовок (напр. 🎉 Вітаємо зі святом!)">
      <textarea id="broadcastBody" placeholder="Текст повідомлення"></textarea>
      <button class="action-btn" style="width:100%;" onclick="sendBroadcastAdmin()">Надіслати всім</button>
      <div id="broadcastMsg" style="text-align:center; margin-top:12px; font-size:14px;"></div>
    `;
  }

  window.sendBroadcastAdmin = async function() {
    const title = document.getElementById('broadcastTitle').value.trim();
    const body = document.getElementById('broadcastBody').value.trim();
    const msg = document.getElementById('broadcastMsg');
    if (!title || !body) { msg.textContent = 'Заповніть заголовок і текст'; msg.style.color = '#ff6b6b'; return; }

    msg.textContent = 'Надсилаємо...';
    msg.style.color = '#8E00FF';
    const resp = await fetch('/api/broadcast-push', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, body })
    });
    const data = await resp.json();
    if (data.error) { msg.textContent = data.error; msg.style.color = '#ff6b6b'; return; }
    msg.textContent = `Надіслано ${data.sent || 0} користувачам!`;
    msg.style.color = '#4ade80';
    document.getElementById('broadcastTitle').value = '';
    document.getElementById('broadcastBody').value = '';
  };

  /* ---------- ФІНАНСИ (заготовка структури, чекає реальних платежів) ---------- */
  async function loadFinanceSection() {
    const body = document.getElementById('sectionBody');
    body.innerHTML = '<div class="empty">Рахуємо...</div>';

    const { count: soldPlatform } = await sb.from('cars').select('*', { count: 'exact', head: true }).eq('sold', true).eq('sold_via', 'platform');
    const { count: soldOther } = await sb.from('cars').select('*', { count: 'exact', head: true }).eq('sold', true).neq('sold_via', 'platform');
    const { count: leasingSigned } = await sb.from('leads').select('*', { count: 'exact', head: true }).eq('type', 'leasing').eq('referral_bonus_given', true);
    const { data: refEvents } = await sb.from('referral_events').select('points');
    const totalRefPointsIssued = (refEvents || []).reduce((sum, e) => sum + Number(e.points), 0);

    body.innerHTML = `
      <p style="font-size:13px; color:#666; margin-bottom:16px; line-height:1.5;">Цей розділ показує реальні показники, які вже можна рахувати зараз, і структуру для майбутніх фінансових метрик — вони запрацюють одразу після підключення платежів.</p>

      <div class="section-title">Доступно вже зараз</div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-num">${soldPlatform || 0}</div><div class="stat-label">Продано через NORMALNO</div></div>
        <div class="stat-box"><div class="stat-num">${soldOther || 0}</div><div class="stat-label">Продано самостійно</div></div>
        <div class="stat-box"><div class="stat-num">${leasingSigned || 0}</div><div class="stat-label">Підписано лізингових угод</div></div>
        <div class="stat-box"><div class="stat-num">${totalRefPointsIssued}</div><div class="stat-label">Нараховано реферальних балів</div></div>
      </div>

      <div class="section-title" style="margin-top:24px;">Чекає підключення платежів</div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-num">$0</div><div class="stat-label">Дохід сьогодні</div></div>
        <div class="stat-box"><div class="stat-num">$0</div><div class="stat-label">Дохід за місяць</div></div>
        <div class="stat-box"><div class="stat-num">$0</div><div class="stat-label">Витрати за місяць</div></div>
        <div class="stat-box"><div class="stat-num">$0</div><div class="stat-label">Прибуток</div></div>
      </div>
      <p style="font-size:12px; color:#999; margin-top:10px;">Розбивка доходу за джерелом (платні розміщення / VIP / комісія аукціону / підписки партнерів), витрати вручну, заборгованості, історія транзакцій по кожному клієнту — з'являться разом з підключенням реальної оплати.</p>
    `;
  }

  /* ---------- КОНТЕНТ (заглушка) ---------- */
  async function loadContentSection() {
    const body = document.getElementById('sectionBody');
    body.innerHTML = '<div class="empty">Завантаження...</div>';

    const { data: banners } = await sb.from('banners').select('*').order('order_index', { ascending: true });
    const { data: settings } = await sb.from('app_settings').select('banners_enabled').eq('id', 1).maybeSingle();
    const bannersEnabled = settings ? settings.banners_enabled : false;

    body.innerHTML = `
      <div class="section-title">Банери на сторінці партнерів</div>
      <div style="display:flex; align-items:center; justify-content:space-between; background:#f9f2ff; border-radius:10px; padding:12px 14px; margin-bottom:14px;">
        <span style="font-size:13px; font-weight:bold;">Показувати банери на сайті</span>
        <label class="toggle-switch">
          <input type="checkbox" id="bannersEnabledToggle" ${bannersEnabled ? 'checked' : ''} onchange="toggleBannersEnabled(this.checked)">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <p style="font-size:12px; color:#999; margin-bottom:14px;">До 5 банерів, гортаються автоматично на partners.html. Поки вимкнено — на сайті банерів не видно, навіть якщо вони тут завантажені.</p>
      <div id="bannersList">${(banners || []).map(b => `
        <div class="card">
          <img src="${b.image_url}" style="width:100%; border-radius:8px; margin-bottom:8px;" onerror="this.style.display='none'">
          <div class="card-details">Посилання: ${b.link_url || '—'}\nПорядок: ${b.order_index}</div>
          <div class="status-row">
            <button class="status-btn ${b.active ? 'active-closed' : ''}" onclick="toggleBanner(${b.id}, ${!b.active})">${b.active ? 'Активний' : 'Вимкнено'}</button>
            <button class="status-btn active-new" onclick="deleteBanner(${b.id})">Видалити</button>
          </div>
        </div>
      `).join('') || '<div class="empty">Банерів ще немає</div>'}</div>

      <div class="section-title" style="margin-top:20px;">Додати банер</div>
      <input type="file" id="bannerFile" accept="image/*">
      <input type="url" id="bannerLink" placeholder="Посилання (необов'язково)">
      <input type="number" id="bannerOrder" placeholder="Порядок показу (напр. 1)" value="${(banners || []).length}">
      <button class="action-btn" style="width:100%;" onclick="addBanner()">Додати банер</button>
      <div class="msg" id="bannerMsg" style="text-align:center; margin-top:10px; font-size:13px;"></div>
    `;
  }

  window.toggleBannersEnabled = async function(enabled) {
    await sb.from('app_settings').update({ banners_enabled: enabled }).eq('id', 1);
  };

  window.toggleBanner = async function(id, active) {
    await sb.from('banners').update({ active }).eq('id', id);
    loadContentSection();
  };

  window.deleteBanner = async function(id) {
    if (!confirm('Видалити цей банер?')) return;
    await sb.from('banners').delete().eq('id', id);
    loadContentSection();
  };

  window.addBanner = async function() {
    const msg = document.getElementById('bannerMsg');
    const file = document.getElementById('bannerFile').files[0];
    if (!file) { msg.textContent = 'Оберіть зображення'; msg.style.color = 'red'; return; }

    msg.textContent = 'Завантажуємо...';
    msg.style.color = '#8E00FF';

    const ext = file.name.split('.').pop();
    const path = `banner-${Date.now()}.${ext}`;
    const { error: uploadError } = await sb.storage.from('partner-photos').upload(path, file);
    if (uploadError) { msg.textContent = uploadError.message; msg.style.color = 'red'; return; }

    const { data: urlData } = sb.storage.from('partner-photos').getPublicUrl(path);

    const { error } = await sb.from('banners').insert({
      image_url: urlData.publicUrl,
      link_url: document.getElementById('bannerLink').value.trim() || null,
      order_index: parseInt(document.getElementById('bannerOrder').value) || 0
    });

    if (error) { msg.textContent = error.message; msg.style.color = 'red'; return; }

    msg.textContent = 'Додано!';
    msg.style.color = 'green';
    setTimeout(loadContentSection, 800);
  };

  /* ---------- ПЕРСОНАЛ (тільки власник) ---------- */
  async function loadStaffSection() {
    const body = document.getElementById('sectionBody');
    body.innerHTML = '<div id="staffList">Завантаження...</div>';

    const { data: staff } = await sb.from('admin_users').select('*').order('created_at', { ascending: false });
    const userIds = (staff || []).map(s => s.user_id);
    const { data: profs } = userIds.length ? await sb.from('profiles').select('user_id, name, phone').in('user_id', userIds) : { data: [] };
    const profMap = {};
    (profs || []).forEach(p => profMap[p.user_id] = p);

    const list = document.getElementById('staffList');
    if (!staff || staff.length === 0) { list.innerHTML = '<div class="empty">Персоналу ще немає</div>'; return; }

    list.innerHTML = staff.map(s => {
      const prof = profMap[s.user_id] || {};
      const perms = s.permissions || [];
      const isMe = s.user_id === currentUserId;
      return `
        <div class="staff-card">
          <div class="staff-name">${prof.name || 'Без імені'}${isMe ? ' (це ви)' : ''}</div>
          <div class="staff-phone">${prof.phone || '—'}</div>
          <select id="role_${s.id}" onchange="onRoleChange(${s.id})" ${isMe ? 'disabled' : ''}>
            ${Object.keys(ROLE_LABELS).map(r => `<option value="${r}" ${s.role === r ? 'selected' : ''}>${ROLE_LABELS[r]}</option>`).join('')}
          </select>
          ${isMe ? '<div style="font-size:11px; color:#999; margin-bottom:8px;">Не можна змінити власну роль — щоб уникнути втрати доступу</div>' : ''}
          <div class="perm-grid" id="perms_${s.id}" style="${s.role === 'manager' || s.role === 'accountant' ? '' : 'display:none;'}">
            ${ALL_PERMS.map(p => `
              <label class="perm-item">
                <input type="checkbox" value="${p.key}" ${perms.includes(p.key) ? 'checked' : ''} ${isMe ? 'disabled' : ''}>
                ${p.label}
              </label>
            `).join('')}
          </div>
          ${!isMe ? `
            <div style="display:flex; gap:8px; margin-top:8px;">
              <button class="action-btn" style="flex:1;" onclick="saveStaff(${s.id})">Зберегти</button>
              <button class="status-btn active-new" style="flex:1;" onclick="deleteStaff(${s.id}, '${s.user_id}')">Видалити</button>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  window.onRoleChange = function(id) {
    const role = document.getElementById('role_' + id).value;
    const permsBox = document.getElementById('perms_' + id);
    permsBox.style.display = (role === 'manager' || role === 'accountant') ? '' : 'none';
  };

  window.saveStaff = async function(id) {
    const role = document.getElementById('role_' + id).value;
    const checkboxes = document.querySelectorAll(`#perms_${id} input[type=checkbox]:checked`);
    const permissions = Array.from(checkboxes).map(cb => cb.value);

    const { error } = await sb.from('admin_users').update({ role, permissions }).eq('id', id);
    if (error) {
      alert('Помилка збереження: ' + error.message);
      return;
    }
    alert('Збережено!');
    loadStaffSection();
  };

  window.deleteStaff = async function(adminRowId, staffUserId) {
    if (!confirm('Повністю видалити цей акаунт? Це незворотньо — акаунт, профіль і доступ до CRM зникнуть назавжди.')) return;

    const { data: { session } } = await sb.auth.getSession();

    const resp = await fetch('/api/delete-staff-account', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminRowId, staffUserId, callerAccessToken: session.access_token })
    });
    const data = await resp.json();

    if (data.error) {
      alert('Помилка видалення: ' + data.error);
      return;
    }
    loadStaffSection();
  };

  init();
</script>

</body>
</html>
