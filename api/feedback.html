<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8E00FF">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>NORMALNO — Пропозиції та відгуки</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js?v=1786440586"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; padding-bottom: 40px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .logo { font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
  label { font-size: 12px; color: #999; display: block; margin-bottom: 4px; }
  input, textarea { width: 100%; padding: 14px; margin-bottom: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; font-family: Arial, sans-serif; }
  textarea { min-height: 140px; resize: vertical; }
  button.main { width: 100%; padding: 15px; background: #8E00FF; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .msg { text-align: center; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>

<a href="support.html" class="back">&larr; Назад до підтримки</a>
<div class="logo">💡 Пропозиції та відгуки</div>
<div class="subtitle">Розкажіть, чого не вистачає в NORMALNO, що незручно, або яку функцію варто додати. Ми збираємо всі побажання та регулярно втілюємо найкращі з них — так застосунок стає кращим разом з вами.</div>

<label>Телефон (необов'язково)</label>
<input type="tel" id="fbPhone">
<label>Email (необов'язково)</label>
<input type="email" id="fbEmail">
<label>Ваша пропозиція або відгук</label>
<textarea id="fbMessage" placeholder="Опишіть якомога детальніше — що додати, що прибрати, що змінити"></textarea>

<button class="main" onclick="submitFeedback()">Надіслати</button>
<div class="msg" id="msg"></div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function submitFeedback() {
    const msg = document.getElementById('msg');
    const phone = document.getElementById('fbPhone').value.trim();
    const email = document.getElementById('fbEmail').value.trim();
    const message = document.getElementById('fbMessage').value.trim();

    if (!message) {
      msg.textContent = "Опишіть вашу пропозицію чи відгук";
      msg.style.color = 'red';
      return;
    }

    const { data: { session } } = await sb.auth.getSession();
    let name = '';
    if (session) {
      const { data: profile } = await sb.from('profiles').select('name').eq('user_id', session.user.id).maybeSingle();
      name = (profile && profile.name) || '';
    }

    const { error } = await sb.from('leads').insert({
      type: 'feedback',
      user_id: session ? session.user.id : null,
      name: name,
      phone: phone,
      details: `Email: ${email || '—'}\n${message}`
    });

    if (error) {
      msg.textContent = error.message;
      msg.style.color = 'red';
      return;
    }

    fetch('/api/notify-lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ leadType: 'feedback', name, phone, summary: `Email: ${email || '—'}\n${message}` })
    }).catch(() => {});

    msg.textContent = 'Дякуємо за відгук! Ми обов\'язково розглянемо вашу пропозицію.';
    msg.style.color = 'green';
    setTimeout(() => { window.location.href = 'profile.html'; }, 1800);
  }
</script>

</body>
</html>
