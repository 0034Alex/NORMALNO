<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8E00FF">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>NORMALNO — Перевести в аукціон</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js?v=1786440586"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; padding-bottom: 40px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .logo { font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }
  .car-preview { display: flex; gap: 12px; border: 1px solid #eee; border-radius: 12px; padding: 12px; margin-bottom: 20px; }
  .car-preview img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; }
  label { font-size: 12px; color: #999; display: block; margin-bottom: 4px; }
  input, select { width: 100%; padding: 14px; margin-bottom: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; }
  .row { display: flex; gap: 10px; }
  .row input { flex: 1; }
  button.main { width: 100%; padding: 15px; background: #8E00FF; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .msg { text-align: center; margin-top: 12px; font-size: 14px; }
  .hint { font-size: 11px; color: #999; margin: -8px 0 14px; }
</style>
</head>
<body>

<a href="my-listings.html" class="back">&larr; Назад до моїх оголошень</a>
<div class="logo">🔨 Перевести в аукціон</div>
<div class="subtitle">Оголошення знімається зі звичайного продажу і стає лотом на торгах</div>

<div id="preview">Завантаження...</div>

<label>Стартова ціна</label>
<div class="row">
  <input type="number" id="startPrice">
  <select id="currency">
    <option value="USD">$</option>
    <option value="EUR">€</option>
    <option value="UAH">грн</option>
  </select>
</div>
<label>Резервна ціна (необов'язково)</label>
<input type="number" id="reservePrice" placeholder="Мінімум, нижче якого не продавати">
<div class="hint">Покупці бачитимуть лише статус "резерв пройдено/не пройдено", саму суму — ні</div>
<label>Блиц-ціна миттєвого викупу (необов'язково)</label>
<input type="number" id="buyoutPrice" placeholder="Сума миттєвого викупу">
<label>Тривалість торгів</label>
<select id="duration">
  <option value="3">3 дні</option>
  <option value="5" selected>5 днів</option>
  <option value="7">7 днів</option>
</select>

<button class="main" onclick="convertToAuction()">Виставити на аукціон</button>
<div class="msg" id="msg"></div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  const params = new URLSearchParams(window.location.search);
  const carId = params.get('id');
  let sessionUserId = null;
  let currentCar = null;

  async function load() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'register2.html'; return; }
    sessionUserId = session.user.id;

    const { data: car, error } = await sb.from('cars').select('*').eq('id', carId).single();
    if (error || !car || car.user_id !== sessionUserId) {
      document.body.innerHTML = '<div style="text-align:center; margin-top:60px; color:#999;">Оголошення не знайдено або немає доступу</div>';
      return;
    }
    currentCar = car;
    const photo = carPhotos(car, 1)[0];
    document.getElementById('preview').innerHTML = `
      <div class="car-preview">
        ${photo ? `<img src="${photo}">` : ''}
        <div>
          <div style="font-weight:bold;">${car.brand} ${car.model}, ${car.year}</div>
          <div style="color:#8E00FF; font-weight:bold;">${Number(car.price || 0).toLocaleString('uk-UA')} ${car.currency || ''}</div>
        </div>
      </div>
    `;
    document.getElementById('startPrice').value = car.price || '';
    document.getElementById('currency').value = car.currency || 'USD';
  }

  async function convertToAuction() {
    const msg = document.getElementById('msg');
    const startPrice = parseFloat(document.getElementById('startPrice').value);
    if (!startPrice) {
      msg.textContent = 'Вкажіть стартову ціну';
      msg.style.color = 'red';
      return;
    }

    const duration = parseInt(document.getElementById('duration').value);
    const startsAt = new Date();
    const endsAt = new Date(startsAt.getTime() + duration * 24 * 60 * 60 * 1000);

    const { error } = await sb.from('cars').update({
      listing_type: 'auction',
      start_price: startPrice,
      currency: document.getElementById('currency').value,
      reserve_price: parseFloat(document.getElementById('reservePrice').value) || null,
      buyout_price: parseFloat(document.getElementById('buyoutPrice').value) || null,
      auction_duration_days: duration,
      auction_starts_at: startsAt.toISOString(),
      auction_ends_at: endsAt.toISOString(),
      current_bid: null, current_bid_user_id: null, bid_count: 0,
      start_notified: false, ending_soon_notified: false, ended_visible_until: null
    }).eq('id', carId);

    if (error) {
      msg.textContent = error.message;
      msg.style.color = 'red';
      return;
    }

    msg.textContent = 'Готово! Авто на аукціоні.';
    msg.style.color = 'green';
    setTimeout(() => { window.location.href = 'my-auctions.html'; }, 1200);
  }

  load();
</script>

</body>
</html>
