<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMALNO — Головна</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #ffffff; margin: 0; padding-bottom: 80px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
  .logo { font-size: 22px; font-weight: bold; color: #8E00FF; }
  .status { background: #f5e6ff; color: #8E00FF; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }

  .search-wrap { padding: 0 16px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .search-input { flex: 1; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; }
  .search-go { background: #8E00FF; color: white; border: none; border-radius: 10px; padding: 0 18px; font-size: 15px; font-weight: bold; cursor: pointer; }
  .search-btn { width: 100%; padding: 14px; background: #FF7A00; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }

  .feed { padding: 0 16px; text-align: left; }
  .empty-feed { text-align: center; color: #999; margin-top: 40px; }

  .ncard { border-radius: 14px; overflow: hidden; border: 1px solid #eee; margin-bottom: 16px; background: #fff; }
  .ncard-sold { opacity: 0.6; }
  .ncard-photo { position: relative; width: 100%; aspect-ratio: 16/10; background: #f2f2f2; overflow: hidden; }
  .ncard-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ncard-noimg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #ccc; }
  .ncard-watermark {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-25deg);
    font-size: 20px; font-weight: bold; color: rgba(255,255,255,0.55);
    text-shadow: 0 0 6px rgba(0,0,0,0.35); letter-spacing: 2px; pointer-events: none;
  }
  .ncard-heart {
    position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #8E00FF;
  }
  .ncard-body { padding: 12px 14px 14px; }
  .ncard-title { font-weight: bold; font-size: 16px; margin-bottom: 2px; }
  .ncard-subtitle { color: #999; font-size: 12px; margin-bottom: 6px; }
  .ncard-price { color: #8E00FF; font-weight: bold; font-size: 18px; margin-bottom: 8px; }
  .ncard-specs { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: #555; margin-bottom: 8px; }
  .ncard-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .ncard-badge { background: #f5e6ff; color: #8E00FF; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 20px; }
  .ncard-time { color: #bbb; font-size: 11px; }
  .ncard-sold-btn { margin-top: 8px; width: 100%; padding: 8px; background: #fff; border: 1px solid #8E00FF; color: #8E00FF; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }

  @media (min-width: 700px) {
    .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
    .ncard { margin-bottom: 0; }
    .ncard-photo { aspect-ratio: 4/3; }
    .ncard-title { font-size: 14px; }
    .ncard-price { font-size: 16px; }
    .ncard-specs { font-size: 11px; gap: 6px 10px; }
  }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: white; border-top: 1px solid #eee;
    padding: 8px 0;
  }
  .nav-item {
    flex: 1; text-align: center; padding: 8px 0; cursor: pointer;
    color: #999; font-size: 11px; position: relative;
  }
  .nav-item .icon { font-size: 20px; display: block; margin-bottom: 2px; }
  .nav-item.active { color: #8E00FF; font-weight: bold; }
  .nav-item.active::before {
    content: ''; position: absolute; top: -8px; left: 20%; right: 20%;
    height: 3px; background: #FF7A00; border-radius: 3px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">NORMALNO</div>
  <div class="status" id="statusBadge">...</div>
</div>

<div class="search-wrap">
  <div class="search-row">
    <input type="text" class="search-input" id="brandSearch" placeholder="Марка авто">
    <button class="search-go" onclick="filterByBrand()">Пошук</button>
  </div>
  <button class="search-btn" onclick="window.location.href='search.html'">Пошук за параметрами</button>
</div>

<div class="feed" id="feed"></div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="setActive(this)">
    <span class="icon">🏠</span>Головна
  </div>
  <div class="nav-item" onclick="window.location.href='auction.html'">
    <span class="icon">🔨</span>Аукціон
  </div>
  <div class="nav-item" onclick="window.location.href='sell.html'">
    <span class="icon">➕</span>Продати
  </div>
  <div class="nav-item" onclick="window.location.href='favorites.html'">
    <span class="icon">❤️</span>Обране
  </div>
  <div class="nav-item" onclick="setActive(this)">
    <span class="icon">👤</span>Профіль
  </div>
</div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  let allCars = [];
  let currentUserId = null;
  let favoritedIds = new Set();

  function setActive(el) {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
  }

  async function checkUserAndLoadStatus() {
    const { data: { session } } = await sb.auth.getSession();

    if (!session) {
      window.location.href = 'register2.html';
      return;
    }
    currentUserId = session.user.id;

    const { count } = await sb
      .from('cars')
      .select('*', { count: 'exact', head: true })
      .eq('user_id', currentUserId)
      .eq('sold', true);

    const status = getStatusForCount(count || 0);
    document.getElementById('statusBadge').textContent = status.name;

    const { data: favs } = await sb.from('favorites').select('car_id').eq('user_id', currentUserId);
    favoritedIds = new Set((favs || []).map(f => f.car_id));
  }

  async function loadCars() {
    const feed = document.getElementById('feed');
    const { data: cars, error } = await sb
      .from('cars')
      .select('*')
      .order('created_at', { ascending: false });

    if (error || !cars) {
      feed.innerHTML = '<div class="empty-feed">Поки що немає оголошень</div>';
      return;
    }

    allCars = cars;
    renderFeed(cars);
  }

  function renderFeed(cars) {
    const feed = document.getElementById('feed');
    if (!cars || cars.length === 0) {
      feed.innerHTML = '<div class="empty-feed">Нічого не знайдено</div>';
      return;
    }
    feed.innerHTML = cars.map(car => renderCarCard(car, currentUserId, favoritedIds)).join('');
  }

  function filterByBrand() {
    const query = document.getElementById('brandSearch').value.trim();
    if (!query) {
      renderFeed(allCars);
      return;
    }
    const filtered = allCars.filter(car => matchesQuery(car.brand, query));
    renderFeed(filtered);
  }

  window.toggleFavorite = async function(carId) {
    if (!currentUserId) return;
    if (favoritedIds.has(carId)) {
      await sb.from('favorites').delete().eq('user_id', currentUserId).eq('car_id', carId);
      favoritedIds.delete(carId);
    } else {
      await sb.from('favorites').insert({ user_id: currentUserId, car_id: carId });
      favoritedIds.add(carId);
    }
    renderFeed(allCars);
  };

  (async function start() {
    await checkUserAndLoadStatus();
    await loadCars();
  })();
</script>

</body>
</html>
