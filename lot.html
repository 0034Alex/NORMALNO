<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8E00FF">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NORMALNO">

<title>NORMALNO — Лот</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js?v=1786440586"></script>
<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  .fullscreen-photo-overlay {
    position: fixed; inset: 0; background: #000; z-index: 500;
    display: flex; align-items: center; justify-content: center; padding: 0; overflow: hidden;
  }
  .fullscreen-photo-overlay.hidden { display: none; }
  .fullscreen-photo-bg {
    position: absolute; inset: -20px; background-size: cover; background-position: center;
    filter: blur(25px) brightness(0.55); transform: scale(1.15);
  }
  .fullscreen-photo-overlay img { position: relative; max-width: 100%; max-height: 100%; object-fit: contain; }
  .fullscreen-photo-close {
    position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.15); color: #fff; border: none; font-size: 20px; cursor: pointer; z-index: 501;
  }
  .fullscreen-nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff; cursor: pointer; z-index: 501; border: none;
  }
  .fullscreen-nav-arrow.left { left: 12px; }
  .fullscreen-nav-arrow.right { right: 12px; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; max-width: 480px; margin-left: auto; margin-right: auto; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }

  .photo { position: relative; width: 100%; aspect-ratio: 4/3; background: transparent; border-radius: 14px; overflow: hidden; margin-bottom: 14px; margin-top: 8px; transition: aspect-ratio 0.25s ease; }
  .photo.portrait-mode { aspect-ratio: 3/4; }
  .gallery-stack-item {
    position: absolute; top: 0; width: 66%; height: 100%; object-fit: cover;
    border-radius: 16px; transition: all 0.3s ease; left: 17%;
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  }
  .gallery-stack-item.pos-prev { transform: translateX(-72%) scale(0.8) rotate(-6deg); z-index: 1; opacity: 0.85; }
  .gallery-stack-item.pos-current { transform: translateX(0) scale(1) rotate(0deg); z-index: 3; opacity: 1; cursor: zoom-in; }
  .gallery-stack-item.pos-next { transform: translateX(72%) scale(0.8) rotate(6deg); z-index: 1; opacity: 0.85; }
  .gallery-stack-item.pos-hidden { transform: translateX(0) scale(0.7); z-index: 0; opacity: 0; }
  .gallery-nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #8E00FF; cursor: pointer; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.2); border: none;
  }
  .gallery-nav-arrow.left { left: 8px; }
  .gallery-nav-arrow.right { right: 8px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; }
  .photo-scroll { display: flex; overflow-x: auto; width: 100%; height: 100%; scroll-snap-type: x mandatory; }
  .photo-scroll img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; }
  .photo-dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
  .photo-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.7); box-shadow: 0 0 3px rgba(0,0,0,0.4); }
  .noimg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 50px; color: #ccc; }
  .badge-condition { position: absolute; top: 12px; left: 12px; background: #8E00FF; color: #fff; font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 20px; z-index: 20; }
  .badge-timer { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.65); color: #fff; font-size: 14px; font-weight: bold; padding: 6px 12px; border-radius: 20px; z-index: 20; }
  .badge-timer.urgent { background: #cc0000; }

  h1 { font-size: 20px; margin: 0 0 4px; }
  .subline { color: #999; font-size: 13px; margin-bottom: 16px; }

  .bid-block { border: 1px solid #eee; border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .bid-row { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #f5f5f5; font-size: 14px; }
  .bid-row:first-child { border-top: none; }
  .bid-row b { color: #111; }
  .bid-row .accent { color: #8E00FF; font-weight: bold; font-size: 18px; }

  .status-msg { text-align: center; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: bold; margin-bottom: 12px; }
  .status-msg.awaiting { background: #fff4e0; color: #cc7a00; }
  .status-msg.reserve { background: #fff0f0; color: #cc0000; }
  .status-msg.reservemet { background: #eafbe9; color: #1a8f2a; }
  .status-msg.sold { background: #eafbe9; color: #1a8f2a; }

  .bid-form { display: flex; gap: 8px; margin-top: 10px; }
  .bid-form input { flex: 1; min-width: 0; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; box-sizing: border-box; }
  .bid-form button { flex-shrink: 0; background: #8E00FF; color: #fff; border: none; border-radius: 10px; padding: 0 16px; font-weight: bold; font-size: 14px; cursor: pointer; }
  .buyout-btn { width: 100%; margin-top: 10px; padding: 14px; background: #FF7A00; color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; }

  .msg { text-align: center; margin-top: 10px; font-size: 13px; }
  .extend-toast {
    position: fixed; top: 16px; left: 16px; right: 16px; background: #8E00FF; color: #fff;
    padding: 12px; border-radius: 10px; text-align: center; font-size: 13px; font-weight: bold;
    display: none; z-index: 50;
  }
  .description { font-size: 14px; color: #444; line-height: 1.5; white-space: pre-wrap; }
  .hidden { display: none; }

  .car-id-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #999; margin-bottom: 16px; }
  .icon-btn { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; padding: 0; border: none; border-radius: 7px; cursor: pointer; flex-shrink: 0; }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn-copy { background: #f5e6ff; color: #8E00FF; }
  .icon-btn-share { background: transparent; margin-left: auto; }
  .icon-btn-share svg { width: 26px; height: 26px; }
</style>
</head>
<body>

<div class="extend-toast" id="extendToast">Ставка зроблена! Аукціон продовжено на 3 хвилини</div>

<a href="auction.html" class="back">&larr; До аукціону</a>

<div class="photo" id="photoWrap">
  <div class="noimg">🚗</div>
</div>

<div class="fullscreen-photo-overlay hidden" id="fullscreenPhotoOverlay" onclick="closeFullscreenPhoto()">
  <button class="fullscreen-photo-close" onclick="event.stopPropagation(); closeFullscreenPhoto()">✕</button>
  <button class="fullscreen-nav-arrow left" onclick="event.stopPropagation(); fsSwipe('right')">‹</button>
  <button class="fullscreen-nav-arrow right" onclick="event.stopPropagation(); fsSwipe('left')">›</button>
  <div class="fullscreen-photo-bg" id="fullscreenPhotoBg"></div>
  <img id="fullscreenPhotoImg" src="" onclick="event.stopPropagation()">
</div>

<h1 id="title">Завантаження...</h1>
<div class="subline" id="subline"></div>

<div class="car-id-row" id="lotIdRow" style="display:none;">
  ID лоту: <b id="lotIdText"></b>
  <button class="icon-btn icon-btn-copy" onclick="copyCarId()" title="Копіювати ID" aria-label="Копіювати ID">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
  </button>
  <button class="icon-btn icon-btn-share" onclick="shareToTelegram()" title="Поділитися в Telegram" aria-label="Поділитися в Telegram" id="lotShareBtn"></button>
</div>

<div id="statusArea"></div>

<div class="bid-block">
  <div class="bid-row"><span>Поточна ставка</span><span class="accent" id="currentBid">—</span></div>
  <div class="bid-row"><span>Лідирує</span><b id="leaderName">—</b></div>
  <div class="bid-row"><span>Мінімум для перебивки</span><b id="minNext">—</b></div>
  <div class="bid-row"><span>Продавець</span><b id="sellerName">—</b></div>
  <div class="bid-row"><span>Зроблено ставок</span><b id="bidCount">0</b></div>

  <div class="bid-form" id="bidForm">
    <input type="number" id="bidAmount" placeholder="Ваша ставка">
    <button onclick="placeBid()">ПОСТАВИТИ</button>
  </div>
  <button class="buyout-btn hidden" id="buyoutBtn" onclick="buyout()">Купити зараз</button>
  <div class="msg" id="bidMsg"></div>
</div>

<div class="description" id="description"></div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  const params = new URLSearchParams(window.location.search);
  const carId = (params.get('id') || '').trim();
  const TELEGRAM_LOGO_SVG = '<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="120" r="120" fill="#26A5E4"/><path fill="#fff" d="M167.5 72.7c2.1-1.1 4.6.6 4.2 2.9l-19.6 108.1c-1 5.5-8.3 6.9-11.3 2.2l-31-40.3-19.5 18.8c-2.2 2.1-5.9.8-6.3-2.2l-4.1-30.1-33.8-11c-4.4-1.4-4.5-7.6-.1-9.2l121.5-39.2z"/></svg>';

  let car = null;
  const leaderNamesCache = {};
  let currentUserId = null;
  let galleryIndex = 0;
  let photoOrientations = {};

  window.handlePhotoOrientation = function(idx, imgEl) {
    photoOrientations[idx] = (imgEl.naturalWidth && imgEl.naturalHeight && imgEl.naturalWidth < imgEl.naturalHeight) ? 'portrait' : 'landscape';
    if (idx === galleryIndex) applyGalleryOrientation();
  };

  function applyGalleryOrientation() {
    const wrap = document.getElementById('photoWrap');
    if (!wrap) return;
    wrap.classList.toggle('portrait-mode', photoOrientations[galleryIndex] === 'portrait');
  }

  function initGallerySwipe() {
    const photos = carPhotos(car);
    if (photos.length === 0) return;
    galleryIndex = 0;
    renderGalleryPositions();
    applyGalleryOrientation();

    const stack = document.getElementById('photoWrap');
    let startX = 0;
    let dragging = false;

    if (photos.length > 1) {
      stack.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; dragging = true; }, { passive: true });
      stack.addEventListener('touchend', (e) => {
        if (!dragging) return;
        dragging = false;
        const diff = e.changedTouches[0].clientX - startX;
        if (diff < -40) swipeGallery('left');
        else if (diff > 40) swipeGallery('right');
      }, { passive: true });
    }

    stack.addEventListener('click', (e) => {
      const item = e.target.closest('.gallery-stack-item');
      if (!item) return;
      if (item.classList.contains('pos-next')) swipeGallery('left');
      else if (item.classList.contains('pos-prev')) swipeGallery('right');
      else if (item.classList.contains('pos-current')) openFullscreenPhoto();
    });
  }

  function updateFullscreenPhoto() {
    const photos = carPhotos(car);
    const src = photos[galleryIndex];
    if (!src) return;
    document.getElementById('fullscreenPhotoImg').src = src;
    document.getElementById('fullscreenPhotoBg').style.backgroundImage = `url('${src}')`;
  }

  window.openFullscreenPhoto = function() {
    updateFullscreenPhoto();
    document.getElementById('fullscreenPhotoOverlay').classList.remove('hidden');
  };
  window.closeFullscreenPhoto = function() {
    document.getElementById('fullscreenPhotoOverlay').classList.add('hidden');
  };
  window.fsSwipe = function(direction) {
    swipeGallery(direction);
    updateFullscreenPhoto();
  };

  (function initFullscreenSwipe() {
    const overlay = document.getElementById('fullscreenPhotoOverlay');
    let startX = 0, dragging = false;
    overlay.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; dragging = true; }, { passive: true });
    overlay.addEventListener('touchend', (e) => {
      if (!dragging) return;
      dragging = false;
      const diff = e.changedTouches[0].clientX - startX;
      if (diff < -40) fsSwipe('left');
      else if (diff > 40) fsSwipe('right');
    }, { passive: true });
  })();

  function renderGalleryPositions() {
    const photos = carPhotos(car);
    const n = photos.length;
    const items = document.querySelectorAll('.gallery-stack-item');

    items.forEach(item => {
      const idx = parseInt(item.dataset.idx);
      item.classList.remove('pos-prev', 'pos-current', 'pos-next', 'pos-hidden');
      if (idx === galleryIndex) item.classList.add('pos-current');
      else if (idx === (galleryIndex - 1 + n) % n) item.classList.add('pos-prev');
      else if (idx === (galleryIndex + 1) % n) item.classList.add('pos-next');
      else item.classList.add('pos-hidden');
    });
  }

  window.swipeGallery = function(direction) {
    const photos = carPhotos(car);
    const n = photos.length;
    if (direction === 'left') galleryIndex = (galleryIndex + 1) % n;
    else galleryIndex = (galleryIndex - 1 + n) % n;
    renderGalleryPositions();
    applyGalleryOrientation();
  };

  let timerInterval = null;

  function getBidStep(amount) {
    if (amount < 5000) return 50;
    if (amount < 15000) return 100;
    if (amount < 30000) return 200;
    return 500;
  }

  function lotStatus(c) {
    const now = new Date();
    const starts = new Date(c.auction_starts_at);
    const ends = new Date(c.auction_ends_at);
    if (now < starts) return 'awaiting';
    if (now < ends) return 'active';
    if (c.reserve_price && (c.current_bid || 0) < c.reserve_price) return 'reserve_not_met';
    return 'sold';
  }

  function render() {
    document.getElementById('title').textContent = `${car.brand} ${car.model}, ${car.year}`;
    document.getElementById('subline').textContent = `${car.mileage ? Number(car.mileage).toLocaleString('uk-UA') + ' км · ' : ''}${car.region || ''}`;
    document.getElementById('description').textContent = car.description || '';

    const photoWrap = document.getElementById('photoWrap');
    const photos = carPhotos(car);
    const photoHtml = photos.length
      ? photos.map((p, i) => `<img class="gallery-stack-item" data-idx="${i}" src="${p}" onerror="this.style.display='none'" onload="handlePhotoOrientation(${i}, this)">`).join('') +
        (photos.length > 1 ? `
          <button class="gallery-nav-arrow left" onclick="event.stopPropagation(); swipeGallery('right')">‹</button>
          <button class="gallery-nav-arrow right" onclick="event.stopPropagation(); swipeGallery('left')">›</button>
        ` : '')
      : `<div class="noimg">🚗</div>`;
    photoWrap.innerHTML = photoHtml +
      `<div class="badge-condition">${CONDITION_LABELS[car.condition] || 'Стан невідомий'}</div>` +
      `<div class="badge-timer" id="timerBadge"></div>`;
    initGallerySwipe();

    const status = lotStatus(car);
    const statusArea = document.getElementById('statusArea');
    const inGraceWindow = car.ended_visible_until && new Date(car.ended_visible_until) > new Date();
    let statusHtml = '';
    if (status === 'awaiting') statusHtml = `<div class="status-msg awaiting">Торги ще не почались</div>`;
    else if (status === 'reserve_not_met' && inGraceWindow) statusHtml = `<div class="status-msg reserve">Резерв не пройдено — але ще можна викупити за фіксованою ціною протягом доби</div>`;
    else if (status === 'reserve_not_met') statusHtml = `<div class="status-msg reserve">Резерв не пройдено — угода не відбулась</div>`;
    else if (status === 'sold') statusHtml = `<div class="status-msg sold">Торги завершено — лот продано</div>`;
    else if (car.reserve_price) {
      const met = (car.current_bid || 0) >= car.reserve_price;
      statusHtml = met ? `<div class="status-msg reservemet">Резерв пройдено</div>` : `<div class="status-msg reserve">Резерв не пройдено</div>`;
    }
    statusArea.innerHTML = statusHtml;

    const bid = car.current_bid || car.start_price || 0;
    const uah = convertToUAH(bid, car.currency);
    document.getElementById('currentBid').textContent = `${Number(bid).toLocaleString('uk-UA')} ${car.currency}` + (uah ? ` (≈${uah.toLocaleString('uk-UA')} грн)` : '');
    document.getElementById('leaderName').textContent = car.current_bid_user_id ? (leaderNamesCache[car.current_bid_user_id] || 'учасник') : '—';
    if (car.current_bid_user_id && !leaderNamesCache[car.current_bid_user_id]) {
      sb.from('profiles').select('name, telegram_username').eq('user_id', car.current_bid_user_id).maybeSingle().then(({ data: p }) => {
        leaderNamesCache[car.current_bid_user_id] = (p && p.name) ? p.name : ((p && p.telegram_username) ? '@' + p.telegram_username : 'учасник');
        const el = document.getElementById('leaderName');
        if (el) el.textContent = leaderNamesCache[car.current_bid_user_id];
      });
    }
    document.getElementById('minNext').textContent = `${Number(bid + getBidStep(bid)).toLocaleString('uk-UA')} ${car.currency}`;
    document.getElementById('sellerName').textContent = car.user_id ? 'продавець #' + car.user_id.slice(0, 6) : '—';
    document.getElementById('bidCount').textContent = car.bid_count || 0;

    const bidForm = document.getElementById('bidForm');
    const buyoutBtn = document.getElementById('buyoutBtn');
    if (status === 'active') {
      bidForm.classList.remove('hidden');
      document.getElementById('bidAmount').placeholder = `Від ${Number(bid + getBidStep(bid)).toLocaleString('uk-UA')}`;
      if (car.buyout_price) {
        buyoutBtn.classList.remove('hidden');
        buyoutBtn.textContent = `Купити зараз за ${Number(car.buyout_price).toLocaleString('uk-UA')} ${car.currency}`;
        buyoutBtn.onclick = buyout;
      } else {
        buyoutBtn.classList.add('hidden');
      }
    } else if (status === 'reserve_not_met' && inGraceWindow && car.buyout_price) {
      bidForm.classList.add('hidden');
      buyoutBtn.classList.remove('hidden');
      buyoutBtn.textContent = `Викупити за фіксованою ціною ${Number(car.buyout_price).toLocaleString('uk-UA')} ${car.currency}`;
      buyoutBtn.onclick = postAuctionBuyout;
    } else {
      bidForm.classList.add('hidden');
      buyoutBtn.classList.add('hidden');
    }

    updateTimer();
  }

  function updateTimer() {
    const badge = document.getElementById('timerBadge');
    if (!badge) return;
    const status = lotStatus(car);
    const now = new Date();
    const target = status === 'awaiting' ? new Date(car.auction_starts_at) : new Date(car.auction_ends_at);
    const diff = target - now;

    if (diff <= 0) {
      badge.textContent = status === 'awaiting' ? 'От-от почнеться' : 'Завершено';
      return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    badge.textContent = (status === 'awaiting' ? 'Старт через ' : '') +
      (d > 0 ? `${d}д ${h}г` : `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`);
    badge.classList.toggle('urgent', status === 'active' && diff < 24 * 3600000);
  }

  async function loadCar() {
    if (!carId) {
      console.error('lot.html: no id param in URL', window.location.href);
      document.getElementById('title').textContent = 'Лот не знайдено (немає ID у посиланні)';
      return;
    }
    const { data, error } = await sb.from('cars').select('*').eq('id', carId).maybeSingle();
    if (error) {
      console.error('lot.html: Supabase error loading lot', carId, error);
      document.getElementById('title').textContent = 'Не вдалося завантажити лот';
      return;
    }
    if (!data) {
      console.error('lot.html: no lot found for id', carId);
      document.getElementById('title').textContent = 'Лот не знайдено';
      return;
    }
    car = data;
    render();
    const idRow = document.getElementById('lotIdRow');
    if (idRow) { idRow.style.display = 'flex'; document.getElementById('lotIdText').textContent = carId; }
    const shareBtn = document.getElementById('lotShareBtn');
    if (shareBtn) shareBtn.innerHTML = TELEGRAM_LOGO_SVG;
  }

  window.copyCarId = function() {
    navigator.clipboard.writeText(String(carId)).then(() => alert('ID скопійовано: ' + carId));
  };

  window.shareToTelegram = function() {
    const url = `https://normalno-a55.vercel.app/lot.html?id=${carId}`;
    const text = car ? `${car.brand} ${car.model}, ${car.year} — аукціон на NORMALNO` : 'Погляньте на цей лот на NORMALNO!';
    window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`, '_blank');
  };

  async function placeBid() {
    const msgEl = document.getElementById('bidMsg');
    const amountInput = document.getElementById('bidAmount');
    const amount = parseFloat(amountInput.value);

    if (!currentUserId) { window.location.href = 'register2.html'; return; }
    if (!amount) { msgEl.textContent = 'Введіть суму ставки'; msgEl.style.color = 'red'; return; }

    const { data, error } = await sb.rpc('place_bid', { p_car_id: parseInt(carId), p_amount: amount });

    if (error) { msgEl.textContent = error.message; msgEl.style.color = 'red'; return; }
    if (!data.success) { msgEl.textContent = data.error; msgEl.style.color = 'red'; return; }

    msgEl.textContent = 'Ставка прийнята!';
    msgEl.style.color = 'green';
    amountInput.value = '';

    const toast = document.getElementById('extendToast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 3000);

    if (data.previous_leader) {
      fetch('/api/notify-events', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          kind: 'outbid',
          previousUserId: data.previous_leader,
          carLabel: `${car.brand} ${car.model}, ${car.year}`,
          newBid: data.new_bid,
          currency: car.currency,
          carId: carId
        })
      }).catch(() => {});
    }

    await loadCar();
  }

  async function buyout() {
    const msgEl = document.getElementById('bidMsg');
    if (!currentUserId) { window.location.href = 'register2.html'; return; }

    const { data, error } = await sb.rpc('buyout_auction', { p_car_id: parseInt(carId) });
    if (error) { msgEl.textContent = error.message; msgEl.style.color = 'red'; return; }
    if (!data.success) { msgEl.textContent = data.error; msgEl.style.color = 'red'; return; }

    msgEl.textContent = 'Вітаємо, ви купили авто!';
    msgEl.style.color = 'green';
    await loadCar();
  }

  async function postAuctionBuyout() {
    const msgEl = document.getElementById('bidMsg') || document.getElementById('statusArea');
    if (!currentUserId) { window.location.href = 'register2.html'; return; }
    if (!confirm('Викупити це авто за фіксованою ціною зараз?')) return;

    const { error } = await sb.rpc('post_auction_buyout', { p_car_id: parseInt(carId) });
    if (error) { alert(error.message); return; }

    alert('Вітаємо, ви викупили авто!');
    await loadCar();
  }

  async function init() {
    await ensureRatesLoaded();
    const { data: { session } } = await sb.auth.getSession();
    if (session) currentUserId = session.user.id;

    await loadCar();

    sb.channel('car-' + carId)
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'cars', filter: `id=eq.${carId}` }, payload => {
        car = payload.new;
        render();
      })
      .subscribe();

    timerInterval = setInterval(updateTimer, 1000);
  }

  init();
</script>

</body>
</html>
