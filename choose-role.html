<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMALNO — Останній крок</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; }
  .logo { text-align: center; font-size: 22px; font-weight: bold; color: #8E00FF; margin-bottom: 20px; }
  input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; }
  button.main { width: 100%; padding: 15px; background: #8E00FF; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .msg { text-align: center; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>

<div class="logo">Останній крок</div>
<input type="tel" id="phone" placeholder="Номер телефону">
<button class="main" onclick="saveProfile()">Продовжити</button>
<div class="msg" id="msg"></div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function saveProfile() {
    const msg = document.getElementById('msg');
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'register2.html'; return; }

    const phone = document.getElementById('phone').value;
    if (!phone) { msg.textContent = 'Введіть номер телефону'; msg.style.color = 'red'; return; }

    const { error } = await sb.from('profiles').update({ phone }).eq('user_id', session.user.id);

    if (error) { msg.textContent = error.message; msg.style.color = 'red'; return; }
    window.location.href = 'index.html';
  }
</script>

</body>
</html>
