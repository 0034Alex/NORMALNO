<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8E00FF">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NORMALNO">

<title>NORMALNO — Калькулятор лізингу</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; padding-bottom: 40px; max-width: 480px; margin-left: auto; margin-right: auto; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .logo { font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 4px; }
  .subtitle { color: #999; font-size: 13px; margin-bottom: 20px; }

  label { font-size: 12px; color: #999; display: block; margin-bottom: 4px; }
  input, select { width: 100%; padding: 14px; margin-bottom: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; font-family: Arial, sans-serif; }

  .slider-row { margin-bottom: 18px; }
  .slider-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
  .slider-label b { color: #8E00FF; }
  input[type="range"] { width: 100%; accent-color: #8E00FF; margin-bottom: 0; }

  .calc-results { background: #f5e6ff; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .calc-row { display: flex; justify-content: space-between; padding: 7px 0; font-size: 14px; border-top: 1px solid #e5cfff; }
  .calc-row:first-child { border-top: none; }
  .calc-row.main { font-size: 19px; font-weight: bold; color: #8E00FF; border-top: 1px solid #e5cfff; margin-top: 6px; padding-top: 12px; }
  .calc-note { font-size: 11px; color: #999; margin-bottom: 20px; }

  button.main { width: 100%; padding: 15px; background: #FF7A00; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 6px; }
  .msg { text-align: center; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>

<a href="index.html" class="back">&larr; На головну</a>
<div class="logo">📊 Калькулятор лізингу</div>
<div class="subtitle">Вкажіть вартість авто — розрахуємо щомісячний платіж</div>

<label>Вартість авто, грн</label>
<input type="number" id="carPrice" placeholder="Наприклад, 800000" oninput="updateCalc()">

<div class="slider-row">
  <div class="slider-label"><span>Термін лізингу</span><b id="monthsValue">24 міс.</b></div>
  <input type="range" id="monthsSlider" min="12" max="36" step="1" value="24" oninput="updateCalc()">
</div>

<div class="calc-results">
  <div class="calc-row"><span>Вартість авто</span><span id="calcPrice">—</span></div>
  <div class="calc-row"><span>Аванс (25%)</span><span id="calcDown">—</span></div>
  <div class="calc-row"><span>Річна ставка</span><span>36%</span></div>
  <div class="calc-row main"><span>Щомісячний платіж</span><span id="calcMonthly">—</span></div>
  <div class="calc-row"><span>Разом за весь термін</span><span id="calcTotal">—</span></div>
</div>
<div class="calc-note">Попередній розрахунок, не є офіційною пропозицією. Точні умови уточнюйте у менеджера.</div>

<input type="text" id="name" placeholder="Ваше ім'я">
<input type="tel" id="phone" placeholder="Номер телефону">
<button class="main" onclick="submitLead()">📞 Зв'язатися з менеджером</button>
<div class="msg" id="msg"></div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  let currentUserId = null;

  function updateCalc() {
    const price = parseFloat(document.getElementById('carPrice').value) || 0;
    const months = parseInt(document.getElementById('monthsSlider').value);
    document.getElementById('monthsValue').textContent = months + ' міс.';

    if (!price) {
      document.getElementById('calcPrice').textContent = '—';
      document.getElementById('calcDown').textContent = '—';
      document.getElementById('calcMonthly').textContent = '—';
      document.getElementById('calcTotal').textContent = '—';
      return;
    }

    const result = calcLeasing(price, months);
    document.getElementById('calcPrice').textContent = price.toLocaleString('uk-UA') + ' грн';
    document.getElementById('calcDown').textContent = result.downPayment.toLocaleString('uk-UA') + ' грн';
    document.getElementById('calcMonthly').textContent = result.monthlyPayment.toLocaleString('uk-UA') + ' грн';
    document.getElementById('calcTotal').textContent = result.totalPayment.toLocaleString('uk-UA') + ' грн';
  }

  async function submitLead() {
    const msg = document.getElementById('msg');
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const price = parseFloat(document.getElementById('carPrice').value) || 0;

    if (!name || !phone) {
      msg.textContent = "Заповніть ім'я та телефон";
      msg.style.color = 'red';
      return;
    }
    if (!price) {
      msg.textContent = 'Вкажіть вартість авто для розрахунку';
      msg.style.color = 'red';
      return;
    }

    const months = parseInt(document.getElementById('monthsSlider').value);
    const result = calcLeasing(price, months);
    const details = `Вартість авто: ${price.toLocaleString('uk-UA')} грн. Термін: ${months} міс. Аванс: ${result.downPayment.toLocaleString('uk-UA')} грн. Щомісячний платіж: ${result.monthlyPayment.toLocaleString('uk-UA')} грн. Разом: ${result.totalPayment.toLocaleString('uk-UA')} грн.`;

    const { error } = await sb.from('leads').insert({
      type: 'leasing',
      user_id: currentUserId,
      name: name,
      phone: phone,
      budget: result.monthlyPayment,
      details: details
    });

    if (error) {
      msg.textContent = error.message;
      msg.style.color = 'red';
      return;
    }

    fetch('/api/notify-lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ leadType: 'leasing', name, phone, summary: details })
    }).catch(() => {});

    msg.textContent = "Дякуємо! Менеджер зв'яжеться з вами найближчим часом.";
    msg.style.color = 'green';
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      currentUserId = session.user.id;
      const { data: profile } = await sb.from('profiles').select('name, phone').eq('user_id', currentUserId).maybeSingle();
      if (profile) {
        document.getElementById('name').value = profile.name || '';
        document.getElementById('phone').value = profile.phone || '';
      }
    }
  }

  init();
</script>

</body>
</html>
