<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMALNO — Стати партнером</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .logo { font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 4px; }
  .subtitle { color: #999; font-size: 13px; margin-bottom: 20px; }
  input, select, textarea {
    width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #ddd;
    border-radius: 10px; font-size: 15px; font-family: Arial, sans-serif;
  }
  textarea { min-height: 90px; resize: vertical; }
  button.main { width: 100%; padding: 15px; background: #8E00FF; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .msg { text-align: center; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>

<a href="partners.html" class="back">&larr; Назад до партнерів</a>
<div class="logo">🤝 Стати партнером NORMALNO</div>
<div class="subtitle">Заявка потрапить на розгляд модератору</div>

<input type="text" id="name" placeholder="Назва компанії">
<select id="category">
  <option value="">Категорія — оберіть</option>
  <option value="Автосалон">Автосалон</option>
  <option value="СТО">СТО</option>
  <option value="Автомийка">Автомийка</option>
  <option value="Автопідбір">Автопідбір</option>
  <option value="Детейлінг">Детейлінг</option>
  <option value="Запчастини">Запчастини</option>
</select>
<input type="text" id="contactPerson" placeholder="Контактна особа">
<input type="tel" id="phone" placeholder="Телефон">
<input type="email" id="email" placeholder="Email">
<input type="text" id="address" placeholder="Адреса (місто, вулиця)">
<textarea id="description" placeholder="Короткий опис послуг"></textarea>

<button class="main" onclick="submitPartner()">Надіслати заявку</button>
<div class="msg" id="msg"></div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function submitPartner() {
    const msg = document.getElementById('msg');
    const { data: { session } } = await sb.auth.getSession();

    if (!session) {
      window.location.href = 'register2.html';
      return;
    }

    const name = document.getElementById('name').value.trim();
    const category = document.getElementById('category').value;
    const phone = document.getElementById('phone').value.trim();

    if (!name || !category || !phone) {
      msg.textContent = "Заповніть хоча б назву, категорію і телефон";
      msg.style.color = 'red';
      return;
    }

    const { error } = await sb.from('partners').insert({
      name: name,
      category: category,
      contact_person: document.getElementById('contactPerson').value.trim(),
      phone: phone,
      email: document.getElementById('email').value.trim(),
      address: document.getElementById('address').value.trim(),
      description: document.getElementById('description').value.trim(),
      status: 'pending'
    });

    if (error) {
      msg.textContent = error.message;
      msg.style.color = 'red';
      return;
    }

    fetch('/api/notify-lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        leadType: 'partner',
        name: name,
        phone: phone,
        summary: `Нова заявка партнера: ${name} (${category}). Контакт: ${document.getElementById('contactPerson').value.trim() || '—'}`
      })
    }).catch(() => {});

    msg.textContent = 'Дякуємо! Заявку надіслано на розгляд.';
    msg.style.color = 'green';
  }
</script>

</body>
</html>
