<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8E00FF">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>NORMALNO — Партнер</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js?v=1786440586"></script>
<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding-bottom: 40px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin: 16px 0 0 16px; }

  .photo-gallery { position: relative; width: 100%; aspect-ratio: 16/10; background: #f2f2f2; margin: 12px 0; }
  .photo-scroll { display: flex; overflow-x: auto; width: 100%; height: 100%; scroll-snap-type: x mandatory; }
  .photo-scroll img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; }
  .photo-noimg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #ccc; }
  .photo-dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; }
  .photo-dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.7); box-shadow: 0 0 3px rgba(0,0,0,0.4); }

  .content { padding: 0 16px; }
  .partner-name { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
  .partner-category { display: inline-block; background: #f5e6ff; color: #8E00FF; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 10px; margin-bottom: 12px; }
  .status-open { color: #1a8f2a; font-weight: bold; }
  .status-closed { color: #cc0000; font-weight: bold; }
  .meta-row { font-size: 13px; color: #666; margin-bottom: 6px; }

  .desc-text { font-size: 14px; color: #444; line-height: 1.5; margin: 14px 0; }

  .social-row { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }
  .social-icon { width: 44px; height: 44px; border-radius: 12px; background: #f7f7f7; display: flex; align-items: center; justify-content: center; font-size: 20px; text-decoration: none; }

  .actions-row { display: flex; gap: 8px; margin: 16px 0 8px; }
  .action-btn2 { flex: 1; text-align: center; padding: 13px; border-radius: 10px; font-weight: bold; font-size: 14px; text-decoration: none; border: none; cursor: pointer; }
  .btn-call { background: #f5e6ff; color: #8E00FF; }
  .btn-route { background: #fff0e0; color: #FF7A00; }

  .section-title { font-size: 17px; font-weight: bold; margin: 26px 0 12px; }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-box { background: #f9f2ff; border-radius: 12px; padding: 14px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: bold; color: #8E00FF; }
  .stat-label { font-size: 11px; color: #666; margin-top: 2px; }

  .service-card { border: 1px solid #eee; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .service-name { font-size: 14px; font-weight: bold; }
  .service-price { font-size: 14px; color: #8E00FF; font-weight: bold; white-space: nowrap; }

  .empty { text-align: center; color: #999; padding: 20px; }
  .full-feed { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .route-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; display: flex; align-items: flex-end; justify-content: center; }
  .route-modal-overlay.hidden { display: none; }
  .route-modal-sheet { background: #fff; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 20px; }
  .route-modal-title { font-size: 16px; font-weight: bold; margin-bottom: 14px; }
  .route-app-btn { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; border: 1px solid #eee; margin-bottom: 10px; text-decoration: none; color: #222; font-weight: bold; font-size: 15px; }
  .route-app-icon { font-size: 22px; }
  .route-modal-close { text-align: center; padding: 10px; color: #999; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>

<a href="partners.html" class="back">&larr; Назад до партнерів</a>

<div id="content"><div class="empty">Завантаження...</div></div>

<div class="route-modal-overlay hidden" id="routeModal" onclick="if(event.target===this) closeRouteMenu()">
  <div class="route-modal-sheet">
    <div class="route-modal-title">Відкрити маршрут у...</div>
    <a class="route-app-btn" id="routeGoogleMaps" href="#" target="_blank"><span class="route-app-icon">🗺️</span> Google Maps</a>
    <a class="route-app-btn" id="routeWaze" href="#" target="_blank"><span class="route-app-icon">🚗</span> Waze</a>
    <a class="route-app-btn" id="routeAppleMaps" href="#" target="_blank"><span class="route-app-icon">📍</span> Apple Maps</a>
    <div class="route-modal-close" onclick="closeRouteMenu()">Скасувати</div>
  </div>
</div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  const params = new URLSearchParams(window.location.search);
  const partnerId = params.get('id');

  window.openRouteMenuByAddress = function(address) {
    const q = encodeURIComponent(address);
    document.getElementById('routeGoogleMaps').href = `https://www.google.com/maps/dir/?api=1&destination=${q}`;
    document.getElementById('routeWaze').href = `https://waze.com/ul?q=${q}&navigate=yes`;
    document.getElementById('routeAppleMaps').href = `https://maps.apple.com/?daddr=${q}`;
    document.getElementById('routeModal').classList.remove('hidden');
  };
  window.closeRouteMenu = function() {
    document.getElementById('routeModal').classList.add('hidden');
  };

  function isOpenNow(p) {
    if (!p.work_from || !p.work_to) return null;
    const days = (p.work_days && p.work_days.length) ? p.work_days : ['mon','tue','wed','thu','fri','sat','sun'];
    const dayMap = ['sun','mon','tue','wed','thu','fri','sat'];
    const now = new Date();
    if (!days.includes(dayMap[now.getDay()])) return false;
    const [fh, fm] = p.work_from.split(':').map(Number);
    const [th, tm] = p.work_to.split(':').map(Number);
    const nowMin = now.getHours() * 60 + now.getMinutes();
    return nowMin >= (fh * 60 + fm) && nowMin <= (th * 60 + tm);
  }

  const SOCIAL_ICONS = [
    { key: 'telegram_link', icon: '✈️' },
    { key: 'instagram_link', icon: '📷' },
    { key: 'tiktok_link', icon: '🎵' },
    { key: 'threads_link', icon: '🧵' },
    { key: 'youtube_link', icon: '▶️' },
    { key: 'website', icon: '🌐' }
  ];

  async function load() {
    const { data: p, error } = await sb.from('partners').select('*').eq('id', partnerId).eq('status', 'approved').maybeSingle();
    const content = document.getElementById('content');
    if (error || !p) {
      content.innerHTML = '<div class="empty">Партнера не знайдено</div>';
      return;
    }

    const photos = p.photos || [];
    const photoHtml = photos.length
      ? `<div class="photo-scroll">${photos.map(ph => `<img src="${ph}" onerror="this.style.display='none'">`).join('')}</div>` +
        (photos.length > 1 ? `<div class="photo-dots">${photos.map(() => '<span></span>').join('')}</div>` : '')
      : `<div class="photo-noimg">🏢</div>`;

    const openStatus = isOpenNow(p);
    const statusHtml = openStatus === null ? '' : (openStatus ? '<span class="status-open">🟢 Відкрито зараз</span>' : '<span class="status-closed">🔴 Закрито</span>');
    const hoursText = (p.work_from && p.work_to) ? `${p.work_from}–${p.work_to}` : '';

    const socialsHtml = SOCIAL_ICONS.filter(s => p[s.key]).map(s =>
      `<a class="social-icon" href="${p[s.key].startsWith('http') ? p[s.key] : 'https://' + p[s.key]}" target="_blank">${s.icon}</a>`
    ).join('');

    let bottomSectionHtml = '';
    if (p.category === 'Автосалон') {
      const { count: activeCount } = await sb.from('cars').select('*', { count: 'exact', head: true }).eq('user_id', p.user_id).eq('archived', false);
      const { count: soldCount } = await sb.from('cars').select('*', { count: 'exact', head: true }).eq('user_id', p.user_id).eq('sold', true);
      const { data: cars } = await sb.from('cars').select('*').eq('user_id', p.user_id).eq('archived', false).order('created_at', { ascending: false }).limit(20);

      bottomSectionHtml = `
        <div class="section-title">Статистика</div>
        <div class="stats-grid">
          <div class="stat-box"><div class="stat-num">${activeCount || 0}</div><div class="stat-label">Авто на продажі</div></div>
          <div class="stat-box"><div class="stat-num">${soldCount || 0}</div><div class="stat-label">Всього продано</div></div>
        </div>
        <div class="section-title">Авто в наявності</div>
        <div class="full-feed" id="partnerCars">${(cars && cars.length) ? cars.map(c => renderCarCard(c, null, new Set())).join('') : '<div class="empty">Поки немає авто в наявності</div>'}</div>
      `;
    } else if (p.services && p.services.length > 0) {
      bottomSectionHtml = `
        <div class="section-title">Послуги та ціни</div>
        ${p.services.map(s => `
          <div class="service-card">
            <div class="service-name">${s.name}</div>
            <div class="service-price">${s.price || ''}</div>
          </div>
        `).join('')}
      `;
    }

    content.innerHTML = `
      <div class="photo-gallery">${photoHtml}</div>
      <div class="content">
        <div class="partner-name">${p.name}</div>
        <div class="partner-category">${p.category}</div>
        ${p.address ? `<div class="meta-row">📍 ${p.address}</div>` : ''}
        ${hoursText ? `<div class="meta-row">🕐 ${hoursText} ${statusHtml}</div>` : ''}
        ${p.description ? `<div class="desc-text">${p.description}</div>` : ''}
        ${socialsHtml ? `<div class="social-row">${socialsHtml}</div>` : ''}
        <div class="actions-row">
          ${p.phone ? `<a class="action-btn2 btn-call" href="tel:${p.phone}">📞 Подзвонити</a>` : ''}
          ${p.address ? `<button class="action-btn2 btn-route" onclick="openRouteMenuByAddress('${p.address.replace(/'/g, "\\'")}')">🗺️ Маршрут</button>` : ''}
        </div>
        ${bottomSectionHtml}
      </div>
    `;
  }

  load();
</script>

</body>
</html>
