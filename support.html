<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8E00FF">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NORMALNO">

<title>NORMALNO — Підтримка</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js?v=1786440586"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; padding-bottom: 40px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .logo { font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 4px; }
  .subtitle { color: #999; font-size: 13px; margin-bottom: 20px; }
  label { font-size: 12px; color: #999; display: block; margin-bottom: 4px; }
  input, textarea { width: 100%; padding: 14px; margin-bottom: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; font-family: Arial, sans-serif; }
  textarea { min-height: 130px; resize: vertical; }
  button.main { width: 100%; padding: 15px; background: #8E00FF; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .msg { text-align: center; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>

<a href="profile.html" class="back">&larr; Назад до профілю</a>
<div class="logo">🎫 Підтримка</div>
<div class="subtitle">Опишіть проблему детально — ми відповімо якнайшвидше</div>

<label>Телефон</label>
<input type="tel" id="supPhone">
<label>Email</label>
<input type="email" id="supEmail">
<label>Що сталося?</label>
<textarea id="supMessage" placeholder="Опишіть проблему якомога детальніше"></textarea>

<button class="main" onclick="submitSupport()">Відправити</button>
<div class="msg" id="msg"></div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function submitSupport() {
    const msg = document.getElementById('msg');
    const phone = document.getElementById('supPhone').value.trim();
    const email = document.getElementById('supEmail').value.trim();
    const message = document.getElementById('supMessage').value.trim();

    if (!phone || !email || !message) {
      msg.textContent = "Заповніть телефон, email і опис проблеми";
      msg.style.color = 'red';
      return;
    }

    const { data: { session } } = await sb.auth.getSession();
    let name = '';
    if (session) {
      const { data: profile } = await sb.from('profiles').select('name').eq('user_id', session.user.id).maybeSingle();
      name = (profile && profile.name) || '';
    }

    const { error } = await sb.from('leads').insert({
      type: 'support',
      user_id: session ? session.user.id : null,
      name: name,
      phone: phone,
      details: `Email: ${email}\n${message}`
    });

    if (error) {
      msg.textContent = error.message;
      msg.style.color = 'red';
      return;
    }

    fetch('/api/notify-lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ leadType: 'support', name, phone, summary: `Email: ${email}\n${message}` })
    }).catch(() => {});

    msg.textContent = 'Дякуємо! Ми зв\'яжемося з вами найближчим часом.';
    msg.style.color = 'green';
  }

  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch (e) {}
    if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) {
      try { tg.disableVerticalSwipes(); } catch (e) {}
    }
  }
</script>
</body>
</html>
