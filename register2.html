<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8E00FF">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NORMALNO">

<title>NORMALNO — Реєстрація</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js?v=1786440586"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #ffffff; margin: 0; padding: 20px; }
  .logo { text-align: center; font-size: 28px; font-weight: bold; color: #8E00FF; margin: 20px 0 30px; }
  .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
  .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: #999; font-weight: bold; }
  .tab.active { color: #8E00FF; border-bottom: 3px solid #FF7A00; }
  input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 15px; }
  button.main { width: 100%; padding: 15px; background: #8E00FF; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
  .forgot { text-align: center; margin-top: 12px; color: #FF7A00; font-size: 14px; cursor: pointer; }
  .msg { text-align: center; margin-top: 12px; font-size: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>

<div class="logo">NORMALNO</div>

<div class="tabs">
  <div class="tab active" id="tabRegister" onclick="showTab('register')">Реєстрація</div>
  <div class="tab" id="tabLogin" onclick="showTab('login')">Вхід</div>
</div>

<div id="registerForm">
  <input type="text" id="regName" placeholder="Ваше ім'я">
  <input type="tel" id="regPhone" placeholder="Номер телефону">
  <input type="email" id="regEmail" placeholder="Email">
  <input type="password" id="regPassword" placeholder="Придумайте пароль">
  <button class="main" onclick="register()">Зареєструватися</button>
  <div class="msg" id="regMsg"></div>
</div>

<div id="loginForm" class="hidden">
  <input type="text" id="loginIdentifier" placeholder="Email або номер телефону">
  <input type="password" id="loginPassword" placeholder="Пароль">
  <button class="main" onclick="login()">Увійти</button>
  <div class="forgot" onclick="forgotPassword()">Забули пароль?</div>
  <div class="msg" id="loginMsg"></div>
</div>

<script>
  let tgUser = null;
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch (e) {}
    if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) {
      try { tg.disableVerticalSwipes(); } catch (e) {}
    }
    tgUser = tg.initDataUnsafe && tg.initDataUnsafe.user;
  }

  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  // Якщо сесія вже активна (людина вже входила раніше на цьому пристрої/в цьому Mini App) —
  // одразу пускаємо в застосунок, форму не показуємо.
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) window.location.href = 'index.html';
  })();

  // Прив'язуємо Telegram до профілю (потрібно, щоб бот міг присилати скидання паролю
  // і повідомлення). Робиться після успішного входу/реєстрації.
  async function linkTelegramIfPresent(userId) {
    if (!tgUser || !userId) return;
    try {
      await sb.from('profiles').update({
        telegram_user_id: String(tgUser.id),
        telegram_username: tgUser.username || ''
      }).eq('user_id', userId);
    } catch (e) { /* не критично, не блокуємо вхід */ }
  }

  function showTab(tab) {
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
    document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
  }

  async function register() {
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const msg = document.getElementById('regMsg');

    if (!name || !phone || !email || !password) {
      msg.textContent = "Заповніть ім'я, телефон, email і пароль";
      msg.style.color = 'red';
      return;
    }

    msg.textContent = 'Створюємо акаунт...';
    msg.style.color = '#999';

    const refCode = new URLSearchParams(window.location.search).get('ref');

    const resp = await fetch('/api/telegram-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'register', name, phone, email, password, refCode })
    });
    const result = await resp.json();
    if (result.error) {
      msg.textContent = result.error;
      msg.style.color = 'red';
      return;
    }

    const { data: signInData, error: signInError } = await sb.auth.signInWithPassword({ email: result.email, password: result.password });
    if (signInError) {
      msg.textContent = 'Акаунт створено, але не вдалося увійти автоматично. Спробуйте увійти вручну.';
      msg.style.color = 'red';
      return;
    }
    await linkTelegramIfPresent(signInData.user.id);

    msg.textContent = 'Готово! Виконуємо вхід...';
    msg.style.color = 'green';
    window.location.href = 'index.html';
  }

  async function resolveEmail(identifier) {
    if (identifier.includes('@')) return { email: identifier };
    const resp = await fetch('/api/resolve-login-email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier })
    });
    return await resp.json();
  }

  async function login() {
    const identifier = document.getElementById('loginIdentifier').value.trim();
    const password = document.getElementById('loginPassword').value;
    const msg = document.getElementById('loginMsg');

    if (!identifier || !password) {
      msg.textContent = 'Введіть email/телефон і пароль';
      msg.style.color = 'red';
      return;
    }

    const resolved = await resolveEmail(identifier);
    if (resolved.error || !resolved.email) {
      msg.textContent = resolved.error || 'Користувача не знайдено';
      msg.style.color = 'red';
      return;
    }

    const { data: signInData, error } = await sb.auth.signInWithPassword({ email: resolved.email, password });
    if (error) {
      msg.textContent = error.message;
      msg.style.color = 'red';
      return;
    }
    await linkTelegramIfPresent(signInData.user.id);
    window.location.href = 'index.html';
  }

  async function forgotPassword() {
    const identifier = document.getElementById('loginIdentifier').value.trim();
    if (!identifier) {
      alert('Спочатку введіть email або номер телефону вище');
      return;
    }
    const resp = await fetch('/api/telegram-auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'password_reset_request', identifier })
    });
    const result = await resp.json();
    if (result.error) {
      alert(result.error);
      return;
    }
    alert('Ми надіслали повідомлення у ваш Telegram. Напишіть боту новий пароль одним повідомленням (мінімум 6 символів).');
  }
</script>

</body>
</html>
