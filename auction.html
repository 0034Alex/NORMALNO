<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMALNO — Аукціон</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 16px; padding-bottom: 80px; }
  .logo { text-align: center; font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 16px; }
  .tabs { display: flex; margin-bottom: 16px; border-bottom: 2px solid #eee; }
  .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: #999; font-weight: bold; }
  .tab.active { color: #8E00FF; border-bottom: 3px solid #FF7A00; }
  .empty { text-align: center; color: #999; margin-top: 40px; }

  .lots { display: flex; flex-direction: column; gap: 16px; }
  .lot-card { border: 1px solid #eee; border-radius: 14px; overflow: hidden; cursor: pointer; }
  .lot-photo { position: relative; width: 100%; aspect-ratio: 16/9; background: #f2f2f2; }
  .lot-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lot-noimg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #ccc; }
  .lot-badge { position: absolute; top: 10px; left: 10px; background: #8E00FF; color: #fff; font-size: 11px; font-weight: bold; padding: 5px 10px; border-radius: 20px; }
  .lot-timer { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: #fff; font-size: 12px; font-weight: bold; padding: 5px 10px; border-radius: 20px; }
  .lot-timer.urgent { background: #cc0000; }
  .lot-heart { position: absolute; bottom: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center; font-size: 16px; color: #8E00FF; cursor: pointer; }
  .lot-body { padding: 12px 14px; }
  .lot-title { font-weight: bold; font-size: 16px; margin-bottom: 6px; }
  .lot-row { display: flex; justify-content: space-between; font-size: 13px; color: #555; padding: 4px 0; border-top: 1px solid #f5f5f5; }
  .lot-row b { color: #111; }
  .lot-bid { color: #8E00FF; font-weight: bold; }

  @media (min-width: 700px) {
    .lots { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: white; border-top: 1px solid #eee; padding: 8px 0;
  }
  .nav-item { flex: 1; text-align: center; padding: 8px 0; cursor: pointer; color: #999; font-size: 11px; position: relative; }
  .nav-item .icon { font-size: 20px; display: block; margin-bottom: 2px; }
  .nav-item.active { color: #8E00FF; font-weight: bold; }
  .nav-item.active::before { content: ''; position: absolute; top: -8px; left: 20%; right: 20%; height: 3px; background: #FF7A00; border-radius: 3px; }
</style>
</head>
<body>

<div class="logo">Аукціон</div>

<div class="tabs">
  <div class="tab active" id="tabAll" onclick="showTab('all')">Всі торги</div>
  <div class="tab" id="tabFav" onclick="showTab('fav')">Обране</div>
</div>

<div class="lots" id="lots">Завантаження...</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="window.location.href='index.html'"><span class="icon">🏠</span>Головна</div>
  <div class="nav-item active"><span class="icon">🔨</span>Аукціон</div>
  <div class="nav-item" onclick="window.location.href='sell.html'"><span class="icon">➕</span>Продати</div>
  <div class="nav-item" onclick="window.location.href='favorites.html'"><span class="icon">❤️</span>Обране</div>
  <div class="nav-item" onclick="window.location.href='index.html'"><span class="icon">👤</span>Профіль</div>
</div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  let currentUserId = null;
  let allLots = [];
  let favoriteCarIds = new Set();

  function lotStatus(car) {
    const now = new Date();
    const starts = new Date(car.auction_starts_at);
    const ends = new Date(car.auction_ends_at);
    if (now < starts) return 'awaiting';
    if (now < ends) return 'active';
    if (car.reserve_price && (car.current_bid || 0) < car.reserve_price) return 'reserve_not_met';
    return 'sold';
  }

  function formatTimer(car) {
    const now = new Date();
    const status = lotStatus(car);
    const target = status === 'awaiting' ? new Date(car.auction_starts_at) : new Date(car.auction_ends_at);
    const diff = target - now;
    if (diff <= 0) return status === 'awaiting' ? 'От-от почнеться' : 'Завершено';
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const label = d > 0 ? `${d}д ${h}г` : `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return (status === 'awaiting' ? 'Старт через ' : '') + label;
  }

  function renderLotCard(car) {
    const status = lotStatus(car);
    const urgent = status === 'active' && (new Date(car.auction_ends_at) - new Date()) < 24 * 3600000;
    const badgeText = status === 'awaiting' ? 'Очікування' : status === 'active' ? 'Йдуть торги' : status === 'sold' ? 'Продано' : 'Резерв не пройдено';

    return `
      <div class="lot-card" onclick="window.location.href='lot.html?id=${car.id}'">
        <div class="lot-photo">
          ${car.photo_url ? `<img src="${car.photo_url}" onerror="this.style.display='none'">` : `<div class="lot-noimg">🚗</div>`}
          <div class="lot-badge">${badgeText}</div>
          <div class="lot-timer ${urgent ? 'urgent' : ''}">${formatTimer(car)}</div>
          <div class="lot-heart" onclick="event.stopPropagation(); toggleLotFavorite(${car.id})">${favoriteCarIds.has(car.id) ? '❤️' : '♡'}</div>
        </div>
        <div class="lot-body">
          <div class="lot-title">${car.brand} ${car.model}, ${car.year}</div>
          <div class="lot-row"><span>Стан</span><b>${CONDITION_LABELS[car.condition] || '—'}</b></div>
          <div class="lot-row"><span>Поточна ставка</span><b class="lot-bid">${car.current_bid ? Number(car.current_bid).toLocaleString('uk-UA') : Number(car.start_price||0).toLocaleString('uk-UA')} ${car.currency}</b></div>
          <div class="lot-row"><span>Ставок зроблено</span><b>${car.bid_count || 0}</b></div>
        </div>
      </div>
    `;
  }

  async function toggleLotFavorite(carId) {
    if (!currentUserId) return;
    if (favoriteCarIds.has(carId)) {
      await sb.from('favorites').delete().eq('user_id', currentUserId).eq('car_id', carId);
      favoriteCarIds.delete(carId);
    } else {
      await sb.from('favorites').insert({ user_id: currentUserId, car_id: carId });
      favoriteCarIds.add(carId);
    }
    document.getElementById('tabFav').classList.contains('active') ? renderFav() : renderAll();
  }

  async function load() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      currentUserId = session.user.id;
      const { data: favs } = await sb.from('favorites').select('car_id').eq('user_id', currentUserId);
      favoriteCarIds = new Set((favs || []).map(f => f.car_id));
    }

    const { data: cars } = await sb.from('cars').select('*').eq('listing_type', 'auction').order('auction_ends_at', { ascending: true });
    allLots = cars || [];
    renderAll();
  }

  function renderAll() {
    const lotsEl = document.getElementById('lots');
    if (allLots.length === 0) {
      lotsEl.innerHTML = '<div class="empty">Поки що немає активних аукціонів</div>';
      return;
    }
    lotsEl.innerHTML = allLots.map(c => renderLotCard(c)).join('');
  }

  function renderFav() {
    const lotsEl = document.getElementById('lots');
    const favLots = allLots.filter(c => favoriteCarIds.has(c.id));
    if (favLots.length === 0) {
      lotsEl.innerHTML = '<div class="empty">Ви ще не додали лоти в обране</div>';
      return;
    }
    lotsEl.innerHTML = favLots.map(c => renderLotCard(c)).join('');
  }

  function showTab(tab) {
    document.getElementById('tabAll').classList.toggle('active', tab === 'all');
    document.getElementById('tabFav').classList.toggle('active', tab === 'fav');
    if (tab === 'all') renderAll(); else renderFav();
  }

  setInterval(() => {
    document.querySelectorAll('.lot-timer').forEach((el, i) => {
      if (allLots[i]) el.textContent = formatTimer(allLots[i]);
    });
  }, 1000);

  load();
</script>

</body>
</html>
