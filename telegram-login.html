<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMALNO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: Arial, sans-serif; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .logo { font-size: 26px; font-weight: bold; color: #8E00FF; margin-bottom: 20px; }
  .spinner {
    width: 32px; height: 32px; border: 3px solid #f0e6ff;
    border-top-color: #8E00FF; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err { color: #c00; font-size: 13px; margin-top: 16px; text-align: center; padding: 0 20px; }
</style>
</head>
<body>
<div class="logo">NORMALNO</div>
<div class="spinner" id="spinner"></div>
<div class="err" id="err"></div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();

    function applyTgSafeArea() {
      const inset = tg.contentSafeAreaInset || tg.safeAreaInset || {};
      document.body.style.paddingTop = (inset.top || 0) + 'px';
    }
    if (tg.onEvent) {
      tg.onEvent('contentSafeAreaChanged', applyTgSafeArea);
      tg.onEvent('safeAreaChanged', applyTgSafeArea);
      tg.onEvent('fullscreenChanged', applyTgSafeArea);
    }
    if (tg.requestFullscreen) { try { tg.requestFullscreen(); } catch (e) {} }
    applyTgSafeArea();
    setTimeout(applyTgSafeArea, 300);
  }

  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  function showError() {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('err').textContent = 'Не вдалося увійти. Спробуйте ще раз або відкрийте сайт напряму.';
  }

  async function telegramLogin() {
    try {
      const tg = window.Telegram && window.Telegram.WebApp;

      if (!tg || !tg.initData) {
        window.location.href = 'register2.html';
        return;
      }

      const resp = await fetch('/api/telegram-auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: tg.initData })
      });

      const result = await resp.json();

      if (result.error) {
        showError();
        return;
      }

      const { data: sessionData, error } = await sb.auth.signInWithPassword({ email: result.email, password: result.password });
      if (error) {
        showError();
        return;
      }

      const photoUrl = tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.photo_url;
      if (photoUrl && sessionData && sessionData.user) {
        await sb.from('profiles').update({ avatar_url: photoUrl }).eq('user_id', sessionData.user.id);
      }

      window.location.href = result.isNewUser ? 'choose-role.html' : 'index.html';
    } catch (err) {
      showError();
    }
  }

  telegramLogin();
</script>
</body>
</html>
