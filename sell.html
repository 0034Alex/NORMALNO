<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMALNO — Продати авто</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #ffffff; margin: 0; padding: 20px; padding-bottom: 60px; }
  .logo { text-align: center; font-size: 22px; font-weight: bold; color: #8E00FF; margin-bottom: 20px; }
  h2 { font-size: 15px; color: #666; margin: 20px 0 8px; }
  input, select, textarea {
    width: 100%; padding: 14px; margin-bottom: 10px; border: 1px solid #ddd;
    border-radius: 10px; font-size: 15px; font-family: Arial, sans-serif;
  }
  textarea { min-height: 90px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  button.main {
    width: 100%; padding: 15px; background: #8E00FF; color: white; border: none;
    border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 14px;
  }
  .msg { text-align: center; margin-top: 12px; font-size: 14px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
</style>
</head>
<body>

<a href="index.html" class="back">&larr; Назад на головну</a>
<div class="logo">Продати авто</div>

<h2>Тип</h2>
<select id="condition">
  <option value="">Стан — оберіть</option>
  <option value="new">Нове</option>
  <option value="used">Б/у</option>
  <option value="imported">Пригон</option>
</select>
<select id="transportType">
  <option value="">Тип транспорту — оберіть</option>
  <option value="car">Легкове</option>
  <option value="moto">Мото</option>
  <option value="truck">Вантажне</option>
  <option value="water">Водне</option>
</select>
<select id="bodyType">
  <option value="">Тип кузова — оберіть</option>
  <option value="sedan">Седан</option>
  <option value="hatchback">Хетчбек</option>
  <option value="coupe">Купе</option>
  <option value="suv">Позашляховик / SUV</option>
  <option value="wagon">Універсал</option>
  <option value="minivan">Мінівен</option>
  <option value="pickup">Пікап</option>
</select>

<h2>Основне</h2>
<input type="text" id="brand" placeholder="Марка (напр. Toyota)">
<input type="text" id="model" placeholder="Модель (напр. Camry)">
<div class="row">
  <input type="number" id="year" placeholder="Рік випуску">
  <input type="number" id="mileage" placeholder="Пробіг, км">
</div>
<input type="text" id="region" placeholder="Регіон (напр. Київська область)">

<h2>Ціна та оплата</h2>
<div class="row">
  <input type="number" id="price" placeholder="Ціна">
  <select id="currency">
    <option value="USD">$</option>
    <option value="EUR">€</option>
    <option value="UAH">грн</option>
  </select>
</div>
<select id="paymentType">
  <option value="">Тип оплати — оберіть</option>
  <option value="cash">Готівка</option>
  <option value="credit">Кредит</option>
  <option value="leasing">Лізинг</option>
  <option value="installment">Розстрочка</option>
  <option value="transfer">Переказ на рахунок</option>
  <option value="tradein">Трейд-ін</option>
</select>

<h2>Характеристики</h2>
<select id="fuelType">
  <option value="">Тип палива — оберіть</option>
  <option value="petrol">Бензин</option>
  <option value="diesel">Дизель</option>
  <option value="hybrid">Гібрид</option>
  <option value="gas">Газ</option>
  <option value="electric">Електро</option>
</select>
<select id="transmission">
  <option value="">Коробка передач — оберіть</option>
  <option value="manual">Механіка</option>
  <option value="automatic">Автомат</option>
  <option value="variator">Варіатор</option>
</select>
<select id="driveType">
  <option value="">Тип приводу — оберіть</option>
  <option value="front">Передній</option>
  <option value="rear">Задній</option>
  <option value="all">Повний</option>
</select>
<input type="number" step="0.1" id="engineVolume" placeholder="Об'єм двигуна, л (напр. 2.0)">

<h2>Фото та опис</h2>
<input type="text" id="photoUrl" placeholder="Посилання на фото (додамо завантаження пізніше)">
<textarea id="description" placeholder="Опис авто"></textarea>

<button class="main" onclick="submitCar()">Опублікувати оголошення</button>
<div class="msg" id="msg"></div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  async function submitCar() {
    const { data: { session } } = await sb.auth.getSession();
    const msg = document.getElementById('msg');

    if (!session) {
      window.location.href = 'register2.html';
      return;
    }

    const brand = document.getElementById('brand').value;
    const model = document.getElementById('model').value;
    const year = document.getElementById('year').value;
    const price = document.getElementById('price').value;

    if (!brand || !model || !year || !price) {
      msg.textContent = "Заповніть хоча б марку, модель, рік і ціну";
      msg.style.color = 'red';
      return;
    }

    const { error } = await sb.from('cars').insert({
      user_id: session.user.id,
      brand: brand,
      model: model,
      year: parseInt(year),
      price: parseFloat(price),
      currency: document.getElementById('currency').value,
      mileage: parseInt(document.getElementById('mileage').value) || null,
      fuel_type: document.getElementById('fuelType').value,
      transmission: document.getElementById('transmission').value,
      region: document.getElementById('region').value,
      description: document.getElementById('description').value,
      photo_url: document.getElementById('photoUrl').value,
      body_type: document.getElementById('bodyType').value,
      transport_type: document.getElementById('transportType').value,
      drive_type: document.getElementById('driveType').value,
      engine_volume: parseFloat(document.getElementById('engineVolume').value) || null,
      payment_type: document.getElementById('paymentType').value,
      condition: document.getElementById('condition').value
    });

    if (error) {
      msg.textContent = error.message;
      msg.style.color = 'red';
      return;
    }

    msg.textContent = "Готово! Оголошення опубліковано.";
    msg.style.color = 'green';
    setTimeout(() => { window.location.href = 'index.html'; }, 1200);
  }
</script>

</body>
</html>
