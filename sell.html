<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMALNO — Продати авто</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #ffffff; margin: 0; padding: 20px; padding-bottom: 60px; }
  .logo { text-align: center; font-size: 22px; font-weight: bold; color: #8E00FF; margin-bottom: 16px; }
  .status-panel {
    background: #f5e6ff; border-radius: 12px; padding: 14px; margin-bottom: 20px; font-size: 13px; color: #555;
  }
  .status-panel b { color: #8E00FF; }
  h2 { font-size: 15px; color: #666; margin: 20px 0 8px; }
  input, select, textarea {
    width: 100%; padding: 14px; margin-bottom: 10px; border: 1px solid #ddd;
    border-radius: 10px; font-size: 15px; font-family: Arial, sans-serif;
  }
  select:disabled { color: #bbb; background: #fafafa; }
  textarea { min-height: 90px; resize: vertical; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .check-row { display: flex; align-items: center; gap: 8px; padding: 10px 2px; font-size: 14px; }
  .check-row input { width: auto; margin: 0; }
  button.main {
    width: 100%; padding: 15px; background: #8E00FF; color: white; border: none;
    border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 14px;
  }
  .msg { text-align: center; margin-top: 12px; font-size: 14px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .listing-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .toggle-btn { flex: 1; text-align: center; padding: 12px; border: 2px solid #eee; border-radius: 10px; cursor: pointer; font-weight: bold; color: #999; font-size: 14px; }
  .toggle-btn.active { border-color: #8E00FF; background: #f5e6ff; color: #8E00FF; }
  .hidden { display: none; }
  .hint { font-size: 12px; color: #999; margin: -4px 0 12px; }
</style>
</head>
<body>

<a href="index.html" class="back">&larr; Назад на головну</a>
<div class="logo">Продати авто</div>

<div class="status-panel" id="statusPanel">Завантаження статусу...</div>

<div class="listing-toggle">
  <div class="toggle-btn active" id="toggleSale" onclick="setListingType('sale')">Продати авто</div>
  <div class="toggle-btn" id="toggleAuction" onclick="setListingType('auction')">Аукціон</div>
</div>

<div id="auctionFields" class="hidden">
  <h2>Умови аукціону</h2>
  <input type="number" id="startPrice" placeholder="Стартова ціна">
  <div class="check-row">
    <input type="checkbox" id="hasReserve" onchange="document.getElementById('reservePrice').classList.toggle('hidden', !this.checked)">
    <label for="hasReserve">Встановити резервну ціну (мінімум, за який готові продати)</label>
  </div>
  <input type="number" id="reservePrice" placeholder="Резервна ціна" class="hidden">
  <input type="number" id="buyoutPrice" placeholder="Блиц-ціна (Купити зараз) — необов'язково">
  <select id="auctionDuration">
    <option value="3">Тривалість: 3 дні</option>
    <option value="5">Тривалість: 5 днів</option>
    <option value="7">Тривалість: 7 днів</option>
  </select>
  <input type="datetime-local" id="auctionStartsAt">
  <div class="hint">Не заповните дату початку — торги стартують одразу після публікації.</div>
</div>

<h2>Тип</h2>
<select id="condition">
  <option value="">Стан — оберіть</option>
  <option value="new">Нове</option>
  <option value="used">Б/у</option>
  <option value="imported">Пригон</option>
</select>
<select id="transportType" onchange="onTransportTypeChange()">
  <option value="">Тип транспорту — оберіть</option>
  <option value="car">🚗 Легкові</option>
  <option value="moto">🏍️ Мото</option>
  <option value="truck">🚛 Вантажівки</option>
  <option value="trailer">🚚 Причепи</option>
  <option value="special">🏗️ Спецтехніка</option>
  <option value="agro">🚜 Сільгосптехніка</option>
  <option value="bus">🚌 Автобуси</option>
  <option value="water">🚤 Водний транспорт</option>
  <option value="air">🚁 Повітряний транспорт</option>
  <option value="motorhome">🚐 Автобудинки</option>
</select>
<select id="bodyType" disabled>
  <option value="">Спочатку оберіть тип транспорту</option>
</select>

<h2>Основне</h2>
<select id="brand" onchange="onBrandChange()"></select>
<select id="model" disabled></select>
<div class="row">
  <input type="number" id="year" placeholder="Рік випуску">
  <input type="number" id="mileage" placeholder="Пробіг, км">
</div>
<select id="region"></select>
<input type="text" id="color" placeholder="Колір (напр. чорний)">

<h2>Ціна та оплата</h2>
<div class="row">
  <div id="priceFieldWrap" style="flex:1;">
    <input type="number" id="price" placeholder="Ціна">
  </div>
  <select id="currency" style="flex:1;">
    <option value="USD">$</option>
    <option value="EUR">€</option>
    <option value="UAH">грн</option>
  </select>
</div>
<select id="paymentType">
  <option value="">Тип оплати — оберіть</option>
  <option value="cash">Готівка</option>
  <option value="credit">Кредит</option>
  <option value="leasing">Лізинг</option>
  <option value="installment">Розстрочка</option>
  <option value="transfer">Переказ на рахунок</option>
  <option value="tradein">Трейд-ін</option>
</select>

<h2>Характеристики</h2>
<select id="fuelType">
  <option value="">Тип палива — оберіть</option>
  <option value="petrol">Бензин</option>
  <option value="diesel">Дизель</option>
  <option value="hybrid">Гібрид</option>
  <option value="gas">Газ</option>
  <option value="electric">Електро</option>
</select>
<select id="transmission">
  <option value="">Коробка передач — оберіть</option>
  <option value="manual">Механіка</option>
  <option value="automatic">Автомат</option>
  <option value="variator">Варіатор</option>
</select>
<select id="driveType">
  <option value="">Тип приводу — оберіть</option>
  <option value="front">Передній</option>
  <option value="rear">Задній</option>
  <option value="all">Повний</option>
</select>
<div class="row">
  <input type="number" step="0.1" id="engineVolume" placeholder="Об'єм двигуна, л">
  <input type="number" id="powerHp" placeholder="Потужність, к.с.">
</div>
<div class="row">
  <select id="doors">
    <option value="">Кількість дверей</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
  </select>
  <select id="ownersCount">
    <option value="">Кількість власників</option>
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4+</option>
  </select>
</div>

<div class="check-row">
  <input type="checkbox" id="exchangePossible">
  <label for="exchangePossible">Можливий обмін</label>
</div>
<div class="check-row">
  <input type="checkbox" id="customsCleared">
  <label for="customsCleared">Розмитнене</label>
</div>
<div class="check-row">
  <input type="checkbox" id="isUrgent">
  <label for="isUrgent">Терміновий продаж</label>
</div>

<h2>Фото та опис</h2>
<input type="text" id="photoUrl" placeholder="Посилання на фото (додамо завантаження пізніше)">
<textarea id="description" placeholder="Опис авто"></textarea>

<button class="main" onclick="submitCar()">Опублікувати оголошення</button>
<div class="msg" id="msg"></div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  let listingType = 'sale';

  function setListingType(type) {
    listingType = type;
    document.getElementById('toggleSale').classList.toggle('active', type === 'sale');
    document.getElementById('toggleAuction').classList.toggle('active', type === 'auction');
    document.getElementById('auctionFields').classList.toggle('hidden', type !== 'auction');
    document.getElementById('priceFieldWrap').classList.toggle('hidden', type === 'auction');
  }

  populateBrandSelect(document.getElementById('brand'));
  populateRegionSelect(document.getElementById('region'), 'Регіон — оберіть');

  function onBrandChange() {
    const brand = document.getElementById('brand').value;
    populateModelSelect(document.getElementById('model'), brand, 'Модель — оберіть');
  }

  function onTransportTypeChange() {
    const transportType = document.getElementById('transportType').value;
    populateBodyTypeSelect(document.getElementById('bodyType'), transportType, 'Тип кузова — оберіть');
  }

  async function loadStatusPanel() {
    const panel = document.getElementById('statusPanel');
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'register2.html'; return; }

    const { count: soldCount } = await sb
      .from('cars').select('*', { count: 'exact', head: true })
      .eq('user_id', session.user.id).eq('sold', true);

    const status = getStatusForCount(soldCount || 0);

    const startOfMonth = new Date();
    startOfMonth.setDate(1);
    startOfMonth.setHours(0, 0, 0, 0);

    const { count: monthCount } = await sb
      .from('cars').select('*', { count: 'exact', head: true })
      .eq('user_id', session.user.id)
      .gte('created_at', startOfMonth.toISOString());

    const used = monthCount || 0;

    if (status.name === 'Автосалон') {
      panel.innerHTML = `Ваш статус: <b>${status.name}</b>. Індивідуальні пакети — зверніться до модератора.`;
    } else {
      const left = Math.max(status.freeQuota - used, 0);
      panel.innerHTML = `Ваш статус: <b>${status.name}</b>. Використано ${used} з ${status.freeQuota} безкоштовних оголошень цього місяця` +
        (left > 0 ? ` (залишилось ${left}).` : `. Наступне оголошення — <b>$${status.extraPrice}</b> (оплата поки не стягується).`);
    }
  }

  async function submitCar() {
    const { data: { session } } = await sb.auth.getSession();
    const msg = document.getElementById('msg');

    if (!session) {
      window.location.href = 'register2.html';
      return;
    }

    const brand = document.getElementById('brand').value;
    const model = document.getElementById('model').value;
    const year = document.getElementById('year').value;
    const price = document.getElementById('price').value;

    if (!brand || !model || !year) {
      msg.textContent = "Заповніть хоча б марку, модель і рік";
      msg.style.color = 'red';
      return;
    }
    if (listingType === 'sale' && !price) {
      msg.textContent = "Вкажіть ціну";
      msg.style.color = 'red';
      return;
    }

    const insertData = {
      user_id: session.user.id,
      brand: brand,
      model: model,
      year: parseInt(year),
      price: listingType === 'sale' ? parseFloat(price) : null,
      currency: document.getElementById('currency').value,
      mileage: parseInt(document.getElementById('mileage').value) || null,
      fuel_type: document.getElementById('fuelType').value,
      transmission: document.getElementById('transmission').value,
      region: document.getElementById('region').value,
      description: document.getElementById('description').value,
      photo_url: document.getElementById('photoUrl').value,
      body_type: document.getElementById('bodyType').value,
      transport_type: document.getElementById('transportType').value,
      drive_type: document.getElementById('driveType').value,
      engine_volume: parseFloat(document.getElementById('engineVolume').value) || null,
      payment_type: document.getElementById('paymentType').value,
      condition: document.getElementById('condition').value,
      color: document.getElementById('color').value,
      power_hp: parseInt(document.getElementById('powerHp').value) || null,
      doors: parseInt(document.getElementById('doors').value) || null,
      owners_count: parseInt(document.getElementById('ownersCount').value) || null,
      exchange_possible: document.getElementById('exchangePossible').checked,
      customs_cleared: document.getElementById('customsCleared').checked,
      is_urgent: document.getElementById('isUrgent').checked,
      listing_type: listingType
    };

    if (listingType === 'auction') {
      const startPrice = document.getElementById('startPrice').value;
      if (!startPrice) {
        msg.textContent = "Вкажіть стартову ціну аукціону";
        msg.style.color = 'red';
        return;
      }
      const duration = parseInt(document.getElementById('auctionDuration').value);
      const startsAtInput = document.getElementById('auctionStartsAt').value;
      const startsAt = startsAtInput ? new Date(startsAtInput) : new Date();
      const endsAt = new Date(startsAt.getTime() + duration * 24 * 60 * 60 * 1000);

      insertData.price = parseFloat(startPrice);
      insertData.start_price = parseFloat(startPrice);
      insertData.reserve_price = document.getElementById('hasReserve').checked
        ? parseFloat(document.getElementById('reservePrice').value) || null
        : null;
      insertData.buyout_price = parseFloat(document.getElementById('buyoutPrice').value) || null;
      insertData.auction_duration_days = duration;
      insertData.auction_starts_at = startsAt.toISOString();
      insertData.auction_ends_at = endsAt.toISOString();
    }

    const { error } = await sb.from('cars').insert(insertData);

    if (error) {
      msg.textContent = error.message;
      msg.style.color = 'red';
      return;
    }

    msg.textContent = "Готово! Оголошення опубліковано.";
    msg.style.color = 'green';
    setTimeout(() => { window.location.href = 'index.html'; }, 1200);
  }

  loadStatusPanel();
</script>

</body>
</html>
