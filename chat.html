<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8E00FF">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>NORMALNO — Чат</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font-family: Arial, sans-serif; background: #fff; display: flex; flex-direction: column; }

  .chat-header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #eee; flex-shrink: 0; }
  .chat-header a { color: #FF7A00; text-decoration: none; font-size: 18px; }
  .chat-header-info { flex: 1; min-width: 0; cursor: pointer; }
  .chat-header-name { font-weight: bold; font-size: 15px; }
  .chat-header-car { font-size: 12px; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-header-photo { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }

  .messages-wrap { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg-row { display: flex; }
  .msg-row.mine { justify-content: flex-end; }
  .msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: break-word; }
  .msg-row:not(.mine) .msg-bubble { background: #f5e6ff; color: #333; border-bottom-left-radius: 4px; }
  .msg-row.mine .msg-bubble { background: #8E00FF; color: #fff; border-bottom-right-radius: 4px; }
  .msg-time { font-size: 10px; color: #bbb; margin-top: 3px; text-align: right; }
  .msg-row.mine .msg-time { color: rgba(255,255,255,0.7); }

  .empty { text-align: center; color: #999; margin-top: 40px; }

  .input-row { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #eee; flex-shrink: 0; }
  .input-row input { flex: 1; padding: 12px 14px; border: 1px solid #ddd; border-radius: 20px; font-size: 14px; }
  .input-row button { background: #8E00FF; color: #fff; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 16px; cursor: pointer; flex-shrink: 0; }
</style>
</head>
<body>

<div class="chat-header">
  <a href="chats-list.html">&larr;</a>
  <img class="chat-header-photo hidden" id="headerPhoto">
  <div class="chat-header-info" id="chatHeaderInfo" onclick="goToCar()">
    <div class="chat-header-name" id="headerName">Завантаження...</div>
    <div class="chat-header-car" id="headerCar"></div>
  </div>
</div>

<div class="messages-wrap" id="messagesWrap"><div class="empty">Завантаження...</div></div>

<div class="input-row">
  <input type="text" id="msgInput" placeholder="Напишіть повідомлення..." onkeydown="if(event.key==='Enter') sendMessage()">
  <button onclick="sendMessage()">➤</button>
</div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  const params = new URLSearchParams(window.location.search);
  const chatId = params.get('id');
  let currentUserId = null;
  let chatData = null;
  let otherUserId = null;

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'register2.html'; return; }
    currentUserId = session.user.id;

    const { data: chat, error } = await sb.from('chats').select('*').eq('id', chatId).single();
    if (error || !chat || (chat.buyer_id !== currentUserId && chat.seller_id !== currentUserId)) {
      document.getElementById('messagesWrap').innerHTML = '<div class="empty">Чат не знайдено</div>';
      return;
    }
    chatData = chat;
    otherUserId = chat.buyer_id === currentUserId ? chat.seller_id : chat.buyer_id;

    const { data: otherProfile } = await sb.from('profiles').select('name').eq('user_id', otherUserId).maybeSingle();
    document.getElementById('headerName').textContent = (otherProfile && otherProfile.name) ? otherProfile.name : 'Користувач';

    const { data: car } = await sb.from('cars').select('brand, model, year, photos, photo_url').eq('id', chat.car_id).maybeSingle();
    if (car) {
      document.getElementById('headerCar').textContent = `${car.brand} ${car.model}, ${car.year}`;
      const photo = carPhotos(car, 1)[0];
      if (photo) {
        const img = document.getElementById('headerPhoto');
        img.src = photo;
        img.classList.remove('hidden');
      }
    }

    await loadMessages();
    markAsRead();

    sb.channel('chat-' + chatId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${chatId}` }, () => {
        loadMessages();
        markAsRead();
      })
      .subscribe();
  }

  window.goToCar = function() {
    if (chatData) window.location.href = 'car.html?id=' + chatData.car_id;
  };

  async function loadMessages() {
    const { data: messages } = await sb.from('messages').select('*').eq('chat_id', chatId).order('created_at', { ascending: true });
    const wrap = document.getElementById('messagesWrap');

    if (!messages || messages.length === 0) {
      wrap.innerHTML = '<div class="empty">Напишіть перше повідомлення</div>';
      return;
    }

    wrap.innerHTML = messages.map(m => {
      const mine = m.sender_id === currentUserId;
      const time = new Date(m.created_at).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
      return `
        <div class="msg-row ${mine ? 'mine' : ''}">
          <div>
            <div class="msg-bubble">${escapeHtml(m.text)}</div>
            <div class="msg-time">${time}</div>
          </div>
        </div>
      `;
    }).join('');
    wrap.scrollTop = wrap.scrollHeight;
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  async function markAsRead() {
    await sb.from('messages').update({ read: true }).eq('chat_id', chatId).eq('read', false).neq('sender_id', currentUserId);
  }

  window.sendMessage = async function() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    const { error } = await sb.from('messages').insert({ chat_id: chatId, sender_id: currentUserId, text });
    if (error) { alert('Помилка надсилання: ' + error.message); return; }

    fetch('/api/notify-new-message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recipientId: otherUserId, text, chatId })
    }).catch(() => {});
  };

  init();
</script>

</body>
</html>
