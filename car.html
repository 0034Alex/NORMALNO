<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  .fullscreen-photo-overlay {
    position: fixed; inset: 0; background: #000; z-index: 500;
    display: flex; align-items: center; justify-content: center; padding: 0; overflow: hidden;
  }
  .fullscreen-photo-overlay.hidden { display: none; }
  .fullscreen-photo-bg {
    position: absolute; inset: -20px; background-size: cover; background-position: center;
    filter: blur(25px) brightness(0.55); transform: scale(1.15);
  }
  .fullscreen-photo-overlay img { position: relative; max-width: 100%; max-height: 100%; object-fit: contain; }
  .fullscreen-photo-close {
    position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.15); color: #fff; border: none; font-size: 20px; cursor: pointer; z-index: 501;
  }
  .fullscreen-nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #fff; cursor: pointer; z-index: 501; border: none;
  }
  .fullscreen-nav-arrow.left { left: 12px; }
  .fullscreen-nav-arrow.right { right: 12px; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; max-width: 520px; margin-left: auto; margin-right: auto; padding-bottom: 40px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }

  .gallery {
    position: relative; width: 100%; border-radius: 22px; margin-bottom: 12px; margin-top: 8px;
    background: linear-gradient(160deg, #1a1030, #0f0a20); overflow: hidden;
    padding: 54px 10px 10px 10px; box-sizing: border-box;
  }
  .gallery-stack-item {
    position: absolute; top: 54px; bottom: 10px; width: 66%; height: auto; object-fit: contain;
    border-radius: 16px; transition: all 0.3s ease; left: 17%; background: #120c22;
    box-shadow: 0 0 0 2px rgba(142,0,255,0.55), 0 0 26px rgba(142,0,255,0.35), 0 10px 22px rgba(0,0,0,0.45);
  }
  .gallery-stack-item.pos-prev { transform: translateX(-70%) scale(0.8) rotate(-7deg); z-index: 1; opacity: 0.8; }
  .gallery-stack-item.pos-current { transform: translateX(0) scale(1) rotate(0deg); z-index: 3; opacity: 1; cursor: zoom-in; box-shadow: 0 0 0 2px rgba(255,122,0,0.65), 0 0 30px rgba(255,122,0,0.4), 0 10px 24px rgba(0,0,0,0.5); }
  .gallery-stack-item.pos-next { transform: translateX(70%) scale(0.8) rotate(7deg); z-index: 1; opacity: 0.8; }
  .gallery-stack-item.pos-hidden { transform: translateX(0) scale(0.7); z-index: 0; opacity: 0; }
  .gallery-nav-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%;
    background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #8E00FF; cursor: pointer; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.2); border: none;
  }
  .gallery-nav-arrow.left { left: 8px; }
  .gallery-nav-arrow.right { right: 8px; }
  .gallery-noimg { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 50px; color: #ccc; }
  .gallery-logo {
    position: absolute; top: 14px; left: 14px; width: 44px; height: auto; z-index: 20;
    opacity: 0.95; pointer-events: none;
  }
  .gallery-top-actions { position: absolute; top: 14px; right: 14px; z-index: 20; display: flex; gap: 8px; }
  .gallery-heart, .gallery-share {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #fff; cursor: pointer; border: none; padding: 0;
  }
  .gallery-share svg { width: 22px; height: 22px; border-radius: 50%; }
  .gallery-dots { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
  .gallery-dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.6); box-shadow: 0 0 3px rgba(0,0,0,0.4); }
  .gallery-count { text-align: center; font-size: 12px; color: #999; margin-bottom: 16px; }

  h1 { font-size: 20px; margin: 0 0 4px; }
  .subline { color: #999; font-size: 13px; margin-bottom: 10px; }
  .price { color: #8E00FF; font-weight: bold; font-size: 24px; margin-bottom: 14px; }

  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .badge { background: #f5e6ff; color: #8E00FF; font-size: 12px; font-weight: bold; padding: 5px 12px; border-radius: 20px; }

  .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .spec-item { border: 1px solid #eee; border-radius: 10px; padding: 10px 12px; }
  .spec-label { font-size: 11px; color: #999; margin-bottom: 2px; }
  .spec-value { font-size: 14px; font-weight: bold; }

  .desc-title { font-size: 15px; font-weight: bold; margin-bottom: 8px; }
  .desc-text { font-size: 14px; color: #444; line-height: 1.5; white-space: pre-wrap; margin-bottom: 20px; }

  .seller-box { border: 1px solid #eee; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  .views-fav-stats { font-size: 12px; color: #999; margin-bottom: 12px; }
  .car-id-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #999; margin-bottom: 16px; }
  .icon-btn { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; padding: 0; border: none; border-radius: 7px; cursor: pointer; flex-shrink: 0; }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn-copy { background: #f5e6ff; color: #8E00FF; }
  .icon-btn-share { background: transparent; margin-left: auto; }
  .icon-btn-share svg { width: 26px; height: 26px; }
  .section-title { font-size: 16px; font-weight: bold; }
  .similar-cars-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
  .similar-cars-row .ncard { flex: 0 0 65vw; max-width: 220px; margin-bottom: 0; }
  .seller-name { font-weight: bold; font-size: 16px; margin: 4px 0 10px; }
  .seller-actions { display: flex; gap: 8px; }
  .seller-btn { flex: 1; text-align: center; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 13px; text-decoration: none; border: none; cursor: pointer; }
  .seller-btn-call { background: #f5e6ff; color: #8E00FF; }
  .seller-btn-chat { background: #8E00FF; color: #fff; }
  .seller-label { font-size: 12px; color: #999; margin-bottom: 4px; }
  .seller-phone { color: #8E00FF; font-weight: bold; font-size: 16px; }

  .sold-btn { width: 100%; padding: 14px; background: #fff; border: 1px solid #8E00FF; color: #8E00FF; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; margin-bottom: 16px; }
  .empty { text-align: center; color: #999; margin-top: 40px; }
  .hidden { display: none; }

  .leasing-btn { width: 100%; padding: 14px; background: #FF7A00; color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; margin-bottom: 16px; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
    display: flex; align-items: flex-end; justify-content: center; z-index: 100;
  }
  .modal-overlay.hidden { display: none; }
  .modal-sheet {
    background: #fff; width: 100%; max-width: 520px; border-radius: 20px 20px 0 0;
    padding: 20px; max-height: 70vh; overflow-y: auto;
  }
  .modal-title { font-size: 17px; font-weight: bold; margin-bottom: 4px; }
  .modal-sub { font-size: 12px; color: #999; margin-bottom: 18px; }
  .modal-close { float: right; font-size: 20px; color: #999; cursor: pointer; background: none; border: none; padding: 4px 8px; }
  .slider-row { margin-bottom: 20px; }
  .slider-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
  .slider-label b { color: #8E00FF; }
  input[type="range"] { width: 100%; accent-color: #8E00FF; }
  .calc-results { background: #f5e6ff; border-radius: 12px; padding: 14px; }
  .calc-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .calc-row.main { font-size: 18px; font-weight: bold; color: #8E00FF; border-top: 1px solid #e5cfff; margin-top: 6px; padding-top: 10px; }
  .calc-note { font-size: 11px; color: #999; margin-top: 10px; }
</style>
</head>
<body>

<a href="index.html" class="back">&larr; Назад</a>

<div id="content">Завантаження...</div>

<div class="fullscreen-photo-overlay hidden" id="fullscreenPhotoOverlay" onclick="closeFullscreenPhoto()">
  <button class="fullscreen-photo-close" onclick="event.stopPropagation(); closeFullscreenPhoto()">✕</button>
  <button class="fullscreen-nav-arrow left" onclick="event.stopPropagation(); fsSwipe('right')">‹</button>
  <button class="fullscreen-nav-arrow right" onclick="event.stopPropagation(); fsSwipe('left')">›</button>
  <div class="fullscreen-photo-bg" id="fullscreenPhotoBg"></div>
  <img id="fullscreenPhotoImg" src="" onclick="event.stopPropagation()">
</div>

<script>
  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  const params = new URLSearchParams(window.location.search);
  const carId = (params.get('id') || '').trim();
  const TELEGRAM_LOGO_SVG = '<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="120" r="120" fill="#26A5E4"/><path fill="#fff" d="M167.5 72.7c2.1-1.1 4.6.6 4.2 2.9l-19.6 108.1c-1 5.5-8.3 6.9-11.3 2.2l-31-40.3-19.5 18.8c-2.2 2.1-5.9.8-6.3-2.2l-4.1-30.1-33.8-11c-4.4-1.4-4.5-7.6-.1-9.2l121.5-39.2z"/></svg>';
  let currentUserId = null;
  let isFav = false;
  let currentCarData = null;

  const TRANSMISSION_LABELS2 = { manual: 'Механіка', automatic: 'Автомат', variator: 'Варіатор' };
  const FUEL_LABELS2 = { petrol: 'Бензин', diesel: 'Дизель', hybrid: 'Гібрид', gas: 'Газ', electric: 'Електро' };
  const PAYMENT_LABELS = { cash: 'Готівка', credit: 'Кредит', leasing: 'Лізинг', installment: 'Розстрочка', transfer: 'Переказ на рахунок', tradein: 'Трейд-ін' };
  const DRIVE_LABELS = { front: 'Передній', rear: 'Задній', all: 'Повний' };

  let currentCarPriceUAH = 0;
  let currentCarLabel = '';
  let userPhone = '';
  let userName = '';

  async function load() {
    await ensureRatesLoaded();
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      currentUserId = session.user.id;
      const { data: profile } = await sb.from('profiles').select('phone').eq('user_id', currentUserId).maybeSingle();
      if (profile && profile.phone) userPhone = profile.phone;
      const { data: fav } = await sb.from('favorites').select('id').eq('user_id', currentUserId).eq('car_id', carId).maybeSingle();
      isFav = !!fav;
    }

    if (!carId) {
      console.error('car.html: no id param in URL', window.location.href);
      document.getElementById('content').innerHTML = '<div class="empty">Оголошення не знайдено (немає ID у посиланні)</div>';
      return;
    }

    const { data: car, error } = await sb.from('cars').select('*').eq('id', carId).maybeSingle();
    if (error) {
      console.error('car.html: Supabase error loading car', carId, error);
      document.getElementById('content').innerHTML = '<div class="empty">Не вдалося завантажити оголошення. Спробуйте оновити сторінку.</div>';
      return;
    }
    if (!car) {
      console.error('car.html: no car found for id', carId);
      document.getElementById('content').innerHTML = '<div class="empty">Оголошення не знайдено</div>';
      return;
    }
    currentCarData = car;
    render(car);
    loadSellerInfo(car.user_id);
    initCompareWidget();
    loadSimilarCars(car);
    initGallerySwipe();

    // Прямий перехід у калькулятор лізингу з посилання (наприклад, з поста в Telegram-каналі)
    if (new URLSearchParams(window.location.search).get('openLeasing') === '1') {
      openLeasingModal();
    }

    const el = document.getElementById('viewsFavStats');
    if (el) el.textContent = '⏳ рахуємо перегляди...';

    try {
      const isOwner = session && car.user_id === currentUserId;
      let displayViews = car.views || 0;
      if (!isOwner) {
        displayViews += 1;
        try {
          await sb.rpc('increment_car_views', { car_id_input: carId });
        } catch (rpcErr) {
          // не критично для показу лічильника — просто не інкрементуємо мовчки
        }
        if (currentUserId) logCarView(sb, currentUserId, carId);
      }
      await loadViewsAndFavorites(displayViews);
    } catch (e) {
      if (el) el.textContent = '⚠️ Помилка: ' + (e && e.message ? e.message : String(e));
    }
  }

  async function loadViewsAndFavorites(displayViews) {
    const el = document.getElementById('viewsFavStats');
    try {
      const { count: favCount, error } = await sb.from('favorites').select('*', { count: 'exact', head: true }).eq('car_id', carId);
      if (error) {
        if (el) el.textContent = '⚠️ Помилка обраного: ' + error.message;
        return;
      }
      if (el) el.textContent = `👁 ${displayViews} переглядів · ❤️ ${favCount || 0} в обраному`;
    } catch (e) {
      if (el) el.textContent = '⚠️ Виняток: ' + (e && e.message ? e.message : String(e));
    }
  }

  async function loadSellerInfo(sellerId) {
    const { data: seller } = await sb.from('profiles').select('name, phone').eq('user_id', sellerId).maybeSingle();
    const nameEl = document.getElementById('sellerName');
    const callBtn = document.getElementById('sellerCallBtn');
    if (!nameEl) return;

    nameEl.textContent = (seller && seller.name) ? seller.name : 'Приватний продавець';
    if (seller && seller.phone) {
      callBtn.href = 'tel:' + seller.phone;
      callBtn.classList.remove('hidden');
    }

    if (currentUserId && currentUserId !== sellerId) {
      sb.from('contact_views_log').insert({ car_id: carId, user_id: currentUserId }).then(() => {});
    }
  }

  window.openChatWithSeller = async function() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'register2.html'; return; }

    const { data: car } = await sb.from('cars').select('user_id').eq('id', carId).single();
    if (!car) return;

    if (car.user_id === session.user.id) {
      alert('Це ваше власне оголошення');
      return;
    }

    let { data: existingChat } = await sb.from('chats').select('id').eq('car_id', carId).eq('buyer_id', session.user.id).maybeSingle();

    if (!existingChat) {
      const { data: newChat, error } = await sb.from('chats').insert({
        car_id: carId, buyer_id: session.user.id, seller_id: car.user_id
      }).select().single();
      if (error) { alert('Помилка: ' + error.message); return; }
      existingChat = newChat;
    }

    window.location.href = `chat.html?id=${existingChat.id}`;
  };

  function render(car) {
    const photos = carPhotos(car);
    const stackHtml = photos.length
      ? photos.map((p, i) => `<img class="gallery-stack-item" data-idx="${i}" src="${p}" onerror="this.style.display='none'" onload="handlePhotoOrientation(${i}, this)">`).join('')
      : `<div class="gallery-noimg">🚗</div>`;

    const badges = [];
    if (CONDITION_LABELS[car.condition]) badges.push(CONDITION_LABELS[car.condition]);
    if (car.is_official) badges.push('✅ Офіційне авто');
    if (car.exchange_possible) badges.push('Можливий обмін');
    if (car.customs_cleared) badges.push('Розмитнено');
    if (car.is_urgent) badges.push('🏷️ Терміново');
    if (car.is_hot) badges.push('🔥 Гаряча пропозиція');
    if (car.sold) badges.push('Продано');

    const specs = [
      ['Пробіг', car.mileage ? Number(car.mileage).toLocaleString('uk-UA') + ' км' : '—'],
      ['Коробка', TRANSMISSION_LABELS2[car.transmission] || '—'],
      ['Паливо', FUEL_LABELS2[car.fuel_type] || '—'],
      ["Об'єм двигуна", car.engine_volume ? car.engine_volume + ' л' : '—'],
      ['Потужність', car.power_hp ? car.power_hp + ' к.с.' : '—'],
      ['Привід', DRIVE_LABELS[car.drive_type] || '—'],
      ['Кузов', car.body_type || '—'],
      ['Колір', car.color || '—'],
      ['Дверей', car.doors || '—'],
      ['Регіон', car.region || '—'],
      ['VIN-код', car.vin_code || '—']
    ];

    const isOwn = currentUserId && car.user_id === currentUserId;

    document.getElementById('content').innerHTML = `
      <div class="gallery" id="galleryStack">
        ${stackHtml}
        <img class="gallery-logo" src="/logo-watermark.png" alt="">
        <div class="gallery-top-actions">
          <button class="gallery-share" onclick="event.stopPropagation(); shareToTelegram(${car.id})" title="Поділитися в Telegram" aria-label="Поділитися в Telegram">${TELEGRAM_LOGO_SVG}</button>
          <button class="gallery-heart" onclick="event.stopPropagation(); toggleFav()">${isFav ? '❤️' : '♡'}</button>
        </div>
        ${photos.length > 1 ? `
          <button class="gallery-nav-arrow left" onclick="event.stopPropagation(); swipeGallery('right')">‹</button>
          <button class="gallery-nav-arrow right" onclick="event.stopPropagation(); swipeGallery('left')">›</button>
        ` : ''}
      </div>
      ${photos.length > 1 ? `<div class="gallery-count">📷 ${photos.length} фото — гортайте вбік або натисніть стрілку</div>` : ''}
      <div class="views-fav-stats" id="viewsFavStats"></div>

      <h1>${car.brand} ${car.model}, ${car.year}</h1>
      <div class="subline">Опубліковано ${timeAgo(car.created_at)}</div>
      <div class="price">${car.previous_price && car.previous_price != car.price ? `<span style="color:#999;font-weight:normal;font-size:16px;text-decoration:line-through;">${Number(car.previous_price).toLocaleString('uk-UA')} ${car.currency || ''}</span> ` : ''}${Number(car.price || 0).toLocaleString('uk-UA')} ${car.currency || ''}${(() => { const uah = convertToUAH(car.price, car.currency); return uah ? ` <span style="color:#999;font-weight:normal;font-size:15px;">(≈ ${uah.toLocaleString('uk-UA')} грн)</span>` : ''; })()}</div>

      ${badges.length ? `<div class="badges">${badges.map(b => `<span class="badge">${b}</span>`).join('')}</div>` : ''}

      <button class="ncard-compare-btn ${isInCompareList(car.id) ? 'active' : ''}" data-compare-id="${car.id}" style="width:100%; margin-bottom:16px; padding:12px; font-size:13px;" onclick="toggleCompare(${car.id})">⚖️ ${isInCompareList(car.id) ? 'У порівнянні' : 'Додати до порівняння'}</button>

      <div class="specs-grid">
        ${specs.map(([label, value]) => `
          <div class="spec-item">
            <div class="spec-label">${label}</div>
            <div class="spec-value">${value}</div>
          </div>
        `).join('')}
      </div>

      ${car.description ? `<div class="desc-title">Опис від продавця</div><div class="desc-text">${car.description}</div>` : ''}

      <div class="car-id-row">
        ID оголошення: <b>${car.id}</b>
        <button class="icon-btn icon-btn-copy" onclick="copyCarId(${car.id})" title="Копіювати ID" aria-label="Копіювати ID">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
      </div>

      <button class="leasing-btn" onclick="openLeasingModal()">📊 Розрахувати в лізинг</button>

      <div class="seller-box">
        <div class="seller-label">Продавець</div>
        <div class="seller-name" id="sellerName">Завантаження...</div>
        <div class="seller-actions">
          <a class="seller-btn seller-btn-call hidden" id="sellerCallBtn" href="#">📞 Подзвонити</a>
          <button class="seller-btn seller-btn-chat" onclick="openChatWithSeller()">💬 Написати</button>
        </div>
      </div>

      <div id="similarCarsSection"></div>

      <div class="modal-overlay hidden" id="leasingModal" onclick="if(event.target===this) closeLeasingModal()">
        <div class="modal-sheet">
          <button type="button" class="modal-close" onclick="closeLeasingModal(); return false;">✕</button>
          <div class="modal-title">Розрахунок лізингу</div>
          <div class="modal-sub" id="leasingCarLabel"></div>

          <div class="slider-row">
            <div class="slider-label"><span>Термін лізингу</span><b id="monthsValue">24 міс.</b></div>
            <input type="range" id="monthsSlider" min="12" max="36" step="1" value="24" oninput="updateLeasingCalc()">
          </div>

          <div class="calc-results">
            <div class="calc-row"><span>Вартість авто</span><span id="calcPrice">—</span></div>
            <div class="calc-row"><span>Аванс (25%)</span><span id="calcDown">—</span></div>
            <div class="calc-row"><span>Річна ставка</span><span>36%</span></div>
            <div class="calc-row main"><span>Щомісячний платіж</span><span id="calcMonthly">—</span></div>
            <div class="calc-row"><span>Разом за весь термін</span><span id="calcTotal">—</span></div>
          </div>
          <div class="calc-note">Попередній розрахунок. Точні умови уточнюйте у менеджера. Розрахунок у гривнях за курсом НБУ.</div>

          <input type="tel" id="leasingPhone" placeholder="Ваш номер телефону" style="width:100%; padding:12px; margin-top:14px; border:1px solid #ddd; border-radius:10px; font-size:14px;">
          <button class="leasing-btn" style="margin-top:8px; margin-bottom:0;" onclick="submitLeasingLead()">📞 Зв'язатися з менеджером</button>
          <div id="leasingLeadMsg" style="text-align:center; font-size:13px; margin-top:8px;"></div>
        </div>
      </div>

    `;

    currentCarPriceUAH = car.currency === 'UAH' ? car.price : (convertToUAH(car.price, car.currency) || car.price);
    currentCarLabel = `${car.brand} ${car.model}, ${car.year}`;
    document.getElementById('leasingCarLabel').textContent = currentCarLabel;
  }

  window.openLeasingModal = function() {
    document.getElementById('leasingModal').classList.remove('hidden');
    document.getElementById('leasingPhone').value = userPhone;
    document.getElementById('leasingLeadMsg').textContent = '';
    updateLeasingCalc();
  };

  window.submitLeasingLead = async function() {
    const msg = document.getElementById('leasingLeadMsg');
    const phone = document.getElementById('leasingPhone').value.trim();

    if (!phone) {
      msg.textContent = 'Вкажіть номер телефону';
      msg.style.color = 'red';
      return;
    }

    const months = parseInt(document.getElementById('monthsSlider').value);
    const result = calcLeasing(currentCarPriceUAH, months);
    const details = `Авто: ${currentCarLabel}. Термін: ${months} міс. Аванс: ${result.downPayment.toLocaleString('uk-UA')} грн. Щомісячний платіж: ${result.monthlyPayment.toLocaleString('uk-UA')} грн. Разом: ${result.totalPayment.toLocaleString('uk-UA')} грн.`;

    const { error } = await sb.from('leads').insert({
      type: 'leasing',
      user_id: currentUserId,
      name: userName,
      phone: phone,
      budget: result.monthlyPayment,
      car_id: carId,
      details: details
    });

    if (error) {
      msg.textContent = error.message;
      msg.style.color = 'red';
      return;
    }

    fetch('/api/notify-lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ leadType: 'leasing', name: userName, phone, summary: details })
    }).catch(() => {});

    msg.textContent = "Дякуємо! Менеджер зв'яжеться з вами найближчим часом.";
    msg.style.color = 'green';
  };

  window.closeLeasingModal = function() {
    document.getElementById('leasingModal').classList.add('hidden');
  };

  window.updateLeasingCalc = function() {
    const months = parseInt(document.getElementById('monthsSlider').value);
    document.getElementById('monthsValue').textContent = months + ' міс.';

    const result = calcLeasing(currentCarPriceUAH, months);

    document.getElementById('calcPrice').textContent = currentCarPriceUAH.toLocaleString('uk-UA') + ' грн';
    document.getElementById('calcDown').textContent = result.downPayment.toLocaleString('uk-UA') + ' грн';
    document.getElementById('calcMonthly').textContent = result.monthlyPayment.toLocaleString('uk-UA') + ' грн';
    document.getElementById('calcTotal').textContent = result.totalPayment.toLocaleString('uk-UA') + ' грн';
  };

  async function loadSimilarCars(car) {
    const { data: similar } = await sb.from('cars').select('*')
      .eq('brand', car.brand).neq('id', car.id).eq('archived', false).neq('listing_type', 'auction')
      .limit(3);

    const section = document.getElementById('similarCarsSection');
    if (!similar || similar.length === 0) { section.innerHTML = ''; return; }

    section.innerHTML = `
      <div class="section-title" style="margin:20px 0 10px;">Схожі авто</div>
      <div class="similar-cars-row">${similar.map(c => renderCarCard(c, currentUserId, new Set())).join('')}</div>
    `;
  }

  let galleryIndex = 0;
  let photoRatios = {};

  window.handlePhotoOrientation = function(idx, imgEl) {
    if (imgEl.naturalWidth && imgEl.naturalHeight) {
      photoRatios[idx] = imgEl.naturalWidth / imgEl.naturalHeight;
    }
    if (idx === galleryIndex) applyGalleryOrientation();
  };

  // Висота підганяється точно під пропорції поточного фото: зверху лишається
  // фіксована смуга під лого/сердечко/поділитися, знизу і по боках — мінімальні
  // відступи, щоб фіолетового фону майже не було видно за фото.
  function applyGalleryOrientation() {
    const gallery = document.getElementById('galleryStack');
    if (!gallery) return;
    const HEADER = 54, BOTTOM = 10, ITEM_WIDTH_PCT = 0.66;
    const ratio = Math.max(0.55, Math.min(1.9, photoRatios[galleryIndex] || 4 / 3));
    const itemWidth = gallery.clientWidth * ITEM_WIDTH_PCT;
    const itemHeight = itemWidth / ratio;
    gallery.style.height = Math.round(itemHeight + HEADER + BOTTOM) + 'px';
  }

  function initGallerySwipe() {
    const photos = carPhotos(currentCarData);
    if (photos.length === 0) return;
    galleryIndex = 0;
    renderGalleryPositions();
    applyGalleryOrientation();

    const stack = document.getElementById('galleryStack');
    let startX = 0;
    let dragging = false;

    if (photos.length > 1) {
      stack.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; dragging = true; }, { passive: true });
      stack.addEventListener('touchend', (e) => {
        if (!dragging) return;
        dragging = false;
        const diff = e.changedTouches[0].clientX - startX;
        if (diff < -40) swipeGallery('left');
        else if (diff > 40) swipeGallery('right');
      }, { passive: true });
    }

    stack.addEventListener('click', (e) => {
      const item = e.target.closest('.gallery-stack-item');
      if (!item) return;
      if (item.classList.contains('pos-next')) swipeGallery('left');
      else if (item.classList.contains('pos-prev')) swipeGallery('right');
      else if (item.classList.contains('pos-current')) openFullscreenPhoto();
    });
  }

  function updateFullscreenPhoto() {
    const photos = carPhotos(currentCarData);
    const src = photos[galleryIndex];
    if (!src) return;
    document.getElementById('fullscreenPhotoImg').src = src;
    document.getElementById('fullscreenPhotoBg').style.backgroundImage = `url('${src}')`;
  }

  window.openFullscreenPhoto = function() {
    updateFullscreenPhoto();
    document.getElementById('fullscreenPhotoOverlay').classList.remove('hidden');
  };
  window.closeFullscreenPhoto = function() {
    document.getElementById('fullscreenPhotoOverlay').classList.add('hidden');
  };
  window.fsSwipe = function(direction) {
    swipeGallery(direction);
    updateFullscreenPhoto();
  };

  (function initFullscreenSwipe() {
    const overlay = document.getElementById('fullscreenPhotoOverlay');
    let startX = 0, dragging = false;
    overlay.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; dragging = true; }, { passive: true });
    overlay.addEventListener('touchend', (e) => {
      if (!dragging) return;
      dragging = false;
      const diff = e.changedTouches[0].clientX - startX;
      if (diff < -40) fsSwipe('left');
      else if (diff > 40) fsSwipe('right');
    }, { passive: true });
  })();

  function renderGalleryPositions() {
    const photos = carPhotos(currentCarData);
    const n = photos.length;
    const items = document.querySelectorAll('.gallery-stack-item');

    items.forEach(item => {
      const idx = parseInt(item.dataset.idx);
      item.classList.remove('pos-prev', 'pos-current', 'pos-next', 'pos-hidden');
      if (idx === galleryIndex) item.classList.add('pos-current');
      else if (idx === (galleryIndex - 1 + n) % n) item.classList.add('pos-prev');
      else if (idx === (galleryIndex + 1) % n) item.classList.add('pos-next');
      else item.classList.add('pos-hidden');
    });
  }

  function swipeGallery(direction) {
    const photos = carPhotos(currentCarData);
    const n = photos.length;
    if (direction === 'left') galleryIndex = (galleryIndex + 1) % n;
    else galleryIndex = (galleryIndex - 1 + n) % n;
    renderGalleryPositions();
    applyGalleryOrientation();
  }

  window.copyCarId = function(carId) {
    navigator.clipboard.writeText(String(carId)).then(() => alert('ID скопійовано: ' + carId));
  };

  window.shareToTelegram = function(carId) {
    const url = `https://normalno-a55.vercel.app/car.html?id=${carId}`;
    const c = currentCarData;
    const text = c ? `${c.brand} ${c.model}, ${c.year} — ${Number(c.price || 0).toLocaleString('uk-UA')} ${c.currency || ''}` : 'Погляньте на це авто на NORMALNO!';
    window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`, '_blank');
  };

  window.toggleFav = async function() {
    if (!currentUserId) { window.location.href = 'register2.html'; return; }
    if (isFav) {
      await sb.from('favorites').delete().eq('user_id', currentUserId).eq('car_id', carId);
    } else {
      await sb.from('favorites').insert({ user_id: currentUserId, car_id: carId });
    }
    isFav = !isFav;
    load();
  };

  window.markSold = async function() {
    await sb.from('cars').update({ sold: true }).eq('id', carId);
    fetch('/api/post-to-partner-channel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ carId: carId, eventType: 'sold' })
    }).catch(() => {});
    load();
  };

  load();
</script>

</body>
