<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#8E00FF">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NORMALNO">

<title>NORMALNO — Підбір авто</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js?v=1786440586"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .logo { text-align: center; font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 20px; }
  input, select, textarea {
    width: 100%; padding: 14px; margin-bottom: 10px; border: 1px solid #ddd;
    border-radius: 10px; font-size: 15px; font-family: Arial, sans-serif;
  }
  textarea { min-height: 80px; resize: vertical; }
  button.main {
    width: 100%; padding: 15px; background: #8E00FF; color: white; border: none;
    border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
  }
  .msg { text-align: center; margin-top: 12px; font-size: 14px; }
  .section-title { font-size: 14px; font-weight: bold; color: #666; margin-bottom: 10px; }
  .recent-list { margin-bottom: 22px; }
  .recent-item { border: 1px solid #eee; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; color: #444; }
  .recent-time { font-size: 11px; color: #bbb; margin-top: 3px; }
</style>
</head>
<body>

<a href="index.html" class="back">&larr; Назад на головну</a>
<div class="logo">⭐ Підбір авто</div>
<div class="subtitle">Розкажіть, що шукаєте — ми підберемо варіанти</div>

<div class="section-title">🔍 Зараз шукають</div>
<div id="recentRequests" class="recent-list">Завантаження...</div>

<input type="text" id="name" placeholder="Ваше ім'я">
<input type="tel" id="phone" placeholder="Номер телефону">
<input type="number" id="budget" placeholder="Бюджет (сума)">
<select id="paymentType">
  <option value="">Тип оплати — оберіть</option>
  <option value="cash">Готівка</option>
  <option value="credit">Кредит</option>
  <option value="leasing">Лізинг</option>
  <option value="installment">Розстрочка</option>
</select>
<div class="picker-field ph" id="regionField" onclick="openRegionPicker()">
  <span class="picker-value" id="regionField_value">Регіон — оберіть</span>
  <span class="picker-arrow">▾</span>
</div>
<textarea id="comment" placeholder="Побажання щодо авто (марка, тип, рік і т.д.)"></textarea>

<button class="main" onclick="submitLead()">Надіслати заявку</button>
<div class="msg" id="msg"></div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    try { tg.expand(); } catch (e) {}
    if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) {
      try { tg.disableVerticalSwipes(); } catch (e) {}
    }
  }

  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';

  async function loadRecentRequests() {
    const { data } = await sb.from('public_leads_preview').select('budget, payment_type, region, details, created_at').eq('type', 'car_selection').order('created_at', { ascending: false }).limit(6);
    const el = document.getElementById('recentRequests');
    if (!data || data.length === 0) { el.innerHTML = '<div class="recent-item">Поки немає запитів — станьте першим!</div>'; return; }

    const paymentLabels = { cash: 'Готівка', credit: 'Кредит', leasing: 'Лізинг', installment: 'Розстрочка' };
    el.innerHTML = data.map(l => `
      <div class="recent-item">
        ${l.budget ? `Бюджет до $${Number(l.budget).toLocaleString('uk-UA')}` : 'Бюджет не вказано'}
        ${l.payment_type ? ` · ${paymentLabels[l.payment_type] || l.payment_type}` : ''}
        ${l.region ? ` · ${l.region}` : ''}
        ${l.details ? `<div>${l.details}</div>` : ''}
        <div class="recent-time">${timeAgo(l.created_at)}</div>
      </div>
    `).join('');
  }
  loadRecentRequests();
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  let selectedRegion = '';
  function openRegionPicker() {
    openSearchPicker('Регіон', UA_REGIONS, selectedRegion, (val) => {
      selectedRegion = val;
      document.getElementById('regionField_value').textContent = val;
      document.getElementById('regionField').classList.remove('ph');
    });
  }

  async function submitLead() {
    const msg = document.getElementById('msg');
    const { data: { session } } = await sb.auth.getSession();

    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;

    if (!name || !phone) {
      msg.textContent = 'Заповніть ім\'я та телефон';
      msg.style.color = 'red';
      return;
    }

    const details = `Побажання: ${document.getElementById('comment').value || '—'}`;

    const { error } = await sb.from('leads').insert({
      type: 'car_selection',
      user_id: session ? session.user.id : null,
      name: name,
      phone: phone,
      budget: parseFloat(document.getElementById('budget').value) || null,
      payment_type: document.getElementById('paymentType').value,
      region: selectedRegion,
      details: details
    });

    if (error) {
      msg.textContent = error.message;
      msg.style.color = 'red';
      return;
    }

    fetch('/api/notify-lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        leadType: 'car_selection', name, phone,
        summary: `Бюджет: ${document.getElementById('budget').value || '—'}, оплата: ${document.getElementById('paymentType').value || '—'}, регіон: ${selectedRegion || '—'}`
      })
    }).catch(() => {});

    msg.textContent = 'Дякуємо! Менеджер зв\'яжеться з вами найближчим часом.';
    msg.style.color = 'green';
  }
</script>

</body>
</html>
