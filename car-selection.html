<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NORMALNO — Підбір авто</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="car-data.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #fff; margin: 0; padding: 20px; }
  .back { color: #FF7A00; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 10px; }
  .logo { text-align: center; font-size: 20px; font-weight: bold; color: #8E00FF; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #999; font-size: 13px; margin-bottom: 20px; }
  input, select, textarea {
    width: 100%; padding: 14px; margin-bottom: 10px; border: 1px solid #ddd;
    border-radius: 10px; font-size: 15px; font-family: Arial, sans-serif;
  }
  textarea { min-height: 80px; resize: vertical; }
  button.main {
    width: 100%; padding: 15px; background: #8E00FF; color: white; border: none;
    border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;
  }
  .msg { text-align: center; margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>

<a href="index.html" class="back">&larr; Назад на головну</a>
<div class="logo">⭐ Підбір авто</div>
<div class="subtitle">Розкажіть, що шукаєте — ми підберемо варіанти</div>

<input type="text" id="name" placeholder="Ваше ім'я">
<input type="tel" id="phone" placeholder="Номер телефону">
<input type="number" id="budget" placeholder="Бюджет (сума)">
<select id="paymentType">
  <option value="">Тип оплати — оберіть</option>
  <option value="cash">Готівка</option>
  <option value="credit">Кредит</option>
  <option value="leasing">Лізинг</option>
  <option value="installment">Розстрочка</option>
</select>
<select id="region"></select>
<textarea id="comment" placeholder="Побажання щодо авто (марка, тип, рік і т.д.)"></textarea>

<button class="main" onclick="submitLead()">Надіслати заявку</button>
<div class="msg" id="msg"></div>

<script>
  if (window.Telegram && window.Telegram.WebApp) {
    const tg = window.Telegram.WebApp;
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if (tg.requestFullscreen) { try { tg.requestFullscreen(); } catch (e) {} }
  }

  const supabaseUrl = 'https://ipzvgqyjtqofthbpkdsd.supabase.co';
  const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwenZncXlqdHFvZnRoYnBrZHNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMTEwNjEsImV4cCI6MjEwMTU4NzA2MX0.jbbpKpHaD6S9SJMIbxcwb12ggBCv44J_-s4OQ8ESNfA';
  const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

  populateRegionSelect(document.getElementById('region'), 'Регіон — оберіть');

  async function submitLead() {
    const msg = document.getElementById('msg');
    const { data: { session } } = await sb.auth.getSession();

    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;

    if (!name || !phone) {
      msg.textContent = 'Заповніть ім\'я та телефон';
      msg.style.color = 'red';
      return;
    }

    const details = `Побажання: ${document.getElementById('comment').value || '—'}`;

    const { error } = await sb.from('leads').insert({
      type: 'car_selection',
      user_id: session ? session.user.id : null,
      name: name,
      phone: phone,
      budget: parseFloat(document.getElementById('budget').value) || null,
      payment_type: document.getElementById('paymentType').value,
      region: document.getElementById('region').value,
      details: details
    });

    if (error) {
      msg.textContent = error.message;
      msg.style.color = 'red';
      return;
    }

    fetch('/api/notify-lead', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        leadType: 'car_selection', name, phone,
        summary: `Бюджет: ${document.getElementById('budget').value || '—'}, оплата: ${document.getElementById('paymentType').value || '—'}, регіон: ${document.getElementById('region').value || '—'}`
      })
    }).catch(() => {});

    msg.textContent = 'Дякуємо! Менеджер зв\'яжеться з вами найближчим часом.';
    msg.style.color = 'green';
  }
</script>

</body>
</html>
